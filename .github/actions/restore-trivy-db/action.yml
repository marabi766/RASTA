name: Restore the shared Trivy DB
description: >-
  Downloads the vulnerability DB the `trivy-db` job of this run published, and
  fails unless it is exactly the copy that producer validated (same key, run
  and attempt, same bytes) and at most 24 h old. Used by every Trivy scan;
  none of them downloads a DB of its own. See scripts/ci-trivy-db-lib.mjs and
  the `trivy-db` job in ci.yml.
inputs:
  key:
    description: needs.trivy-db.outputs.key. Empty means the producer failed.
    required: false
    default: ''
outputs:
  dir:
    description: Trivy cache directory holding the restored DB (pass as cache-dir).
    value: ${{ steps.where.outputs.dir }}
runs:
  using: composite
  steps:
    - name: Require the key of the shared Trivy DB
      # A consumer whose producer failed or was skipped still runs (see the
      # `if:` on the callers) and ends here, red, instead of being skipped,
      # which a required check would count as a passing scan.
      id: where
      shell: bash
      env:
        KEY: ${{ inputs.key }}
      run: |
        if [ -z "$KEY" ]; then
          echo "::error::The trivy-db job published no database for this run; refusing to scan without one."
          exit 1
        fi
        # Outside the checkout, so no image build context carries it.
        echo "dir=$RUNNER_TEMP/trivy-db" >> "$GITHUB_OUTPUT"
        echo "archive=$RUNNER_TEMP/trivy-db-artifact" >> "$GITHUB_OUTPUT"

    - name: Download the shared Trivy DB
      # By exact name, from this run (an artifact, not actions/cache: the
      # cache entry was evicted before the image scans needed it, see the
      # `trivy-db` job). No pattern: nothing but the producer's artifact. A
      # missing artifact fails the step.
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.key }}
        path: ${{ steps.where.outputs.archive }}

    - name: Unpack exactly the producer's archive
      # One file, trivy-db.tar.zst, holding only regular files and
      # directories under trivy-db/ (no links, no `..`); whatever was in the
      # target before is removed first.
      shell: bash
      env:
        ARCHIVE_DIR: ${{ steps.where.outputs.archive }}
        TRIVY_DB_DIR: ${{ steps.where.outputs.dir }}
      run: |
        set -euo pipefail
        shopt -s nullglob dotglob
        files=("$ARCHIVE_DIR"/*)
        if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "$ARCHIVE_DIR/trivy-db.tar.zst" ]; then
          echo "::error::The downloaded artifact is not exactly trivy-db.tar.zst; refusing to scan with it."
          exit 1
        fi
        listing="$(zstd -dc "${files[0]}" | tar -tvf -)"
        names="$(zstd -dc "${files[0]}" | tar -tf -)"
        if printf '%s\n' "$listing" | cut -c1 | grep -q -v -E '^[-d]$' ||
          printf '%s\n' "$names" | grep -q -v -E '^trivy-db(/[A-Za-z0-9._-]+)*/?$' ||
          printf '%s\n' "$names" | grep -q -E '(^|/)\.\.(/|$)'; then
          echo "::error::The Trivy DB archive holds something other than files under trivy-db/; refusing to scan with it."
          exit 1
        fi
        rm -rf "$TRIVY_DB_DIR"
        zstd -dc "${files[0]}" | tar -C "$(dirname "$TRIVY_DB_DIR")" --no-same-owner -xf -

    - name: Check the restored Trivy DB
      shell: bash
      env:
        TRIVY_DB_DIR: ${{ steps.where.outputs.dir }}
        TRIVY_DB_KEY: ${{ inputs.key }}
      run: node scripts/ci-trivy-db.mjs check "$TRIVY_DB_DIR" "$TRIVY_DB_KEY"
