name: Restore the shared Trivy DB
description: >-
  Restores the vulnerability DB the `trivy-db` job of this run published, and
  fails unless it is exactly the copy that producer validated (same key, run
  and attempt, same bytes) and at most 24 h old. Used by every Trivy scan;
  none of them downloads a DB of its own. See scripts/ci-trivy-db-lib.mjs and
  the `trivy-db` job in ci.yml.
inputs:
  key:
    description: needs.trivy-db.outputs.key. Empty means the producer failed.
    required: false
    default: ''
outputs:
  dir:
    description: Trivy cache directory holding the restored DB (pass as cache-dir).
    value: ${{ steps.where.outputs.dir }}
runs:
  using: composite
  steps:
    - name: Require the key of the shared Trivy DB
      # A consumer whose producer failed or was skipped still runs (see the
      # `if:` on the callers) and ends here, red, instead of being skipped,
      # which a required check would count as a passing scan.
      id: where
      shell: bash
      env:
        KEY: ${{ inputs.key }}
      run: |
        if [ -z "$KEY" ]; then
          echo "::error::The trivy-db job published no database for this run; refusing to scan without one."
          exit 1
        fi
        # The producer's path (`runner.temp`/trivy-db in ci.yml), outside the
        # checkout so no image build context carries it. actions/cache
        # versions an entry by its path, so this string must match exactly.
        echo "dir=$RUNNER_TEMP/trivy-db" >> "$GITHUB_OUTPUT"

    - name: Restore the shared Trivy DB
      # Exact key only. No restore-keys: a prefix match could hand this scan
      # another run's (older) copy, which is what the action's own daily cache
      # does. A miss fails the step.
      id: restore
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.where.outputs.dir }}
        key: ${{ inputs.key }}
        fail-on-cache-miss: true

    - name: Require an exact hit on the producer's key
      # `fail-on-cache-miss` and the absence of restore-keys do not by
      # themselves prove an exact match: the restore can succeed on another
      # entry with `cache-hit` other than 'true' (PR #435 review, F4). Only an
      # exact hit on the key the producer published is accepted.
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        if [ "$CACHE_HIT" != "true" ] || [ "$MATCHED_KEY" != "$KEY" ]; then
          echo "::error::Restored '${MATCHED_KEY}' (cache-hit '${CACHE_HIT}'), not an exact hit on '${KEY}'; refusing to scan with it."
          exit 1
        fi

    - name: Check the restored Trivy DB
      shell: bash
      env:
        TRIVY_DB_DIR: ${{ steps.where.outputs.dir }}
        TRIVY_DB_KEY: ${{ inputs.key }}
      run: node scripts/ci-trivy-db.mjs check "$TRIVY_DB_DIR" "$TRIVY_DB_KEY"
