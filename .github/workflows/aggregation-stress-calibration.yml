name: Aggregation stress calibration (temporary)

# TEMPORARY — ADR-055 § 6 evidence collection. Removed from the branch in the
# same iteration, as soon as one run is captured.
#
# **Why this exists.** ADR-055 § 6 refuses to choose a capability threshold
# until a *paired* dataset exists: each sample is one validated 60 s WAL probe
# immediately followed by one unchanged run of identity-service's
# aggregation-stress proof, on the same database. No such dataset has ever been
# collected.
#
# **Why not locally.** The only local host available runs a pre-existing `rasta`
# Compose stack whose sixteen services all carry `restart: unless-stopped`.
# Starting its stopped Docker daemon would restart `rasta-postgres` and its
# siblings — which this campaign must not do — and a WAL-commit measurement
# taken beside a live Kafka/Keycloak/Temporal stack sharing one VM, one virtual
# disk and one CPU set is not a quiet measurement. The repository's own numbers
# show the sensitivity: 14.6–23.0 tps on the shared volume against 26.0–26.6 tps
# on a disposable instance, same probe. So collection moves to a dedicated,
# ephemeral, native-Ubuntu runner with exactly one service container.
#
# **What this job is not.** It applies no threshold, no safety margin and no
# capability judgement; it adds nothing to ordinary CI, to `pnpm verify` or to
# the test phases; it induces no load and manufactures no failure; and it
# changes nothing the proof asserts. The stress spec, probe SQL, validity
# bounds, timeouts, lane and write counts and the harness are untouched — a
# sample collected by loosening the proof would say nothing about the proof.
#
# A push trigger on the one feature branch rather than `pull_request`: that
# branch's draft PR conflicts with `main`, and GitHub runs no `pull_request`
# workflow for a conflicting PR. A push also measures the exact commit rather
# than a merge with `main`.
#
# Harness and reasoning: `scripts/aggregation-evidence-lib.mjs`,
# `docs/adr/ADR-055-aggregation-stress-environment-capability.md`.
on:
  push:
    branches: [feat/audit-service-aud-004-contract]

concurrency:
  # Never cancel: a half-measured campaign is not a shorter campaign, it is a
  # dataset with a hole in it.
  group: aggregation-calibration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.22.0'

jobs:
  aggregation-calibration:
    name: ADR-055 paired calibration (native Ubuntu, 20 pairs)
    runs-on: ubuntu-latest
    # One 20-pair campaign is 20 × (60 s probe + one full stress project run)
    # plus a control and setup — roughly an hour on this runner class. The
    # bound is generous because the campaign is never retried.
    timeout-minutes: 120

    # Exactly one service container. No Kafka, Redis, Keycloak, Temporal,
    # MinIO, ClamAV or application service: anything else on this machine would
    # be measured as storage load and would silently become part of the sample.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Harness tests (no infrastructure)
        # The parsers, validity rules, diagnostic scopes, report shape and the
        # static campaign contract first, so a harness that stopped measuring
        # what it claims fails before a single sample is taken.
        run: |
          pnpm run test:aggregation-evidence-lib
          pnpm run check:test-phases

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          POSTGRES_USER: rasta
          POSTGRES_SERVICE_PASSWORD: rasta_ci_service_password
        run: |
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - name: Generate and build identity-service dependencies
        run: |
          pnpm --filter @rasta/identity-service run db:generate
          pnpm exec turbo run build --filter=@rasta/identity-service^...

      - name: Apply identity migrations
        run: pnpm --filter @rasta/identity-service run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_ci_service_password@localhost:5432/rasta_identity?schema=public

      - name: Environment provenance
        # Names and fixed-shape values only. No connection string, no password,
        # no `docker inspect`, no environment dump, no workspace path: a
        # provenance block that leaks is worse than no provenance block.
        #
        # `docker ps` is restricted to the image column on purpose — it is the
        # evidence that PostgreSQL is the only container on this machine, and
        # the only column that carries no identity.
        env:
          PGPASSWORD: rasta_ci_password
        run: |
          echo "runner_image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
          echo "kernel=$(uname -r)"
          echo "cpus=$(nproc)"
          echo "memory_gib=$(awk '/MemTotal/ {printf "%.1f", $2/1048576}' /proc/meminfo)"
          echo "docker_storage_driver=$(docker info --format '{{.Driver}}')"
          echo "containers_running=$(docker ps -q | wc -l)"
          echo "container_images:"
          docker ps --format '{{.Image}}' | sed 's/^/  /'
          psql -h 127.0.0.1 -p 5432 -U rasta -d postgres -X -A -t -q -c \
            "SELECT format('%s=%s', name, setting) FROM pg_settings
             WHERE name IN ('server_version','fsync','synchronous_commit',
                            'wal_level','wal_sync_method','full_page_writes',
                            'shared_buffers','max_connections','max_wal_size',
                            'checkpoint_timeout')
             ORDER BY name"

      - name: Paired calibration campaign (20 pairs, one run, no retry)
        # One campaign, no retry, nothing else running beside it. Every step
        # runs even after a failing one, so the artifact keeps the whole
        # distribution rather than stopping at the first bad sample; a failed
        # step, an invalid probe or an unwritten report all keep the exit
        # non-zero. The report is written by the harness and never edited.
        #
        # Host-side jest reaches the service over the published loopback port;
        # the harness's `psql`/`pgbench` containers reach the same port through
        # Docker `host` networking, which is `EVIDENCE_DOCKER_NETWORK`'s default
        # and the topology this repository has already measured on Linux.
        run: pnpm run calibrate:aggregation-stress -- --pairs 20 "$RUNNER_TEMP/quiet-calibration.txt"
        env:
          NODE_ENV: test
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_ci_service_password@localhost:5432/rasta_identity?schema=public
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: rasta
          PGPASSWORD: rasta_ci_password
          PGDATABASE: postgres
          EVIDENCE_PG_IMAGE: postgis/postgis:16-3.4

      - name: Upload the calibration artifact
        # `always()`: a campaign that refused or failed still produced the one
        # record of what happened, and that record is the point.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adr-055-quiet-calibration
          path: ${{ runner.temp }}/quiet-calibration.txt
          retention-days: 3
          if-no-files-found: error
