name: Aggregation stress cost observation (temporary)

# TEMPORARY — ADR-055 planning input, not ADR-055 § 6 evidence. Removed from the
# branch in the same iteration, as soon as this one run is captured.
#
# **What this is, in one sentence.** One bounded observation of how long the
# *unchanged* aggregation stress suite costs on a deliberately constrained
# PostgreSQL, so the next paired campaign can be given parameters that fit
# instead of parameters that were guessed.
#
# **Why it is needed.** The first induced attempt
# (`aggregation-stress-induced-calibration.yml`, run `34997524401`) applied
# `0.005 CPU` and the very first stress run produced no output for two hours
# fifty-seven minutes before an external job deadline ended it. Two independent
# blockers came out of that: the harness bound did not actually terminate the
# tree, and `0.005 CPU` is simply too severe for twenty pairs. The first is now
# repaired and regression-tested. The second cannot be repaired by reasoning —
# the cost of one constrained suite run has never been measured, so no quota,
# pair count or job timeout can be chosen honestly. This run measures exactly
# that one number, once.
#
# **The condition, and why this value.** A fixed CFS CPU quota of 50 000 µs per
# 1 000 000 µs period — `0.05 CPU` — on the PostgreSQL service container and
# nothing else. That is a deliberate **tenfold relaxation** of the known-unusable
# `0.005 CPU` condition, while still being ~1/80 of the four unconstrained CPUs
# the quiet campaign measured (`stress_wall_s` median 57.64 s there). It is a
# first planning point, not a calibrated one, and this workflow does not claim
# it is the right one: if the suite still cannot finish inside the bound, that
# is itself the finding, and the next single observation gets a looser quota.
#
# **What this is not.** Not a pair, not a sample, not a distribution, not the
# failure side of § 6. No probe, no control, no `calibrate:aggregation-stress`,
# no retry, no second quota, no variation during the run. It applies no
# threshold, no safety margin and no capability judgement; it adds no
# `VALID_CAPABLE`/`VALID_INCAPABLE`, no classifier, no phase preflight, no
# fail-fast gate, no bypass and no skip-green behaviour; and it adds nothing to
# ordinary CI (`ci.yml` is untouched), to `pnpm verify` or to the test phases.
# The stress spec, the probe SQL, `PROBE_VALIDITY`, the selectors, the timeouts,
# the lane and write counts and the harness are exactly what they are on this
# branch — an observation taken by loosening the proof would describe a proof
# that does not exist.
#
# **Why a disposable runner.** Unchanged from the earlier campaigns: the only
# local host runs a pre-existing `rasta` Compose stack whose sixteen services
# all carry `restart: unless-stopped`, and no local Docker resource may be
# constrained. Both the runner and the constrained container here are created
# and destroyed by this one run.
#
# A push trigger on the one feature branch rather than `pull_request`: that
# branch's draft PR conflicts with `main`, and GitHub runs no `pull_request`
# workflow for a conflicting PR. A push also observes the exact commit rather
# than a merge with `main`.
#
# Harness and reasoning: `scripts/aggregation-evidence.mjs`,
# `docs/adr/ADR-055-aggregation-stress-environment-capability.md`.
on:
  push:
    branches: [feat/audit-service-aud-004-contract]

concurrency:
  # Never cancel: this is a cost measurement, and a cancelled measurement is not
  # a cheaper one, it is a number that does not exist.
  group: aggregation-cost-observation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.22.0'
  # The candidate constraint, named once and used everywhere: 50 000 µs of CPU
  # per 1 000 000 µs period on the PostgreSQL service container only. Named
  # constants rather than inline numbers so the applied value and the verified
  # value are provably the same two numbers.
  CPU_PERIOD_US: '1000000'
  CPU_QUOTA_US: '50000'
  # The hard bound handed to the harness runner, in minutes. The job timeout
  # below must cover setup plus this.
  OBSERVATION_BOUND_MINUTES: '30'

jobs:
  aggregation-cost-observation:
    name: ADR-055 constrained suite cost observation (native Ubuntu, one run)
    runs-on: ubuntu-latest
    # Setup is ~4 minutes on this topology and the observed process is bounded
    # at 30. Sixty is the ceiling allowed for this step and leaves the bound
    # room to fire *inside* the job, so a suite that overruns is reported as a
    # harness `timedOut` with real times rather than as an external kill with
    # none — which is exactly what went wrong on 2026-09-15.
    timeout-minutes: 60

    # Exactly one service container. No Kafka, Redis, Keycloak, Temporal, MinIO,
    # ClamAV or application service: anything else on this machine would be
    # measured as storage load, and — worse here — the image filter that
    # resolves the container to constrain would stop being unambiguous.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Harness tests and static contract (no infrastructure)
        # Before the quota, and never beside the measurement: the runner's own
        # process-bound regressions, the parsers, the validity rules, the
        # diagnostic scopes and the static phase contract first, so a harness
        # that stopped bounding — or a contract that drifted — fails before a
        # single second of cost is attributed to the database.
        run: |
          pnpm run test:aggregation-evidence-lib
          pnpm run check:test-phases

      - name: Provision databases, roles and extensions
        # Provisioning and migrations run on the *unconstrained* service. The
        # constraint is a condition on the observation, not a way to break
        # setup: a run that never reached a usable schema would say nothing
        # about the cost of the suite.
        env:
          PGPASSWORD: rasta_ci_password
          POSTGRES_USER: rasta
          POSTGRES_SERVICE_PASSWORD: rasta_ci_service_password
        run: |
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - name: Generate and build identity-service dependencies
        run: |
          pnpm --filter @rasta/identity-service run db:generate
          pnpm exec turbo run build --filter=@rasta/identity-service^...

      - name: Apply identity migrations
        run: pnpm --filter @rasta/identity-service run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_ci_service_password@localhost:5432/rasta_identity?schema=public

      - name: Environment provenance
        # Names and fixed-shape values only. No connection string, no password,
        # no broad `docker inspect`, no environment dump, no workspace path: a
        # provenance block that leaks is worse than no provenance block.
        #
        # `docker ps` is restricted to the image column on purpose — it is the
        # evidence that PostgreSQL is the only container on this machine, and
        # the only column that carries no identity.
        #
        # Collected *before* the quota rather than after it, unlike the earlier
        # induced workflow: none of these facts can be changed by a CPU quota,
        # and a settings query is not worth running against a throttled server
        # when the whole point of the next step is to measure that throttling.
        # The block is written to a file as well as echoed, so the artifact's
        # topology line is the same text the log shows.
        env:
          PGPASSWORD: rasta_ci_password
        run: |
          set -euo pipefail
          {
            echo "runner_os=$(lsb_release -ds 2>/dev/null | tr -d '"' || echo unknown)"
            echo "runner_image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
            echo "kernel=$(uname -r)"
            echo "cpus=$(nproc)"
            echo "memory_gib=$(awk '/MemTotal/ {printf "%.1f", $2/1048576}' /proc/meminfo)"
            echo "docker_storage_driver=$(docker info --format '{{.Driver}}')"
            echo "containers_running=$(docker ps -q | wc -l)"
            echo "container_images=$(docker ps --format '{{.Image}}' | paste -sd, -)"
            psql -h 127.0.0.1 -p 5432 -U rasta -d postgres -X -A -t -q -c \
              "SELECT format('%s=%s', name, setting) FROM pg_settings
               WHERE name IN ('server_version','fsync','synchronous_commit',
                              'wal_level','wal_sync_method','full_page_writes',
                              'shared_buffers','max_connections','max_wal_size',
                              'checkpoint_timeout')
               ORDER BY name"
          } | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/observation-provenance.txt"
          cat "$RUNNER_TEMP/observation-provenance.txt"

      - name: Apply and verify the candidate CPU constraint
        # Resolve the one service container by its exact image and refuse on any
        # other count: constraining the wrong container, or constraining nothing
        # and measuring anyway, both produce a number that lies about its own
        # conditions. The identifier is captured and never printed.
        #
        # `docker update` writes the container name to stdout on success, so it
        # is silenced. Verification reads exactly two fields — never broad
        # `docker inspect` output — and the job dies here, before any
        # measurement, if either number is not the constant that was asked for.
        # The two read-back values are exported so the artifact reports what was
        # *verified* rather than what was requested.
        run: |
          set -euo pipefail
          ids="$(docker ps --quiet --filter "ancestor=postgis/postgis:16-3.4")"
          count="$(printf '%s' "$ids" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one postgis/postgis:16-3.4 container, found $count" >&2
            exit 1
          fi
          docker update --cpu-period "$CPU_PERIOD_US" --cpu-quota "$CPU_QUOTA_US" "$ids" >/dev/null
          period="$(docker inspect --format '{{.HostConfig.CpuPeriod}}' "$ids")"
          quota="$(docker inspect --format '{{.HostConfig.CpuQuota}}' "$ids")"
          echo "applied_cpu_period_us=$period"
          echo "applied_cpu_quota_us=$quota"
          if [ "$period" != "$CPU_PERIOD_US" ] || [ "$quota" != "$CPU_QUOTA_US" ]; then
            echo "candidate condition did not apply exactly; refusing to measure" >&2
            exit 1
          fi
          echo "VERIFIED_CPU_PERIOD_US=$period" >> "$GITHUB_ENV"
          echo "VERIFIED_CPU_QUOTA_US=$quota" >> "$GITHUB_ENV"

      - name: Write the observation wrapper
        # The bound is *not* reimplemented here. This wrapper exists only to
        # call the repaired, exported `runBounded` — the same function the
        # campaign uses, with the same `LAUNCHER.pnpm`, the same detached
        # process group and the same settle-on-`exit` semantics — and to turn
        # its single typed result into a sanitized line block. Duplicating the
        # process-tree logic in shell is exactly the mistake that let a stress
        # step outlive its bound for three hours on 2026-09-15.
        #
        # It lives in the runner temp directory rather than in the repository:
        # it is as temporary as this workflow and must leave no residue behind.
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/observe.mjs" <<'OBSERVE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const temp = process.env.RUNNER_TEMP;
          const workspace = process.env.GITHUB_WORKSPACE;
          const load = (name) => import(pathToFileURL(join(workspace, 'scripts', name)).href);

          // The repaired runner itself. Importing it is safe: the CLI only runs
          // when that file is the process entry point.
          const { runBounded } = await load('aggregation-evidence.mjs');
          const { LAUNCHER, PROCESS_OUTCOME, STRESS, countCategories, summarizeJestReport } =
            await load('aggregation-evidence-lib.mjs');

          const boundMs = Number(process.env.OBSERVATION_BOUND_MINUTES) * 60_000;
          const reportPath = join(temp, 'observation-jest.json');
          const artifactPath = join(temp, 'aggregation-stress-cost-observation.txt');

          // Provenance arrives as fixed `key=value` lines from the previous
          // step. Every line is re-validated here against a conservative shape,
          // so nothing unexpected — a path, an id, a URL, a credential — can
          // reach the artifact through that file. A rejected line refuses the
          // whole observation rather than being dropped quietly.
          const ALLOWED = /^[a-z_]+=[A-Za-z0-9 ._/:,+()-]*$/;
          const provenance = readFileSync(join(temp, 'observation-provenance.txt'), 'utf8')
            .split('\n')
            .map((line) => line.trim())
            .filter((line) => line.length > 0);
          for (const line of provenance) {
            if (!ALLOWED.test(line)) {
              process.stderr.write('a provenance line failed the artifact filter; refusing\n');
              process.exit(2);
            }
          }

          // Exactly one process: fresh, unfiltered, no probe, no control, no
          // retry. `--json --outputFile` is what the campaign's own full-project
          // step passes; it selects nothing and skips nothing, it only makes the
          // aggregate counts readable without touching raw output.
          const result = await runBounded(
            LAUNCHER.pnpm,
            ['run', STRESS.rootScript, '--', '--json', `--outputFile=${reportPath}`],
            { env: { ...process.env, NODE_ENV: 'test' }, timeoutMs: boundMs },
          );

          let report = null;
          if (existsSync(reportPath)) {
            try {
              report = JSON.parse(readFileSync(reportPath, 'utf8'));
            } catch {
              report = null;
            }
          }
          const summary = report ? summarizeJestReport(report) : null;
          const wallSeconds = (result.endedAt - result.startedAt) / 1000;
          const counts = (row) =>
            Object.entries(row)
              .map(([name, value]) => `${name}=${value}`)
              .join(' ');

          const lines = [
            'ADR-055 constrained aggregation stress cost observation',
            'purpose: planning-only; not ADR-055 section 6 paired evidence',
            'scope: one fresh unfiltered `pnpm run test:aggregation-stress` process, bounded,',
            '  under one fixed external CPU quota on the PostgreSQL container only',
            'not collected: no probe, no control, no pair, no distribution, no retry, no second quota',
            'not decided: no threshold, no safety margin, no capability judgement, no runtime or CI policy',
            `commit=${process.env.GITHUB_SHA} observed_at_utc=${new Date().toISOString()}`,
            `topology: ${provenance.join(' ')}`,
            `constraint: scope=postgres-service-container-only cpus=0.05` +
              ` requested_cpu_period_us=${process.env.CPU_PERIOD_US}` +
              ` requested_cpu_quota_us=${process.env.CPU_QUOTA_US}` +
              ` verified_cpu_period_us=${process.env.VERIFIED_CPU_PERIOD_US}` +
              ` verified_cpu_quota_us=${process.env.VERIFIED_CPU_QUOTA_US}`,
            `process: outcome=${result.outcome} timed_out=${result.timedOut ? 'yes' : 'no'}` +
              ` exit_status=${result.exitCode} bound_s=${boundMs / 1000}`,
            `  started_utc=${result.startedAt.toISOString()} ended_utc=${result.endedAt.toISOString()}` +
              ` wall_s=${wallSeconds.toFixed(1)}`,
          ];
          if (summary) {
            const { suites, tests } = summary;
            lines.push(
              'suite: jest_report=present',
              `  suites passed/failed/skipped/total=${suites.passed}/${suites.failed}/${suites.skipped}/${suites.total}`,
              `  tests passed/failed/skipped/total=${tests.passed}/${tests.failed}/${tests.skipped}/${tests.total}`,
              `  failures: ${counts(summary.failures)}`,
              `  infrastructure: ${counts(countCategories(summary.diagnostics))}`,
            );
          } else {
            lines.push(
              'suite: jest_report=absent',
              '  no suite, test or failure-category count exists for this observation;',
              '  the wall time above is censored at the bound, not a completed cost',
            );
          }

          const text = `${lines.join('\n')}\n`;
          writeFileSync(artifactPath, text);
          process.stdout.write(text);

          // The suite's own verdict is preserved. A green light over a failed or
          // censored proof is exactly what ADR-055 section 3 forbids, and here it
          // would also hide the one fact the observation exists to report.
          const clean =
            result.outcome === PROCESS_OUTCOME.completed &&
            result.exitCode === 0 &&
            summary !== null &&
            summary.problems.length === 0;
          if (clean) process.exit(0);
          process.exit(Number.isInteger(result.exitCode) && result.exitCode !== 0 ? result.exitCode : 1);
          OBSERVE

      - name: Observe one constrained stress run (one process, bounded, no retry)
        # A NON-ZERO EXIT MAY WELL BE THE MEASUREMENT HERE. Under a 0.05 CPU
        # quota the unchanged suite may fail or may not finish inside its bound;
        # either is a usable planning fact and neither may be painted green.
        # The status is captured only so the artifact steps still run, then
        # re-raised unchanged.
        #
        # The raw subprocess output never reaches this log: `runBounded` keeps it
        # in memory and the wrapper prints only the sanitized block.
        run: |
          set +e
          node "$RUNNER_TEMP/observe.mjs"
          status=$?
          set -e
          echo "observation_exit=$status"
          exit "$status"
        env:
          NODE_ENV: test
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_ci_service_password@localhost:5432/rasta_identity?schema=public

      - name: Upload the cost observation artifact
        # `always()`: an observation that failed or timed out still produced the
        # one record of what happened, and here that record *is* the point.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adr-055-cost-observation
          path: ${{ runner.temp }}/aggregation-stress-cost-observation.txt
          retention-days: 3
          if-no-files-found: error
