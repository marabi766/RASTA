name: Aggregation stress evidence (temporary)

# TEMPORARY — AUD-004 evidence, removed from the branch once a valid run is
# captured. Measures identity-service's four-client 500-capture aggregation
# proof on a native Ubuntu runner, against the same PostgreSQL service image
# and identity migrations as ci.yml's `integration` job, with nothing else on
# that database. Locally the proof has failed only under Docker Desktop host
# load; the native-Linux distribution is the missing input to any fail-fast
# storage-capability precondition, so this job sets no threshold and changes
# nothing the proof asserts. Harness and reasoning:
# `scripts/aggregation-evidence-lib.mjs`.
#
# A push trigger on the one feature branch rather than `pull_request`: that
# branch's draft PR conflicts with main, and GitHub runs no `pull_request`
# workflow for a conflicting PR. A push also measures the exact commit rather
# than a merge with main.
on:
  push:
    branches: [feat/audit-service-aud-004-contract]

concurrency:
  group: aggregation-evidence-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.22.0'

jobs:
  aggregation-evidence:
    name: Aggregation stress evidence (native Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Evidence harness tests
        # Parsers, probe validation and the static contract first, so a harness
        # that stopped measuring what it claims fails before anything runs.
        run: node --test scripts/aggregation-evidence.test.mjs

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          POSTGRES_USER: rasta
          POSTGRES_SERVICE_PASSWORD: rasta_ci_service_password
        run: |
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - name: Generate and build identity-service dependencies
        run: |
          pnpm --filter @rasta/identity-service run db:generate
          pnpm exec turbo run build --filter=@rasta/identity-service^...

      - name: Apply identity migrations
        run: pnpm --filter @rasta/identity-service run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_ci_service_password@localhost:5432/rasta_identity?schema=public

      - name: Collect evidence
        # Every step runs and none is retried; any failed run, invalid probe or
        # unwritten report fails this step.
        run: node scripts/aggregation-evidence.mjs "$RUNNER_TEMP/aggregation-stress-evidence.txt"
        env:
          NODE_ENV: test
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_ci_service_password@localhost:5432/rasta_identity?schema=public
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: rasta
          PGPASSWORD: rasta_ci_password
          PGDATABASE: postgres
          EVIDENCE_PG_IMAGE: postgis/postgis:16-3.4

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aggregation-stress-evidence
          path: ${{ runner.temp }}/aggregation-stress-evidence.txt
          retention-days: 7
          if-no-files-found: error
