name: Backup restore drill

# One source of truth for CI, nightly (including the original monthly date), and dispatch.
# CI calls this workflow beside its other jobs; a separate workflow cannot gate the train.
on:
  workflow_call:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily on main, including the 1st of every month
  workflow_dispatch:

# Read the repository, nothing else. No secret is referenced in this file (the repository is
# public); the guard test refuses one.
permissions:
  contents: read

concurrency:
  # Distinct caller runs cannot replace a drill or hold up another PR's drill.
  group: backup-drill-${{ github.run_id }}
  cancel-in-progress: false

env:
  # As in ci.yml: no generation at install; the drill generates through scripts/prisma-generate.mjs.
  PRISMA_SKIP_POSTINSTALL_GENERATE: 'true'
  NODE_VERSION: '22'
  # Must match `packageManager` in package.json and ci.yml (pnpm/action-setup refuses otherwise).
  PNPM_VERSION: '11.22.0'

defaults:
  run:
    # Named, not the runner's default (bash -e): a failing pipe must fail the step.
    shell: bash

jobs:
  scope:
    name: Select full backup restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify branch and complete changed paths (errors select the drill)
        id: scope
        run: node scripts/backup-restore-drill-scope.mjs

  drill:
    name: Full backup restore drill (synthetic data)
    needs: [scope]
    if: ${{ always() && needs.scope.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Step budgets total 29 minutes, leaving one minute for runner overhead.
    steps:
      - timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - timeout-minutes: 1
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - timeout-minutes: 1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - timeout-minutes: 3
        run: pnpm install --frozen-lockfile
      - name: Run the full drill
        id: drill
        # Its own limit, apart from the 5-minute PostgreSQL tests in ci.yml. Measured: the whole
        # drill took 219 s on a GitHub runner (run 40800884574) and 703 s on the slower dev
        # host (2026-10-29); the limit is under 2x the slower and about 5x the runner's.
        timeout-minutes: 20
        run: |
          # One private directory per run holds the report, the CLI's stdout (it carries
          # synthetic ledger amounts) and stderr. Nothing in it is printed or uploaded; the next
          # step logs an allowlisted summary and the last step deletes it. Its path is never
          # exported (GITHUB_ENV or step env: would print it in the header of every later step);
          # each step derives it from RUNNER_TEMP, and the runner masks it in the log.
          dir="${RUNNER_TEMP}/backup-drill"
          echo "::add-mask::${dir}"
          mkdir -m 700 -- "${dir}"
          status=0
          scripts/backup-restore-drill --report "${dir}/report.json" \
            >"${dir}/stdout.json" 2>"${dir}/stderr.log" || status=$?
          echo "${status}" >"${dir}/exit-code"
          echo "The drill command exited with status ${status}."
          exit "${status}"
      - name: Summary (allowlisted fields only)
        timeout-minutes: 1
        if: ${{ always() && steps.drill.conclusion != 'skipped' }}
        run: |
          dir="${RUNNER_TEMP}/backup-drill"
          echo "::add-mask::${dir}"
          status="$(cat "${dir}/exit-code" 2>/dev/null || echo none)"
          node scripts/backup-restore-drill-summary.mjs \
            --report "${dir}/report.json" \
            --exit-code "${status}" \
            --progress "${dir}/stderr.log" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Remove anything the drill left
        timeout-minutes: 2
        # Also after a cancellation or a timeout, when the CLI may not have finished its own
        # teardown. The CLI proves the report is the one this drill wrote (project, directory,
        # compose definition, process groups) before it removes anything, and refuses a missing,
        # unreadable or mismatched record with a non-zero status. The private directory (the
        # recovery record included) is deleted only after a cleanup that succeeded.
        if: ${{ always() && steps.drill.conclusion != 'skipped' }}
        run: |
          dir="${RUNNER_TEMP}/backup-drill"
          echo "::add-mask::${dir}"
          status=0
          scripts/backup-restore-drill --cleanup-from "${dir}/report.json" || status=$?
          if [ "${status}" -eq 0 ]; then
            rm -rf -- "${dir:?}"
          else
            echo "Cleanup did not complete (status ${status}); the private directory is kept."
          fi
          exit "${status}"

  gate:
    name: Full backup restore drill required verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [scope, drill]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: A skipped train drill is a failure
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/backup-restore-drill-scope.mjs --gate
