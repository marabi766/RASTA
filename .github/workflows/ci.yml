  migration-guards:
    name: Migration verifiers and database guards
    runs-on: ubuntu-latest
    # Setup about 2.5 minutes, the by-name verifiers about 5.3 minutes, the
    # guards about 1.2 minutes on main run 40006639729.
    timeout-minutes: 20
