          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Construction coverage gate
        # `docs/14` § 14.2 puts construction-service in the 85% band, a
        # critical domain (AGENTS.md § 7). Both projects, for the reason the
        # supplier gate gives: the compare-and-set transitions, the row lock
        # that serialises need and project commands, the tenant-bound foreign
        # key, the PostGIS validity check, the outbox coupling and the HTTP
        # surface exist only against a real database and broker.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
