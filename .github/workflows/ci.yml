name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Supersede an in-flight run for the same ref: a stale result on an old
  # commit is worse than no result, because people act on it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Must match `packageManager` in package.json exactly. pnpm/action-setup
  # refuses to run when the two disagree, which is how every run before
  # 2026-08-27 died before `pnpm install` ever started (D-005).
  PNPM_VERSION: '11.22.0'

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback. Everything here runs without Docker, so it fails in ~2
  # minutes rather than after a container pull.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma clients are generated artefacts that typecheck depends on.
      - run: pnpm run db:generate

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

  # ---------------------------------------------------------------------------
  # Security. Every gate here fails the build rather than warning: a warning
  # nobody is forced to read is not a control.
  # ---------------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      # Gitleaks enumerates a pull request's commits through the API to decide
      # what to scan, so on a `pull_request` event it needs to read them. Until
      # the first PR-triggered run this job had only ever run on a push to
      # main, where that call is never made — so the missing permission
      # surfaced as `403 Resource not accessible by integration` and looked
      # exactly like a secret finding. It was not one.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit
        # High and critical fail. The repo holds no production secrets, but it
        # does hold the ledger, so a known-exploitable transitive dependency is
        # not something to merge past.
        run: pnpm audit --audit-level=high

      - name: Static analysis
        # Run the maintained image directly rather than semgrep/semgrep-action@v1.
        # That action is archived and ships semgrep 1.36 (2023), which dies on
        # any ruleset using the MEDIUM severity — "ValueError: invalid rule
        # severity value: MEDIUM" — and then exits 0. It reported success on
        # every run while scanning nothing, which is the one failure mode worse
        # than having no gate at all.
        #
        # Three registry-policy rules are excluded, not silenced by accident.
        # minimumReleaseAge and trustPolicy both reject the lockfile as it
        # stands — trustPolicy flags four packages as possible takeovers — and
        # clearing that means re-resolving the tree and judging each one, which
        # is its own task, tracked as D-008. Excluding them by name keeps the
        # decision greppable; deleting the ruleset would hide it.
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.175.0 \
            semgrep scan --error --metrics=off \
              --config p/typescript \
              --config p/nodejs \
              --config p/owasp-top-ten \
              --config p/secrets \
              --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age \
              --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age \
              --exclude-rule package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy

  # ---------------------------------------------------------------------------
  # Integration and the security tests that need a real database.
  #
  # Service containers rather than Testcontainers here: GitHub provisions them
  # before the job starts, which is faster and avoids docker-in-docker.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # A real broker, because fleet-service's event-path test is the first
      # integration test on the platform that carries a domain write through
      # the outbox to Kafka and back out of a consumer. Without this container
      # that test skips itself, and the stage would be green while never
      # exercising the path it exists to prove.
      #
      # Single-node KRaft, mirroring docker-compose.yml. Topics are created
      # explicitly below: auto-creation stays off, because producing to an
      # unknown topic is a contract violation and must fail loudly (ADR-006).
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: 'controller,broker'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
          KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          CLUSTER_ID: 'rasta-ci-cluster-000001'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          POSTGRES_USER: rasta
          POSTGRES_SERVICE_PASSWORD: rasta_ci_service_password
        run: |
          # The same script the local stack uses, so CI and a developer
          # laptop provision identically. Divergence here is how "works on my
          # machine" starts.
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - run: pnpm run db:generate

      - name: Create Kafka topics
        # Auto-creation is off by design (ADR-006), so every topic a test
        # touches has to exist first. A missing one then fails the test rather
        # than being silently created with default partitioning — which is the
        # behaviour that makes ordering guarantees meaningless.
        run: |
          set -euo pipefail
          create() {
            docker run --rm --network host apache/kafka:3.9.0 \
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
              --create --if-not-exists --partitions 3 --replication-factor 1 \
              --topic "$1"
          }
          for topic in \
            rasta.fleet.v1 rasta.fleet.v1.retry rasta.fleet.v1.dlq \
            rasta.asset.v1 rasta.insurance.v1 \
            rasta.maintenance.v1 rasta.maintenance.v1.retry rasta.maintenance.v1.dlq \
            rasta.marketplace.v1 rasta.marketplace.v1.retry rasta.marketplace.v1.dlq \
            rasta.economic.v1 rasta.economic.v1.retry rasta.economic.v1.dlq; do
            create "$topic"
          done

          # Force the group coordinator up before any test needs it.
          #
          # A freshly started broker answers `kafka-topics --list` — which is
          # all its healthcheck asks — while `__consumer_offsets` is still
          # loading. A consumer connecting in that window is told "the group
          # coordinator is not available" and retries in the background, so the
          # test publishes into a topic nobody is reading yet and fails on a
          # timeout that names the wrong thing. That is exactly how the first
          # CI run of this suite failed.
          #
          # Listing consumer groups creates and loads the internal topic, which
          # removes the race rather than making it rarer. The event-flow test
          # also waits for GROUP_JOIN, so neither guard relies on the other.
          docker run --rm --network host apache/kafka:3.9.0 \
            /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --list

      - name: Apply migrations
        run: pnpm run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_ci_service_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_ci_service_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_ci_service_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_ci_service_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_ci_service_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_ci_service_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_ci_service_password@localhost:5432/rasta_marketplace?schema=public

      - name: Integration tests
        run: pnpm run test:integration
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_ci_service_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_ci_service_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_ci_service_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_ci_service_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_ci_service_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_ci_service_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_ci_service_password@localhost:5432/rasta_marketplace?schema=public
          REDIS_URL: redis://localhost:6379

      # These are called out separately from the rest of the suite so a failure
      # names itself in the job list. A tenant-isolation failure is a data
      # leak, not a flaky test, and must never be waved through (AGENTS.md §5).
      - name: Tenant isolation and authorization tests
        # Called out separately from the rest of the suite so a failure names
        # itself in the job list. A tenant-isolation failure is a data leak,
        # not a flaky test, and must never be waved through (AGENTS.md § 5).
        #
        # Both projects, because the strongest isolation evidence now lives in
        # the integration suites — they prove the guard against a real database
        # rather than a mock that would assume the behaviour.
        #
        # The integration pattern names the invariants the product document
        # makes mandatory, one word each: `exclusivity` is fleet's one-driver
        # rule, `duplicate` is maintenance's duplicate-report control, and
        # `provenance` is the rule that a cost line must name the work that
        # produced it — the property economic-service audits against.
        #
        # The financial half was added with economic-service, and each word is
        # a row of docs/10 § 10.12's mandatory table rather than a test name:
        # `immutab` is the append-only ledger, `balance` is Σdebit = Σcredit and
        # the wallet/ledger agreement, `concurren` is the hundred parallel
        # withdrawals, `idempot` is one key one effect, `atomic` is a failed
        # settlement leaving nothing behind, `dispute` is the objection that
        # stops all movement, `overspend` is the negative balance that cannot
        # happen, and `cap` is the anti-fraud reward ceiling. A failure in any
        # of them is a financial defect, not a flaky test.
        run: |
          pnpm run test -- --testNamePattern="(tenant|isolation|authorization|subtree visibility)"
          pnpm run test:integration -- --testNamePattern="(tenant|isolation|exclusivity|duplicate|provenance|immutab|balance|concurren|idempot|atomic|dispute|overspend|cap)"
        env:
          NODE_ENV: test
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_ci_service_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_ci_service_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_ci_service_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_ci_service_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_ci_service_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_ci_service_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_ci_service_password@localhost:5432/rasta_marketplace?schema=public

      - name: Migration reversibility
        # AGENTS.md § 7 requires every migration to be reversible, and until
        # now nothing had ever run a down script. up → down → up against a
        # throwaway schema, asserting between each step that the tables, the
        # three ledger triggers and `ck_wallet_balances` are there, gone, and
        # back. It runs here rather than in its own job because this is where
        # a migrated database already exists.
        run: pnpm run test:migration
        env:
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_ci_service_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_ci_service_password@localhost:5432/rasta_marketplace?schema=public

  # ---------------------------------------------------------------------------
  # End-to-end. The economic critical path through the whole stack.
  #
  # AGENTS.md § 7 makes a green E2E suite mandatory for `economic`, `identity`
  # and `construction`, and until this job existed `pnpm test:e2e` exited zero
  # having executed nothing — a gate that passes without running, which is
  # read as evidence.
  #
  # Everything this job needs, it provisions. Nothing is assumed to be on the
  # runner and nothing is borrowed from a developer machine.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end (economic critical path)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: 'controller,broker'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
          KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          CLUSTER_ID: 'rasta-e2e-cluster-000001'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Generate run secrets
        # Minted per run and masked, never stored. The repository holds no real
        # secret and must not start holding one because a test needed a value
        # (AGENTS.md S-01). The Keycloak administrator password is only ever
        # used by the harness to reconcile a realm that predates a fixture user;
        # here the realm is imported fresh, so it is never exercised.
        run: |
          set -euo pipefail
          keycloak_password="$(openssl rand -hex 24)"
          internal_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${keycloak_password}"
          echo "::add-mask::${internal_secret}"
          echo "KEYCLOAK_ADMIN_PASSWORD=${keycloak_password}" >> "$GITHUB_ENV"
          echo "INTERNAL_TOKEN_SECRET=${internal_secret}" >> "$GITHUB_ENV"

      - name: Start Keycloak with the platform realm
        # A `docker run` rather than a service container, because the realm
        # import needs a file from the repository and service containers start
        # before the checkout exists. In-memory storage: this Keycloak lives for
        # one job and imports the realm on every boot.
        run: |
          set -euo pipefail
          docker run -d --name rasta-e2e-keycloak \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}" \
            -e KC_HEALTH_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            -v "$PWD/infrastructure/docker/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 \
            start-dev --import-realm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          POSTGRES_SERVICE_PASSWORD: rasta_ci_service_password
        run: |
          export PGHOST=localhost PGPORT=5432 POSTGRES_USER=rasta
          bash infrastructure/docker/postgres/00-init-databases.sh

      - name: Create Kafka topics
        # Auto-creation is off by design (ADR-006). The economic topic and its
        # retry/dlq siblings must exist before the service connects, or the
        # outbox relay fails to publish and the correlation scenario times out
        # blaming the wrong component.
        run: |
          set -euo pipefail
          for topic in \
            rasta.economic.v1 rasta.economic.v1.retry rasta.economic.v1.dlq \
            rasta.maintenance.v1 rasta.maintenance.v1.retry rasta.maintenance.v1.dlq \
            rasta.marketplace.v1 rasta.marketplace.v1.retry rasta.marketplace.v1.dlq \
            rasta.fleet.v1 rasta.fleet.v1.retry rasta.fleet.v1.dlq \
            rasta.asset.v1 rasta.insurance.v1; do
            docker run --rm --network host apache/kafka:3.9.0 \
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
              --create --if-not-exists --partitions 3 --replication-factor 1 \
              --topic "$topic"
          done
          docker run --rm --network host apache/kafka:3.9.0 \
            /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --list

      - run: pnpm run db:generate

      - name: Apply migrations
        run: |
          pnpm --filter @rasta/economic-service run db:migrate
          pnpm --filter @rasta/marketplace-service run db:migrate
        env:
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_ci_service_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_ci_service_password@localhost:5432/rasta_marketplace?schema=public

      - name: Build
        run: pnpm run build

      - name: Wait for Keycloak to import the realm
        # Waited for here rather than only inside globalSetup, so that a
        # Keycloak that never came up is reported as a Keycloak failure and its
        # log is printed, instead of surfacing as a token error in a test.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -sfo /dev/null \
              "http://localhost:8080/realms/rasta/.well-known/openid-configuration"; then
              echo "Keycloak realm 'rasta' is ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready"
          docker logs rasta-e2e-keycloak
          exit 1

      - name: Start Temporal
        # marketplace-service's order saga needs a real Temporal server. An
        # in-memory `dev-server` rather than the compose stack's Postgres-backed
        # one: this cluster lives for a single job and imports nothing.
        run: |
          set -euo pipefail
          docker run -d --name rasta-e2e-temporal --network host \n            temporalio/admin-tools:1.26.2-tctl-1.18.1-cli-1.1.1 \n            temporal server start-dev --ip 0.0.0.0 --port 7233 --headless

          for attempt in $(seq 1 40); do
            if docker exec rasta-e2e-temporal temporal operator cluster health \n                 --address localhost:7233 >/dev/null 2>&1; then
              echo "Temporal ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo 'Temporal did not become ready'
          docker logs rasta-e2e-temporal
          exit 1

      - name: Start economic-service, marketplace-service and api-gateway
        # From `dist`, the same artefact the container image runs, rather than
        # from a watch-mode dev server. Started here rather than by Playwright's
        # `webServer` because two processes have to come up in order and their
        # logs must survive the job for a failure to be diagnosable.
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://rasta_economic:rasta_ci_service_password@localhost:5432/rasta_economic?schema=public
          KAFKA_BROKERS: localhost:9092
          REDIS_URL: redis://localhost:6379
          OIDC_ISSUER_URL: http://localhost:8080/realms/rasta
          OIDC_JWKS_URI: http://localhost:8080/realms/rasta/protocol/openid-connect/certs
          OIDC_AUDIENCE: rasta-api
          PORT_ECONOMIC: '3112'
          PORT_API_GATEWAY: '3000'
          ECONOMIC_PLATFORM_ORGANIZATION_ID: ORG-PLATFORM
          # The reconciliation is a timer that reports; it has nothing to
          # observe in a fresh database and only adds noise to the log.
          ECONOMIC_BALANCE_AUDIT_ENABLED: 'false'
          PORT_MARKETPLACE: '3106'
          TEMPORAL_ADDRESS: localhost:7233
          MARKETPLACE_TEMPORAL_TASK_QUEUE: rasta-order
          MARKETPLACE_TEMPORAL_ENABLED: 'true'
          # Short enough that the E2E suite can observe an overdue order
          # without waiting a week, and long enough that no scenario trips it
          # by accident. Nothing expires into a settlement (ADR-043).
          MARKETPLACE_FULFILLMENT_WINDOW_DAYS: '7'
          MARKETPLACE_RECEIPT_WINDOW_DAYS: '3'
          # api-gateway validates every service URL at boot, including the
          # fourteen services that do not exist yet. They are unreachable and
          # unrouted-to by this suite; the values only have to parse.
          IDENTITY_SERVICE_URL: http://localhost:3101
          ORGANIZATION_SERVICE_URL: http://localhost:3102
          ASSET_SERVICE_URL: http://localhost:3103
          FLEET_SERVICE_URL: http://localhost:3104
          MAINTENANCE_SERVICE_URL: http://localhost:3105
          MARKETPLACE_SERVICE_URL: http://localhost:3106
          PROCUREMENT_SERVICE_URL: http://localhost:3107
          SUPPLIER_SERVICE_URL: http://localhost:3108
          INVENTORY_SERVICE_URL: http://localhost:3109
          CONSTRUCTION_SERVICE_URL: http://localhost:3110
          CONTRACT_SERVICE_URL: http://localhost:3111
          ECONOMIC_SERVICE_URL: http://localhost:3112
          NOTIFICATION_SERVICE_URL: http://localhost:3113
          DOCUMENT_SERVICE_URL: http://localhost:3114
          AUDIT_SERVICE_URL: http://localhost:3115
          ANALYTICS_SERVICE_URL: http://localhost:3116
        run: |
          set -euo pipefail
          mkdir -p /tmp/rasta-logs

          ( cd services/economic-service && \
            PORT=3112 SERVICE_NAME=economic-service \
            node dist/main.js > /tmp/rasta-logs/economic.log 2>&1 & )

          ( cd services/api-gateway && \
            PORT=3000 SERVICE_NAME=api-gateway \
            node dist/main.js > /tmp/rasta-logs/gateway.log 2>&1 & )

          for attempt in $(seq 1 60); do
            economic="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3112/health/ready || true)"
            gateway="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3000/v1/wallets/me || true)"
            if [ "$economic" = "200" ] && [ "$gateway" = "401" ]; then
              echo "stack up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done

          echo "the stack did not come up (economic=${economic}, gateway=${gateway})"
          cat /tmp/rasta-logs/economic.log
          cat /tmp/rasta-logs/gateway.log
          exit 1

      - name: End-to-end tests
        # Playwright fails a run that matches no tests, and that default is kept
        # deliberately — `--pass-with-no-tests` appears nowhere in this
        # repository.
        run: pnpm run test:e2e
        env:
          E2E_GATEWAY_URL: http://localhost:3000
          E2E_ECONOMIC_URL: http://localhost:3112
          E2E_MARKETPLACE_URL: http://localhost:3106
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: rasta
          KEYCLOAK_WEB_CLIENT_ID: rasta-web
          KEYCLOAK_ADMIN: admin
          KAFKA_BROKERS: localhost:9092

      - name: Service logs
        if: failure()
        run: |
          echo '--- economic-service ---'
          tail -n 200 /tmp/rasta-logs/economic.log || true
          echo '--- api-gateway ---'
          tail -n 200 /tmp/rasta-logs/gateway.log || true
          echo '--- keycloak ---'
          docker logs --tail 200 rasta-e2e-keycloak || true

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Container build and image scan. Only on main, because it is the slowest
  # stage and a PR has already been gated by everything above.
  # ---------------------------------------------------------------------------
  containers:
    name: Build and scan images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # E2E joins the list: main must stay deployable, and an image built from a
    # commit whose critical financial path was never exercised is not something
    # to publish (AGENTS.md § 6, § 7).
    needs: [quality, security, integration, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        # asset-service and fleet-service were absent until fleet landed, so
        # two images we ship were never built or scanned by CI
        # (PROJECT_MEMORY § 22). Adding them here is what makes the scan gate
        # cover what we actually deploy.
        service:
          [
            identity-service,
            organization-service,
            asset-service,
            fleet-service,
            maintenance-service,
            economic-service,
            marketplace-service,
          ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          # Tagged with the commit SHA, never a bare `latest`: an image you
          # cannot trace back to a commit is not deployable.
          tags: rasta/${{ matrix.service }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image
        # Tags on this action carry a `v` prefix; the unprefixed `0.28.0` this
        # once pinned does not resolve, so the job died at "Set up job" before
        # running a single step (D-005). Moved to the current release rather
        # than back-pinning: a vulnerability scanner two years behind is a
        # gate in name only.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rasta/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
