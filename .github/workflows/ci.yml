name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Supersede an in-flight run for the same ref: a stale result on an old
  # commit is worse than no result, because people act on it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Must match `packageManager` in package.json exactly. pnpm/action-setup
  # refuses to run when the two disagree, which is how every run before
  # 2026-08-27 died before `pnpm install` ever started (D-005).
  PNPM_VERSION: '11.22.0'
  # Object storage for document-service. Chainguard's signed builds, pinned by
  # multi-arch index digest: MinIO's own images stopped being publicly
  # pullable on 2026-09-24 (quay.io answers 401; Docker Hub's minio/minio is
  # gone). docker-compose.yml pins the same MINIO_IMAGE. Its minio-init pins
  # the `-dev` variant of MC_IMAGE instead, for the shell its script needs;
  # here `mc` is the entrypoint and needs none. Bump the two together.
  MINIO_IMAGE: 'cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1'
  MC_IMAGE: 'cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338'

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback. Everything here runs without Docker, so it fails in ~2
  # minutes rather than after a container pull.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tip and its parents: a pull request's merge commit's first
          # parent is the branch it merges into, which the withheld-settings
          # list is compared with (step "Every service's own settings ...").
          # A push's previous main is fetched by that step.
          fetch-depth: 2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma clients are generated artefacts that typecheck depends on.
      - run: pnpm run db:generate

      - name: Product backlog and progress gate
        run: |
          pnpm run progress:check
          pnpm run test:progress

      - name: Service boundary gate
        # AGENTS.md A-02: a service reaches another only over REST or Kafka,
        # never by importing `services/<other>/src/**` or `test/**`. Runs the
        # checker's own tests first so a checker that stopped catching
        # anything fails loudly rather than passing an empty gate (AUD-004
        # Phase C1 hardening — the identity test tree once imported
        # audit-service directly and no gate caught it).
        run: |
          pnpm run test:service-boundaries-lib
          pnpm run check:service-boundaries

      - name: Local PostgreSQL defaults contract
        # `.env.example` must point host-side PostgreSQL at 127.0.0.1, not
        # `localhost`, which can try ::1 first against an IPv4-only listener
        # and time Prisma transactions out with P2028. Reads the committed file
        # as text only; the service-container URLs this workflow uses are its
        # own and are not checked or changed.
        run: |
          pnpm run test:local-postgres-config
          pnpm run check:local-postgres-config

      - name: Compose ports bound to loopback
        # L7-38: the dev stack runs Postgres, Redis, Kafka, MinIO and the rest
        # with development credentials or none. Every published port must bind
        # ${COMPOSE_BIND_ADDRESS:-127.0.0.1} (or 127.0.0.1), never 0.0.0.0.
        # Static; the checker's tests run first.
        run: |
          pnpm run test:compose-ports
          pnpm run check:compose-ports

      - name: Kafka broker bootstrap rules
        # RUN-006: the ACL diff the bootstrap applies (prune extras, add what
        # is missing), each principal's connection, and that every generated
        # principal's password has exactly one home. No broker; the broker
        # itself is exercised by the integration job.
        #
        # And no service process is given a Kafka credential but its own: the
        # admin's, ops-replay's and the observer's stay out of .env and out of
        # every service start step; neither secrets directory reaches
        # $GITHUB_ENV, a job-level env or a launched service; the admin's
        # directory goes to the broker bootstrap and the broker tests alone
        # (reviews of #131).
        run: |
          pnpm run test:kafka-acl-lib
          pnpm run test:kafka-credential-scope
          pnpm run check:kafka-credential-scope
          pnpm run test:kafka-outbox-tables
          pnpm run test:replay-dlq-lib

      - name: Role passwords are distinct and checked before any role changes
        # L7-33: the bootstrap and `pnpm db:rotate-role-passwords` refuse two
        # roles (or a role and the superuser) with one password, and the old
        # shared variable, before the first psql call; `pnpm infra:up` warns and
        # refuses the same on the host. Runs both bash scripts against a stub
        # psql that records every call.
        run: pnpm run test:infra-preflight

      - name: Database runtime-role rules (D-045)
        # Every service is placed exactly once — split or audit — and one in
        # neither fails; the migration ledger revoke
        # scripts/prisma.mjs runs after each migration quotes and refuses
        # what it must; and every variable prisma.mjs reads reaches it through
        # turbo, root `pnpm db:migrate` included (#242).
        run: pnpm run test:db-runtime-privileges-lib

      - name: Outbox purge settings reach the services through turbo (D-052)
        # Every task that starts a service running the purge — `dev` and the
        # integration suites — passes every OUTBOX_PURGE_* variable, and the
        # root `pnpm dev` resolves them (turbo dry run). Codex r1 on #247.
        run: pnpm run test:outbox-purge-turbo-env

      - name: Construction settings reach the service through turbo
        # The same for construction-service's own CONSTRUCTION_* settings:
        # `dev` and the integration suites pass every one, and the root
        # `pnpm dev` resolves them (turbo dry run). Codex r1 on #271.
        run: pnpm run test:construction-turbo-env

      - name: Database settings reach the services through turbo
        # Every task that starts a service with a database — `dev` and the
        # integration suites — passes every databaseEnvSchema variable (pool,
        # statement timeout, the service's own URL), every setting its
        # operation budgets are computed from, and construction's and the
        # gateway's own settings; and the root `pnpm dev` resolves them (turbo
        # dry run). Codex r1 and r4 on #268.
        run: pnpm run test:database-turbo-env

      - name: Every service's own settings reach it through turbo
        # Every task that starts a service passes every key of that service's
        # own schema, save the ones withheld before this check
        # (scripts/service-env-turbo-withheld.json, which only shrinks); and
        # the root commands resolve asset-service's claim-document settings
        # (turbo dry run). Codex r2 on #304.
        #
        # The list may only shrink: each entry must already be listed in the
        # base's copy, so a change cannot list a new setting instead of
        # declaring it, alone or swapped for one it removes (Codex r3 on
        # #304). The base (scripts/service-env-withheld-base.mjs): the merge
        # commit's first parent on a pull request; on a push the main it
        # replaced, github.event.before, fetched — not HEAD^1, a commit of the
        # same push when it carries several (Codex r1 on #316). No previous
        # main, or one that cannot be fetched, fails the step.
        env:
          SERVICE_ENV_WITHHELD_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$(node scripts/service-env-withheld-base.mjs)"
          SERVICE_ENV_WITHHELD_BASE="$base" pnpm run test:service-env-turbo

      - name: Optional database-side statement timeout for the runtime roles
        # Behind PgBouncer the services' own statement_timeout option is
        # dropped, so the bootstrap, the split and the rotation can set one
        # on each runtime role — only where POSTGRES_STATEMENT_TIMEOUT_MS_<SVC>
        # asks for it, refused when malformed, never on a migrator (#268 r4).
        run: pnpm run test:session-statement-timeout

      - name: Marketplace saga deployment gate (D-053)
        # The check a marketplace-service deployment runs between stopping the
        # old replicas and starting the new: passes only on no poller and no
        # pending order-saga activity, blocks on everything it cannot verify
        # (docs/runbooks/marketplace-saga-deploy.md). Codex r2 on #283.
        run: pnpm run test:marketplace-saga-drain-check

      - name: Image scope rule
        # The rule that decides which images a pull request builds and scans
        # (L7-35). A wrong rule would quietly skip a changed image.
        run: pnpm run test:container-scope

      - name: Base images pinned by digest
        # L7-45: every service Dockerfile builds on one digest-pinned base and
        # runs no bare `apk upgrade`, so a rebuild of a commit is the same
        # image. Update procedure: docs/runbooks/base-image-update.md.
        run: |
          pnpm run test:dockerfile-pins
          pnpm run check:dockerfile-pins

      - name: Tenant-leading composite indexes
        # L7-44 / ADR-011: every composite index on a tenant table in
        # supplier, notification, document and audit leads with
        # organization_id, or is exempted by name with its reason. Replays the
        # migrations, so partial indexes that exist only in SQL are judged too.
        # Static; the checker's tests run first.
        run: |
          pnpm run test:tenant-index-order
          pnpm run check:tenant-index-order

      - name: Development Keycloak realm gate
        # L1-05: rasta-realm.json seeds a SYSTEM_ADMIN with a committed password
        # and enables the password grant. Its `enabled` is a placeholder only
        # infrastructure/docker/keycloak/dev-realm-gate.sh resolves, and only
        # for start-dev with RASTA_KEYCLOAK_DEV_REALM=allow. Static: fails if
        # the placeholder, the gate's checks, or any launcher's use of it is
        # edited away. The checker's own tests run the gate script under bash.
        run: |
          pnpm run test:keycloak-dev-realm
          pnpm run check:keycloak-dev-realm

      - name: Test phase contract
        # identity-service's aggregation stress spec (two 500-write proofs on
        # one hot row) must run exactly once, alone, after every other
        # workspace test task: beside the other services' integration suites
        # on one PostgreSQL it measured their WAL load instead of row
        # serialization (docs/14 § 14.3). Static — reads package.json,
        # turbo.json, identity's jest config and this workflow; no database.
        # The checker's own tests run first so a checker that stopped catching
        # anything fails loudly. The manual commit-rate evidence harness for the
        # same spec (`scripts/aggregation-evidence.mjs`) keeps its parsers,
        # probe validation and stress-constant contract tested here; the
        # measurement itself never runs in CI.
        run: |
          pnpm run test:test-phases
          pnpm run check:test-phases
          pnpm run test:aggregation-evidence-lib

      - name: Integration split is aggregated
        # The integration work runs as parallel `integration-*` jobs and
        # `integration` ("Integration and security tests", the required check)
        # only aggregates them. Every split job is needed by it, it runs
        # always() and nothing else, and its verdict script, executed here
        # against each job failed, cancelled and skipped, fails on all of
        # them. Each step of the old single job runs in exactly one split job,
        # with its declared command, env and time limit, no `if:` and no
        # `continue-on-error`, and has the broker, bucket, scanner, Redis or
        # database it reads.
        run: pnpm run test:ci-integration-split

      - name: Image pre-pull retries only transient registry errors
        # `scripts/ci-pull-image.sh` runs before the steps that start a
        # container: a 5xx, timeout or connection reset is retried (10/30/60 s),
        # a 404, "manifest unknown", unauthorized, digest mismatch or any
        # error it does not recognise fails at once, and a reference without a
        # sha256 digest is refused. Also fails if a step runs a digest-pinned
        # image that no earlier step of its job pre-pulls.
        run: pnpm run test:ci-pull-image

      - name: Grafana dashboard contract
        # The provisioned local `Rasta Audit Evidence` dashboard: stable
        # datasource UID on every query, every alert in the rules file, the
        # alerts' own aggregations, bounded labels only, and the boundary text
        # (docs/13-observability.md § 13.7); and a self-contained local Grafana
        # start — the no-outbound GF_* settings on the Compose service and the
        # inert plugins/alerting provisioning. Static, so no Docker here; the
        # live provisioning and PromQL check on an internal Docker network is
        # `pnpm run verify:grafana-dashboard-live`. Checker tests run first so
        # a checker that stopped catching anything fails loudly. The isolation
        # helper tests run that harness's topology checks (internal network,
        # one network per container, no published port) against a fake Docker
        # only — they are not a live isolation run.
        run: |
          pnpm run test:grafana-dashboard-lib
          pnpm run check:grafana-dashboard
          pnpm run test:grafana-live-isolation-lib

      - name: Image scan coverage gate
        # Runs here, in a job that fires on pull requests, rather than beside
        # the `containers` job it protects — that one only runs on a push to
        # main, so it cannot catch a service being added without an image
        # build until the omission has already merged. Three services have
        # landed unscanned this way (PROJECT_MEMORY § 22).
        run: |
          pnpm run ci:image-matrix
          pnpm run test:image-matrix

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Cache the Temporal time-skipping test server
        # marketplace-service's saga specs run on it, and it is a ~300 MB
        # download. Fetched on every run it made the specs' setup hook exceed
        # its timeout whenever the network was slow (2026-09-25).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Unit tests
        run: pnpm run test:unit
        env:
          TEMPORAL_TEST_SERVER_DIR: ${{ runner.temp }}/temporal-test-server

      - name: Build
        run: pnpm run build

      - name: Services refuse a database owner credential at boot (D-045)
        # Each built dist/main.js, started with a *_MIGRATOR URL or password in
        # its environment, must exit naming the variable and never its value
        # (@rasta/config assertNoMigratorCredentials; Codex review of #176).
        run: pnpm run test:boot-guard

      - name: Service dev scripts load TypeScript as CommonJS, telemetry first
        # `pnpm dev` ran the services through swc-node's ES-module loader,
        # under which main.ts could not import AppModule from its CommonJS
        # sibling: every service refused at link time. Runs each service's
        # own dev loader flags on a two-file entry; services with a Prisma
        # schema generate the client first. And swc hoists main.ts's imports
        # above its initTelemetry(), so dev preloads dev/telemetry.ts: the
        # real main.ts, stopped as AppModule is about to load, must find the
        # SDK started (Codex on #281). After Build: main.ts loads the built
        # packages and the generated Prisma client.
        run: pnpm run test:dev-loader

      - name: Services trace Kafka from the built entry point
        # Each built dist/main.js, loaded up to its app.module, must have
        # kafkajs wrapped by the OpenTelemetry instrumentation: an import that
        # loads kafkajs before initTelemetry() leaves it untraced (audit-service).
        run: pnpm run test:telemetry-order

  # ---------------------------------------------------------------------------
  # Security. Every gate here fails the build rather than warning: a warning
  # nobody is forced to read is not a control.
  # ---------------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      # Gitleaks enumerates a pull request's commits through the API to decide
      # what to scan, so on a `pull_request` event it needs to read them. Until
      # the first PR-triggered run this job had only ever run on a push to
      # main, where that call is never made — so the missing permission
      # surfaced as `403 Resource not accessible by integration` and looked
      # exactly like a secret finding. It was not one.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit
        # High and critical fail. The repo holds no production secrets, but it
        # does hold the ledger, so a known-exploitable transitive dependency is
        # not something to merge past.
        run: pnpm audit --audit-level=high

      - name: Pre-pull Semgrep (retries transient registry errors)
        run: |
          scripts/ci-pull-image.sh \
            semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796

      - name: Static analysis
        # Run the maintained image directly rather than semgrep/semgrep-action@v1.
        # That action is archived and ships semgrep 1.36 (2023), which dies on
        # any ruleset using the MEDIUM severity — "ValueError: invalid rule
        # severity value: MEDIUM" — and then exits 0. It reported success on
        # every run while scanning nothing, which is the one failure mode worse
        # than having no gate at all.
        #
        # No rule is excluded. Three registry-policy rules were, from
        # 2026-08-27 to 2026-09-22 (D-008): they ask pnpm-workspace.yaml for
        # `minimumReleaseAge` and `trustPolicy: no-downgrade` and .npmrc for
        # `min-release-age`, and the lockfile of the day failed both pnpm
        # settings. Those settings are now on, with four reviewed, version-
        # pinned trust exceptions listed beside them — so the policy the rules
        # check for is the policy pnpm actually enforces on every install, in
        # the `pnpm install --frozen-lockfile` step above and in every image
        # build. The per-package evidence is in docs/23 D-008.
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 \
            semgrep scan --error --metrics=off \
              --config p/typescript \
              --config p/nodejs \
              --config p/owasp-top-ten \
              --config p/secrets

  # ---------------------------------------------------------------------------
  # The portal in a real browser (EXP-002, ADR-059).
  #
  # Its own job because it needs a browser binary and a production build, and
  # neither belongs in `quality`. It runs against `next start`, not the dev
  # server: those are different programs, and a browser job passing against a
  # dev server would pass on code that could not ship.
  #
  # No database, no Keycloak, no gateway. The only page it visits is `/login`,
  # which a visitor without a cookie reaches without any of them — and the
  # three things it asserts are the three only a browser can show: the document
  # is right-to-left, the way in needs no JavaScript, and **nothing is in
  # browser storage**, which is ADR-059's central claim.
  # ---------------------------------------------------------------------------
  web-browser:
    name: Portal in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Generate run secrets
        # Job-local and masked. In particular, WEB_SESSION_SECRET is never a
        # repository fixture: the browser receives only the cookie it seals.
        run: |
          set -euo pipefail
          keycloak_password="$(openssl rand -hex 24)"
          internal_secret="$(openssl rand -hex 32)"
          web_session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${keycloak_password}"
          echo "::add-mask::${internal_secret}"
          echo "::add-mask::${web_session_secret}"
          echo "KEYCLOAK_ADMIN_PASSWORD=${keycloak_password}" >> "$GITHUB_ENV"
          echo "INTERNAL_TOKEN_SECRET=${internal_secret}" >> "$GITHUB_ENV"
          echo "WEB_SESSION_SECRET=${web_session_secret}" >> "$GITHUB_ENV"

      - name: Pre-pull Keycloak and MinIO (retries transient registry errors)
        run: |
          scripts/ci-pull-image.sh \
            quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858 \
            "$MINIO_IMAGE" "$MC_IMAGE"

      - name: Start Keycloak with the platform realm
        # Service containers start before checkout, so the checked-in realm
        # import is mounted by an ordinary container after checkout instead.
        run: |
          set -euo pipefail
          docker run -d --name rasta-web-e2e-keycloak \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}" \
            -e KC_HEALTH_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            -e RASTA_KEYCLOAK_DEV_REALM=allow \
            -v "$PWD/infrastructure/docker/keycloak:/opt/keycloak/data/import:ro" \
            --entrypoint /bin/bash \
            quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858 \
            /opt/keycloak/data/import/dev-realm-gate.sh start-dev --import-realm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          # A throwaway cluster, bootstrapped as compose bootstraps its own:
          # unset role passwords take the published development defaults,
          # which lib/role-passwords.bash allows only under this flag.
          RASTA_DB_BOOTSTRAP: compose
        run: |
          export PGHOST=localhost PGPORT=5432 POSTGRES_USER=rasta
          bash infrastructure/docker/postgres/00-init-databases.sh

      - name: Start the authenticated Kafka broker
        # RUN-006, ADR-061 § 3: SASL_SSL with one SCRAM principal per service
        # and per-topic ACLs generated from the event contracts, started the
        # way compose starts it (infrastructure/docker/kafka/ci-up.sh), so a
        # service or test that reaches past its declared topics fails here as
        # it would in production. Per-run passwords, masked, stay in two
        # private directories (the admin's apart), each given only to the
        # steps that need it; only KAFKA_SSL and the CA go through GITHUB_ENV.
        # Every platform topic is created (auto-creation stays off, ADR-006)
        # and the group coordinator is loaded before any test joins a group.
        run: bash infrastructure/docker/kafka/ci-up.sh
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          KAFKA_ADMIN_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-admin-secrets

      - run: pnpm run db:generate

      - name: Apply live-path migrations
        run: |
          pnpm --filter @rasta/identity-service run db:migrate
          pnpm --filter @rasta/fleet-service run db:migrate
          pnpm --filter @rasta/organization-service run db:migrate
          pnpm --filter @rasta/asset-service run db:migrate
          pnpm --filter @rasta/maintenance-service run db:migrate
          pnpm --filter @rasta/document-service run db:migrate
          pnpm --filter @rasta/marketplace-service run db:migrate
          pnpm --filter @rasta/economic-service run db:migrate
          pnpm --filter @rasta/construction-service run db:migrate
          pnpm --filter @rasta/inventory-service run db:migrate
          pnpm --filter @rasta/contract-service run db:migrate
          pnpm --filter @rasta/supplier-service run db:migrate
          pnpm --filter @rasta/audit-service run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_IDENTITY_MIGRATOR: postgresql://rasta_identity_migrator:rasta_identity_migrator_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_FLEET_MIGRATOR: postgresql://rasta_fleet_migrator:rasta_fleet_migrator_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ORGANIZATION_MIGRATOR: postgresql://rasta_organization_migrator:rasta_organization_migrator_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_ASSET_MIGRATOR: postgresql://rasta_asset_migrator:rasta_asset_migrator_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_MAINTENANCE_MIGRATOR: postgresql://rasta_maintenance_migrator:rasta_maintenance_migrator_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_DOCUMENT_MIGRATOR: postgresql://rasta_document_migrator:rasta_document_migrator_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_MARKETPLACE_MIGRATOR: postgresql://rasta_marketplace_migrator:rasta_marketplace_migrator_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_ECONOMIC_MIGRATOR: postgresql://rasta_economic_migrator:rasta_economic_migrator_dev_password@localhost:5432/rasta_economic?schema=public
          # EXP-004: a contractor's bid (`e2e/tender-bids.spec.ts`) is accepted
          # only while supplier-service says, at that moment, that its
          # organization is qualified for CONTRACTING.
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_SUPPLIER_MIGRATOR: postgresql://rasta_supplier_migrator:rasta_supplier_migrator_dev_password@localhost:5432/rasta_supplier?schema=public
          # EXP-004: /projects and /inventory read construction-service and
          # inventory-service through the gateway; their live isolation
          # scenarios (`e2e/tenant-isolation.spec.ts`) need both running.
          DATABASE_URL_CONSTRUCTION: postgresql://rasta_construction:rasta_construction_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_CONSTRUCTION_MIGRATOR: postgresql://rasta_construction_migrator:rasta_construction_migrator_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_INVENTORY: postgresql://rasta_inventory:rasta_inventory_dev_password@localhost:5432/rasta_inventory?schema=public
          DATABASE_URL_INVENTORY_MIGRATOR: postgresql://rasta_inventory_migrator:rasta_inventory_migrator_dev_password@localhost:5432/rasta_inventory?schema=public
          # EXP-004: `/contracts/[id]` reads and commands a contract's statements
          # through contract-service (`e2e/contract-statements.spec.ts`).
          DATABASE_URL_CONTRACT: postgresql://rasta_contract:rasta_contract_dev_password@localhost:5432/rasta_contract?schema=public
          DATABASE_URL_CONTRACT_MIGRATOR: postgresql://rasta_contract_migrator:rasta_contract_migrator_dev_password@localhost:5432/rasta_contract?schema=public
          # EXP-004: a tender's bids are opened only against the receipts
          # audit-service holds (`e2e/tender-owner.spec.ts`). Migrated as the
          # schema owner, run below as the runtime role (ADR-053 § 6).
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Load the signed contract the statement scenarios act on
        # contract-service has no route that creates a contract (one is drafted
        # only from TENDER_AWARDED, ADR-068 § 3), so the scenarios start from a
        # SIGNED contract and the two statement chains in force, written as
        # contract-service's own runtime role through every guard its database
        # keeps. The file says why, and what each row is. The contract command
        # scenarios write a fresh contract per test the same way
        # (`e2e/contract-fixture.ts`), signing under this file's policy.
        env:
          PGPASSWORD: rasta_contract_dev_password
        run: >-
          psql -v ON_ERROR_STOP=1 -h localhost -U rasta_contract -d rasta_contract
          -f apps/web/e2e/fixtures/contract-statements.sql

      - name: Seed the live users and both tenants' machines, drivers and schedules
        # operator.one is the same platform user in identity, Keycloak and
        # fleet, and holds AST-SEED-0001 through ASG-SEED-0001.
        #
        # The seeds hold **two tenants** on purpose (ORG-DEH-0001 and
        # ORG-DEH-0002, each with a machine, a driver and a schedule; the
        # other's rows "must be invisible"), which is what the browser suite's
        # tenant-isolation scenarios (`e2e/tenant-isolation.spec.ts`) read
        # through the real services.
        run: |
          # Through turbo, not `pnpm --filter … run db:seed`: the seed imports
          # @rasta/config, which is not built yet at this point in the job, and
          # turbo's db:seed builds it first (dependsOn ^build, db:generate).
          pnpm exec turbo run db:seed --filter=@rasta/identity-service --filter=@rasta/fleet-service --filter=@rasta/organization-service --filter=@rasta/asset-service --filter=@rasta/maintenance-service --filter=@rasta/marketplace-service
        env:
          # Demo seeds refuse to run without both (packages/config seed-guard).
          NODE_ENV: test
          RASTA_ALLOW_DEMO_SEED: 'true'
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          # The catalogue the order scenarios (`e2e/orders.spec.ts`) buy from: the
          # same product offered by both tenants, and a draft offer of
          # ORG-DEH-0002's that ORG-DEH-0001 must not be able to tell from one
          # that does not exist.
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public

      - name: Load the completed orders the return scenarios act on
        # `e2e/returns.spec.ts` (EXP-003, RUN-005): a return is asked only of
        # a COMPLETED order, which only a settlement this job never runs makes.
        # The fixture says why it is rows, and writes them as the service's own
        # runtime role through every CHECK the tables keep; on the seed's
        # tenants and cement offer, so after the seed.
        env:
          PGPASSWORD: rasta_marketplace_dev_password
        run: >-
          psql -v ON_ERROR_STOP=1 -h localhost -U rasta_marketplace -d rasta_marketplace
          -f apps/web/e2e/fixtures/marketplace-returns.sql

      - name: Build portal and live-path services
        # Build the exact deployable artifacts this job starts, plus their
        # workspace dependencies. Services run from dist, never watch mode.
        run: >-
          pnpm exec turbo run build
          --filter=@rasta/web...
          --filter=@rasta/api-gateway...
          --filter=@rasta/identity-service...
          --filter=@rasta/fleet-service...
          --filter=@rasta/organization-service...
          --filter=@rasta/asset-service...
          --filter=@rasta/maintenance-service...
          --filter=@rasta/document-service...
          --filter=@rasta/marketplace-service...
          --filter=@rasta/economic-service...
          --filter=@rasta/construction-service...
          --filter=@rasta/inventory-service...
          --filter=@rasta/contract-service...
          --filter=@rasta/supplier-service...
          --filter=@rasta/audit-service...

      - name: Start MinIO and create the document bucket
        # EXP-002 slice 7: the portal attaches a file by having its server ask
        # document-service for a signed URL and put the bytes in object storage
        # (ADR-014), so the document scenarios need a real bucket — the same
        # image, run the same way, as the document-service job below
        # (`docker run`, because a service container cannot override the
        # image's command; tmpfs because the image runs as uid 65532 with no
        # shell; `mc` through MC_HOST_<alias>). A private bucket, explicitly:
        # every read of it is a signed URL.
        run: |
          set -euo pipefail
          docker run -d --name rasta-web-e2e-minio --network host \
            --tmpfs /data:uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=rasta_minio_admin \
            -e MINIO_ROOT_PASSWORD=rasta_minio_ci_password \
            "$MINIO_IMAGE" server /data --address ':9000'

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo 'MinIO is live'
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null

          mc() {
            docker run --rm --network host \
              -e MC_HOST_rasta=http://rasta_minio_admin:rasta_minio_ci_password@localhost:9000 \
              "$MC_IMAGE" -C /tmp/.mc "$@"
          }
          mc mb --ignore-existing rasta/rasta-documents
          mc anonymous set none rasta/rasta-documents

      - name: Wait for Keycloak to import the realm
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -sfo /dev/null \
              "http://localhost:8080/realms/rasta/.well-known/openid-configuration"; then
              echo "Keycloak realm ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          docker logs rasta-web-e2e-keycloak
          exit 1

      - name: Start identity, fleet, organization, asset, maintenance, supplier, audit, construction, inventory, contract and api-gateway
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          REDIS_URL: redis://localhost:6379
          OIDC_ISSUER_URL: http://localhost:8080/realms/rasta
          OIDC_JWKS_URI: http://localhost:8080/realms/rasta/protocol/openid-connect/certs
          OIDC_AUDIENCE: rasta-api
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: rasta
          KEYCLOAK_BACKEND_CLIENT_ID: rasta-backend
          KEYCLOAK_BACKEND_CLIENT_SECRET: backend_dev_secret_change_me
          AUDIT_SERVICE_URL: http://localhost:3115
          IDENTITY_SERVICE_URL: http://localhost:3101
          ORGANIZATION_SERVICE_URL: http://localhost:3102
          ASSET_SERVICE_URL: http://localhost:3103
          FLEET_SERVICE_URL: http://localhost:3104
          MAINTENANCE_SERVICE_URL: http://localhost:3105
          MARKETPLACE_SERVICE_URL: http://localhost:3106
          PROCUREMENT_SERVICE_URL: http://localhost:3107
          SUPPLIER_SERVICE_URL: http://localhost:3108
          INVENTORY_SERVICE_URL: http://localhost:3109
          CONSTRUCTION_SERVICE_URL: http://localhost:3110
          CONTRACT_SERVICE_URL: http://localhost:3111
          ECONOMIC_SERVICE_URL: http://localhost:3112
          NOTIFICATION_SERVICE_URL: http://localhost:3113
          DOCUMENT_SERVICE_URL: http://localhost:3114
          ANALYTICS_SERVICE_URL: http://localhost:3116
        run: |
          set -euo pipefail
          # kafka-credentials.sh alone reads the secrets directory: kept in a
          # shell variable and out of the environment, so no process launched
          # below (a service, or api-gateway) inherits it.
          kafka_secrets_dir="${KAFKA_SECRETS_DIR}"
          unset KAFKA_SECRETS_DIR
          mkdir -p /tmp/rasta-web-e2e-logs

          # D-045 (Codex on #178): asset-service's timeline and
          # maintenance-service's usage projection start their consumers in
          # their own onModuleInit, which Nest runs before AppModule's. Started
          # with its owner's URL, each must be gone before a consumer joins, a
          # USAGE_RECORDED queued for it neither consumed nor committed. Before
          # either starts, so neither group has run; the positive controls
          # follow the start step. scripts/runtime-preflight.e2e.mjs.
          ( asset_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service asset-service)" && \
            fleet_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service fleet-service)" && \
            eval "${asset_credentials}" && eval "${fleet_credentials}" && \
            PORT=3103 PREFLIGHT_STATE_DIR=/tmp/rasta-web-e2e-logs \
            PREFLIGHT_OWNER_URL=postgresql://rasta_asset_migrator:rasta_asset_migrator_dev_password@localhost:5432/rasta_asset?schema=public \
            node scripts/runtime-preflight.e2e.mjs refused asset-service )
          ( maintenance_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service maintenance-service)" && \
            fleet_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service fleet-service)" && \
            eval "${maintenance_credentials}" && eval "${fleet_credentials}" && \
            PORT=3105 PREFLIGHT_STATE_DIR=/tmp/rasta-web-e2e-logs \
            PREFLIGHT_OWNER_URL=postgresql://rasta_maintenance_migrator:rasta_maintenance_migrator_dev_password@localhost:5432/rasta_maintenance?schema=public \
            DATABASE_URL_MAINTENANCE=postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public \
            node scripts/runtime-preflight.e2e.mjs refused maintenance-service )

          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service identity-service)" && \
            eval "${kafka_credentials}" && \
            cd services/identity-service && \
            PORT=3101 SERVICE_NAME=identity-service \
            DATABASE_URL=postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/identity.log 2>&1 & )

          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service fleet-service)" && \
            eval "${kafka_credentials}" && \
            cd services/fleet-service && \
            PORT=3104 SERVICE_NAME=fleet-service \
            DATABASE_URL=postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/fleet.log 2>&1 & )

          # organization, asset and maintenance: the browser suite's tenant-isolation
          # and accessibility scenarios read the asset and maintenance screens
          # and the organization page through the real services. Each gets its
          # own SASL principal, as in production; asset-service and
          # maintenance-service connect to the broker at boot, so they would
          # not start without it.
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service organization-service)" && \
            eval "${kafka_credentials}" && \
            cd services/organization-service && \
            PORT=3102 SERVICE_NAME=organization-service \
            DATABASE_URL=postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/organization.log 2>&1 & )

          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service asset-service)" && \
            eval "${kafka_credentials}" && \
            cd services/asset-service && \
            PORT=3103 SERVICE_NAME=asset-service \
            DATABASE_URL=postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/asset.log 2>&1 & )

          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service maintenance-service)" && \
            eval "${kafka_credentials}" && \
            cd services/maintenance-service && \
            PORT=3105 SERVICE_NAME=maintenance-service \
            DATABASE_URL=postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/maintenance.log 2>&1 & )

          # document-service (EXP-002 slice 7): the portal's attach-document
          # scenarios register a real file. The scanner is the development stub
          # (`disabled`, refused in production) and its worker is off: a
          # registered document stays PENDING, which nothing here needs to
          # change — attaching a reference does not wait for a verdict, and the
          # scan pipeline is proven by document-service's own job.
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service document-service)" && \
            eval "${kafka_credentials}" && \
            cd services/document-service && \
            PORT=3114 SERVICE_NAME=document-service \
            DATABASE_URL=postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public \
            S3_ENDPOINT=http://localhost:9000 S3_REGION=us-east-1 \
            S3_ACCESS_KEY=rasta_minio_admin S3_SECRET_KEY=rasta_minio_ci_password \
            S3_BUCKET_DOCUMENTS=rasta-documents S3_FORCE_PATH_STYLE=true \
            DOCUMENT_SCANNER_DRIVER=disabled DOCUMENT_SCAN_WORKER_ENABLED=false \
            node dist/main.js > /tmp/rasta-web-e2e-logs/document.log 2>&1 & )

          # marketplace-service (EXP-003): the portal's place-order scenarios
          # (`e2e/orders.spec.ts`). Started in ADR-039's explicit no-Temporal
          # mode, so an order stays PENDING: no saga runs and no wallet is
          # touched — the suite places orders and reads them, and cannot move
          # money (economic-service is in this stack for the settlement
          # scenarios only, and no order reaches it). The return window is a
          # value for this throwaway stack only — Q-132 leaves the real one
          # open, and with none set every return is refused — so the return
          # scenarios (`e2e/returns.spec.ts`) have a window to be inside of,
          # and one the fixture's old order is past.
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service marketplace-service)" && \
            eval "${kafka_credentials}" && \
            cd services/marketplace-service && \
            PORT=3106 SERVICE_NAME=marketplace-service \
            MARKETPLACE_TEMPORAL_ENABLED=false \
            MARKETPLACE_RETURN_WINDOW_DAYS=30 \
            DATABASE_URL=postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/marketplace.log 2>&1 & )

          # economic-service (EXP-003 slice 2): the settlement scenarios
          # (`e2e/settlements.spec.ts`) make a settlement through the gateway as
          # ORG-DEH-0001's administrator and read it back through the portal. The
          # only payment provider is the mock one (ECONOMIC_PAYMENT_PROVIDER), so
          # no money moves and nothing here talks to a bank.
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service economic-service)" && \
            eval "${kafka_credentials}" && \
            cd services/economic-service && \
            PORT=3112 SERVICE_NAME=economic-service \
            DATABASE_URL=postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public \
            ECONOMIC_BALANCE_AUDIT_ENABLED=false \
            node dist/main.js > /tmp/rasta-web-e2e-logs/economic.log 2>&1 & )

          # EXP-004 — supplier-service: a contractor may bid only while
          # supplier-service says, at that moment, that its organization is
          # qualified for CONTRACTING and not suspended (BIDDER_NOT_ELIGIBLE
          # otherwise). The bid scenarios (`e2e/tender-bids.spec.ts`) register
          # their contractor and have system.admin approve its qualification
          # through it. Started before construction-service, which loads its
          # standing read model from this service's snapshot (and retries until
          # it can).
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service supplier-service)" && \
            eval "${kafka_credentials}" && \
            cd services/supplier-service && \
            PORT=3108 SERVICE_NAME=supplier-service \
            DATABASE_URL=postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/supplier.log 2>&1 & )

          # EXP-004 — audit-service: the owner scenarios
          # (`e2e/tender-owner.spec.ts`) open a tender's bids, which
          # construction-service does only once audit-service holds every
          # bid's receipt (from the bid events on Kafka) and the chain agrees
          # with its own. The runtime role, never the migrator: audit-service
          # must not be able to alter or drop what it writes (ADR-053 § 6).
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service audit-service)" && \
            eval "${kafka_credentials}" && \
            cd services/audit-service && \
            PORT=3115 SERVICE_NAME=audit-service \
            DATABASE_URL_AUDIT=postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit \
            node dist/main.js > /tmp/rasta-web-e2e-logs/audit.log 2>&1 & )

          # EXP-004 — construction-service: the `/projects` live-isolation
          # scenarios (`e2e/tenant-isolation.spec.ts`) create a real project
          # per tenant through `POST /v1/projects` and read it back through
          # the portal, and the bid scenarios (`e2e/tender-bids.spec.ts`)
          # publish a tender per test and bid on it. A tender is published only
          # with a key-encryption key to wrap its private key (ADR-066 § 2):
          # minted for this run, masked, and handed to this one process alone,
          # as the API e2e job does — no other service holds it.
          tender_kek="$(openssl rand -base64 32)"
          echo "::add-mask::${tender_kek}"
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service construction-service)" && \
            eval "${kafka_credentials}" && \
            cd services/construction-service && \
            PORT=3110 SERVICE_NAME=construction-service \
            DATABASE_URL=postgresql://rasta_construction:rasta_construction_dev_password@localhost:5432/rasta_construction?schema=public \
            CONSTRUCTION_TENDER_KEKS="e2e-run:${tender_kek}" \
            CONSTRUCTION_TENDER_KEK_CURRENT=e2e-run \
            node dist/main.js > /tmp/rasta-web-e2e-logs/construction.log 2>&1 & )
          unset tender_kek

          # EXP-004 — inventory-service: the `/inventory` live-isolation
          # scenarios create a real warehouse per tenant through
          # `POST /v1/warehouses` and read it back through the portal.
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service inventory-service)" && \
            eval "${kafka_credentials}" && \
            cd services/inventory-service && \
            PORT=3109 SERVICE_NAME=inventory-service \
            DATABASE_URL=postgresql://rasta_inventory:rasta_inventory_dev_password@localhost:5432/rasta_inventory?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/inventory.log 2>&1 & )

          # EXP-004 — contract-service: the statement scenarios draft, submit
          # and decide a statement of the fixture's contract through the portal.
          # Its Kafka consumers (TENDER_AWARDED, ORGANIZATION_MOVED) start and
          # see nothing; no setting here widens a role.
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service contract-service)" && \
            eval "${kafka_credentials}" && \
            cd services/contract-service && \
            PORT=3111 SERVICE_NAME=contract-service \
            DATABASE_URL=postgresql://rasta_contract:rasta_contract_dev_password@localhost:5432/rasta_contract?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/contract.log 2>&1 & )

          # The per-person allowance (GATEWAY_RATE_LIMIT_MAX, 300 a minute per
          # user and route prefix by default) is sized for one human. Here three
          # seeded people stand in for every scenario of both Playwright
          # projects at once — `dehyari.admin` alone drives the lifecycle,
          # tenant-isolation and accessibility specs at desktop and phone size
          # through `/v1/assets` — and every dossier load is three reads of that
          # prefix since EXP-002 slice 6. Over 300 the gateway answers 429 and
          # whichever spec runs last fails for a reason it does not test (#206).
          # The limit is set to the organization ceiling
          # (GATEWAY_TENANT_RATE_LIMIT_MAX, default 3000), which still applies:
          # nothing here tests the limiter itself — its own specs do, in
          # services/api-gateway — and production keeps its default.
          ( cd services/api-gateway && \
            PORT=3000 SERVICE_NAME=api-gateway \
            GATEWAY_RATE_LIMIT_MAX=3000 \
            node dist/main.js > /tmp/rasta-web-e2e-logs/gateway.log 2>&1 & )

          for attempt in $(seq 1 60); do
            identity="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3101/health/ready || true)"
            fleet="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3104/health/ready || true)"
            organization="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3102/health/ready || true)"
            asset="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3103/health/ready || true)"
            maintenance="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3105/health/ready || true)"
            document="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3114/health/ready || true)"
            marketplace="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3106/health/ready || true)"
            economic="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3112/health/ready || true)"
            supplier="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3108/health/ready || true)"
            # 200 only once its projector has joined its consumer group.
            audit="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3115/health/ready || true)"
            construction="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3110/health/ready || true)"
            inventory="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3109/health/ready || true)"
            contract="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3111/health/ready || true)"
            gateway="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3000/v1/usage-records || true)"
            if [ "$identity" = "200" ] && [ "$fleet" = "200" ] \
               && [ "$organization" = "200" ] && [ "$asset" = "200" ] \
               && [ "$maintenance" = "200" ] && [ "$document" = "200" ] \
               && [ "$marketplace" = "200" ] && [ "$economic" = "200" ] \
               && [ "$supplier" = "200" ] && [ "$audit" = "200" ] \
               && [ "$construction" = "200" ] && [ "$inventory" = "200" ] \
               && [ "$contract" = "200" ] && [ "$gateway" = "401" ]; then
              echo "portal live stack ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done

          echo "portal live stack failed (identity=${identity}, fleet=${fleet}, organization=${organization}, asset=${asset}, maintenance=${maintenance}, document=${document}, marketplace=${marketplace}, economic=${economic}, supplier=${supplier}, audit=${audit}, construction=${construction}, inventory=${inventory}, contract=${contract}, gateway=${gateway})"
          cat /tmp/rasta-web-e2e-logs/identity.log
          cat /tmp/rasta-web-e2e-logs/fleet.log
          cat /tmp/rasta-web-e2e-logs/organization.log
          cat /tmp/rasta-web-e2e-logs/asset.log
          cat /tmp/rasta-web-e2e-logs/maintenance.log
          cat /tmp/rasta-web-e2e-logs/document.log
          cat /tmp/rasta-web-e2e-logs/marketplace.log
          cat /tmp/rasta-web-e2e-logs/economic.log
          cat /tmp/rasta-web-e2e-logs/supplier.log
          cat /tmp/rasta-web-e2e-logs/audit.log
          cat /tmp/rasta-web-e2e-logs/construction.log
          cat /tmp/rasta-web-e2e-logs/inventory.log
          cat /tmp/rasta-web-e2e-logs/contract.log
          cat /tmp/rasta-web-e2e-logs/gateway.log
          exit 1

      - name: What the owner-URL starts left alone is consumed through the runtime role
        # The positive controls for the refusals in the start step (D-045,
        # Codex on #178): now asset-service and maintenance-service run as their
        # runtime roles, each group's offset must move past the queued event,
        # and maintenance-service must have folded it — the event marked
        # processed and the asset's usage meter written.
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          PREFLIGHT_STATE_DIR: /tmp/rasta-web-e2e-logs
          # Read back, as the runtime role, for maintenance's real outcome.
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
        run: |
          set -euo pipefail
          asset_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh service asset-service)"
          maintenance_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh service maintenance-service)"
          unset KAFKA_SECRETS_DIR
          ( eval "${asset_credentials}" && node scripts/runtime-preflight.e2e.mjs consumed asset-service )
          ( eval "${maintenance_credentials}" && node scripts/runtime-preflight.e2e.mjs consumed maintenance-service )

      - name: Refresh coordination against a real Redis
        # The coordinator's lease, fencing (the Lua itself), lost-lease and TTL
        # tests, against this job's Redis service. REQUIRED makes a missing
        # URL fail the step instead of quietly skipping the real run.
        run: pnpm --filter @rasta/web exec jest src/server/refresh-coordinator
        env:
          WEB_TEST_REDIS_URL: redis://localhost:6379
          WEB_TEST_REDIS_REQUIRED: 'true'

      # Chromium only. A second engine doubles the job for a page whose
      # critical behavior is server-rendered HTML and a native form post.
      - name: Install the browser
        run: pnpm --filter @rasta/web exec playwright install --with-deps chromium

      - name: Run the browser suite
        run: pnpm --filter @rasta/web exec playwright test
        env:
          WEB_LIVE_STACK_E2E: 'true'
          # EXP-004: construction-service and inventory-service are up in this
          # job (above), so `/projects` and `/inventory` live-isolation
          # scenarios run for real instead of skipping.
          WEB_LIVE_STACK_E2E_EXP004: 'true'
          # contract-service is up and its fixtures loaded (above), so the
          # statement and contract command scenarios
          # (`e2e/contract-statements.spec.ts`, `e2e/contract-commands.spec.ts`)
          # run for real.
          # They provision their contractor and second approver through
          # identity-service and give each a password through Keycloak's admin
          # API, with this run's KEYCLOAK_ADMIN_PASSWORD (job environment).
          WEB_LIVE_STACK_E2E_CONTRACTS: 'true'
          # EXP-003 returns: the fixture's completed orders are loaded and
          # marketplace-service has a return window (above). The scenario
          # provisions its third organization's person through identity-service
          # and the Keycloak admin API, with this run's KEYCLOAK_ADMIN_PASSWORD
          # (job environment).
          WEB_LIVE_STACK_E2E_RETURNS: 'true'
          # The contract command scenarios write their own contract per test, as
          # contract-service's runtime role (`e2e/contract-fixture.ts`), so a
          # retry runs against new state (PR 342 review 1, finding 2).
          WEB_E2E_CONTRACT_DATABASE_URL: postgresql://rasta_contract:rasta_contract_dev_password@localhost:5432/rasta_contract
          # construction-service holds a tender key, and supplier-service and
          # audit-service are up (above), so the bid and owner scenarios
          # (`e2e/tender-bids.spec.ts`, `e2e/tender-owner.spec.ts`) run for
          # real: they make their own owner, policies, project and people
          # through the platform's routes, and draft a tender per test.
          WEB_LIVE_STACK_E2E_TENDERS: 'true'
          WEB_E2E_FLEET_URL: http://localhost:3104
          WEB_E2E_MAINTENANCE_URL: http://localhost:3105
          API_GATEWAY_URL: http://localhost:3000
          OIDC_ISSUER_URL: http://localhost:8080/realms/rasta
          OIDC_CLIENT_ID: rasta-web
          WEB_PUBLIC_ORIGIN: http://localhost:3200
          WEB_COOKIE_SECURE: 'false'
          # The job's Redis service: the portal coordinates refreshes through it.
          WEB_REDIS_URL: redis://localhost:6379

      - name: Live-stack logs
        if: failure()
        run: |
          echo '--- identity-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/identity.log || true
          echo '--- fleet-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/fleet.log || true
          echo '--- organization-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/organization.log || true
          echo '--- asset-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/asset.log || true
          echo '--- maintenance-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/maintenance.log || true
          echo '--- document-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/document.log || true
          echo '--- marketplace-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/marketplace.log || true
          echo '--- economic-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/economic.log || true
          echo '--- supplier-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/supplier.log || true
          echo '--- audit-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/audit.log || true
          echo '--- construction-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/construction.log || true
          echo '--- inventory-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/inventory.log || true
          echo '--- contract-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/contract.log || true
          echo '--- api-gateway ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/gateway.log || true
          echo '--- keycloak ---'
          docker logs --tail 200 rasta-web-e2e-keycloak || true

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Prometheus configuration and alert rules. Its own job so the Docker pull
  # stays out of `quality`. Same image as the `prometheus` service in
  # docker-compose.yml, with the whole directory mounted where that service
  # sees it, so `rule_files` resolves to the same path here as at runtime.
  # ---------------------------------------------------------------------------
  prometheus-rules:
    name: Prometheus config and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pre-pull Prometheus (retries transient registry errors)
        run: |
          scripts/ci-pull-image.sh \
            prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218

      - name: Check config and rule syntax
        # Also fails when a file named in `rule_files` does not exist.
        run: |
          docker run --rm -v "$PWD/infrastructure/docker/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218 \
            check config /etc/prometheus/prometheus.yml

      - name: Test alert rule behaviour
        # Every file under `tests/`, expanded inside the container rather than
        # named one by one here. A service that adds alert rules now adds its
        # test file and nothing else: naming them individually made this step
        # one more line every such change had to touch, and a test file
        # somebody forgot to name would have read as a tested rule that
        # nothing actually runs.
        run: |
          docker run --rm -v "$PWD/infrastructure/docker/prometheus:/etc/prometheus:ro" \
            --entrypoint sh prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218 \
            -c 'promtool test rules /etc/prometheus/tests/*.test.yml'

  # ---------------------------------------------------------------------------
  # Integration and the security tests that need a real database, in four
  # parallel jobs, then one check under the old name.
  #
  # Until #273 this was one job, and it had grown to 33–34 minutes on main:
  # run 38571702875 was cancelled at its 35-minute limit twice, and #271's
  # first attempt failed when the construction coverage step took 481.5 s of
  # its 480. The four jobs below run the same steps with the same commands,
  # environments and per-step limits; each provisions its own throwaway
  # PostgreSQL, broker and (where its suites read a bucket or scan a file)
  # MinIO and ClamAV, the way the single job did. Measured on main run
  # 38600385830, the single job's 1911 s split into about 11.5, 9.5, 11.5 and
  # 10.5 minutes, setup (~4 minutes) included.
  #
  #   integration-suites             every package's integration suites, then
  #                                  the PostgreSQL-only guards that ran last
  #   integration-security           test independence, tenant isolation and
  #                                  authorization, retry replay
  #   integration-coverage-critical  coverage gates of the 85% band
  #   integration-coverage           the other coverage gates
  #
  # `integration` itself keeps the name branch protection and the merge queue
  # know, "Integration and security tests", and passes only when all four
  # passed. `scripts/ci-integration-split.test.mjs` fails if a job named
  # `integration-*` is left out of it, and holds every test and guard step to
  # the inventory in `scripts/ci-integration-split-lib.mjs`: its exact
  # command, the env it was declared with, and a limit of its own (the
  # PostgreSQL guards and retry replay 5 minutes, test independence 8; they
  # took 2–60 s on run 38676719548). No step here, and no job, may carry
  # `if:` or `continue-on-error`.
  #
  # Service containers rather than Testcontainers here: GitHub provisions them
  # before the job starts, which is faster and avoids docker-in-docker.
  # ---------------------------------------------------------------------------
  integration-suites:
    name: Integration tests and database guards
    runs-on: ubuntu-latest
    # About 11.5 minutes on main run 38600385830 (setup ~4m, the suites 428 s,
    # the guards 28 s). 25 is twice that, and the suites carry their own 12.
    # History of the single job's limit: 60 (#197), 35 once reversibility
    # moved out (#198), 50 as #273's stopgap until this split.
    timeout-minutes: 25
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # notification-service's SMTP suites (`email-delivery`, `mail-channel`)
      # read the messages back through Mailpit's HTTP API. Same image and
      # digest as `docker-compose.yml`. The steps that run them set
      # REQUIRE_MAILPIT=1, so an unreachable Mailpit fails the suite instead of
      # skipping it (`services/notification-service/test/mailpit.ts`).
      mailpit:
        image: axllent/mailpit:v1.22@sha256:f7f7c31de4de59540ad6515a0ca057a77525bca2069b6e747d873ca66c10fe08
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          # A throwaway cluster, bootstrapped as compose bootstraps its own:
          # unset role passwords take the published development defaults,
          # which lib/role-passwords.bash allows only under this flag.
          RASTA_DB_BOOTSTRAP: compose
          POSTGRES_USER: rasta
        run: |
          # The same script the local stack uses, so CI and a developer
          # laptop provision identically. Divergence here is how "works on my
          # machine" starts.
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - run: pnpm run db:generate

      - name: Start the authenticated Kafka broker
        # RUN-006, ADR-061 § 3: SASL_SSL with one SCRAM principal per service
        # and per-topic ACLs generated from the event contracts, started the
        # way compose starts it (infrastructure/docker/kafka/ci-up.sh), so a
        # service or test that reaches past its declared topics fails here as
        # it would in production. Per-run passwords, masked, stay in two
        # private directories (the admin's apart), each given only to the
        # steps that need it; only KAFKA_SSL and the CA go through GITHUB_ENV.
        # Every platform topic is created (auto-creation stays off, ADR-006)
        # and the group coordinator is loaded before any test joins a group.
        run: bash infrastructure/docker/kafka/ci-up.sh
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          KAFKA_ADMIN_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-admin-secrets

      - name: Pre-pull MinIO and ClamAV (retries transient registry errors)
        run: |
          scripts/ci-pull-image.sh \
            "$MINIO_IMAGE" "$MC_IMAGE" \
            clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6

      - name: Start MinIO and create the document bucket
        # `docker run` rather than a `services:` container, and not by
        # preference: a service container cannot override the image's command,
        # and `minio/minio` needs `server /data` to start at all. The e2e job
        # below starts Keycloak and Temporal the same way for the same reason.
        #
        # document-service's suites talk to a real bucket. ADR-014 puts the
        # file outside the service entirely — signed URLs, magic-number
        # inspection on bytes read back from storage, an attachment
        # disposition set at the storage boundary — and none of that exists in
        # a mock. A suite that stubbed S3 would prove the mock.
        #
        # The Chainguard images (env above) run as uid 65532 with no shell,
        # hence the tmpfs for /data, `mc -C` for a writable config dir, and
        # MC_HOST_<alias> instead of `mc alias set` inside `sh -c`.
        run: |
          set -euo pipefail
          docker run -d --name rasta-ci-minio --network host \
            --tmpfs /data:uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=rasta_minio_admin \
            -e MINIO_ROOT_PASSWORD=rasta_minio_ci_password \
            "$MINIO_IMAGE" server /data --address ':9000'

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo 'MinIO is live'
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null

          # Private bucket, explicitly. ADR-014 requires it: every read goes
          # through a signed URL, and an anonymous policy here would make the
          # download tests pass for the wrong reason.
          mc() {
            docker run --rm --network host \
              -e MC_HOST_rasta=http://rasta_minio_admin:rasta_minio_ci_password@localhost:9000 \
              "$MC_IMAGE" -C /tmp/.mc "$@"
          }
          mc mb --ignore-existing rasta/rasta-documents
          mc anonymous set none rasta/rasta-documents

      - name: Start ClamAV on a Unix socket
        # The production transport, proven here rather than only described.
        #
        # ADR-049 makes a Unix domain socket on a volume shared inside one Pod
        # the production boundary, because the clamd protocol authenticates
        # nobody and a TCP listener's only protection would be "nothing else is
        # on this network" — the assumption AGENTS.md S-08 forbids.
        # `document-service` refuses `DOCUMENT_CLAMAV_HOST` outright when
        # NODE_ENV is production.
        #
        # A Linux runner can share a socket with a container through a bind
        # mount, so CI exercises the transport a deployment uses. A developer
        # machine on Windows cannot, and falls back to the loopback TCP
        # listener `docker-compose.yml` publishes.
        #
        # Pinned by digest, not by tag: `clamav/clamav:1.5.4` is rebuilt
        # whenever its base or bundled signature set changes, so a tag means a
        # different scanner on a different day with no commit to show for it.
        # Bumping it is a reviewable edit to this line and to the compose file.
        #
        # `--user 100:101` with the entrypoint overridden to `clamd`: the
        # image's own `/init` needs root at start to create /run/clamav and
        # link /var/lock, and running the whole container as root to get that
        # is a poor trade.
        #
        # **freshclam is deliberately not running here.** The image ships the
        # reviewed CVD set inside the pinned digest, so the suites start from a
        # known database and no test downloads ~110 MB from the ClamAV mirrors.
        # That is what makes these runs deterministic and fast; that updating
        # actually works is proven by the `clamav-signatures` job below, which
        # runs freshclam for real and is separate on purpose.
        run: |
          set -euo pipefail
          mkdir -p /tmp/clamav-socket
          # World-writable, because the runner's user and the container's
          # `clamav` (uid 100) are different and CI has no shared group to hang
          # the permission on. In production the socket sits on a Pod-local
          # emptyDir shared by exactly two containers and is mode 0660 with a
          # shared group — see docs/12-deployment-architecture.md.
          chmod 0777 /tmp/clamav-socket

          docker run -d --name rasta-ci-clamav \
            --user 100:101 \
            -e TZ=Etc/UTC \
            -v /tmp/clamav-socket:/run/clamav \
            -v "$PWD/infrastructure/docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            --entrypoint clamd \
            clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6

          # Loading ~110 MB of signatures takes a while, and the socket exists
          # before the engine is ready — so this asks clamd itself, which
          # answers PING only once it can scan.
          for attempt in $(seq 1 60); do
            if docker exec rasta-ci-clamav clamdscan --ping 1 >/dev/null 2>&1; then
              echo "clamd ready after ${attempt} attempt(s)"
              docker exec rasta-ci-clamav clamdscan --version
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo 'clamd did not become ready'
              docker logs --tail 100 rasta-ci-clamav
              exit 1
            fi
            sleep 5
          done

          # Widen the socket so the runner can open it.
          #
          # clamd creates it 0660 owned by uid 100 / gid 101, which is right:
          # in production the two containers share a Pod and a group, and
          # `fsGroup` makes filesystem permissions the access control
          # (ADR-049, docs/deployment). A GitHub runner has no group in common
          # with the container, so the same socket is unopenable to it and
          # every document suite fails with CONNECTION_FAILED — which is what
          # happened on the first run of this job.
          #
          # This widening is CI-only and applied *after* startup, so the
          # production config file keeps its 0660 and nothing about the
          # deployment posture changes. The socket lives on a runner-local tmp
          # path for the length of one job.
          docker exec rasta-ci-clamav chmod 0666 /run/clamav/clamd.sock

          # Prove the runner itself can speak to it, rather than discovering
          # it 60 test failures later. A setup step that only checks the
          # container has checked the wrong side of the boundary.
          node -e '
            const net = require("node:net");
            const s = net.connect({ path: "/tmp/clamav-socket/clamd.sock" });
            s.on("connect", () => s.write("zPING" + String.fromCharCode(0)));
            s.on("data", (d) => {
              const reply = d.toString().split(String.fromCharCode(0)).join("").trim();
              console.log("clamd answered the runner:", reply);
              process.exit(reply === "PONG" ? 0 : 1);
            });
            s.on("error", (e) => { console.error("runner cannot reach clamd:", e.code); process.exit(1); });
            setTimeout(() => { console.error("clamd did not answer the runner"); process.exit(1); }, 15000);
          '

      - name: Apply migrations
        # `notification` and `audit` are registered in the three steps that
        # iterate **every** workspace service — this one, `Integration tests`
        # and `Tenant isolation` — so the branch that adds either service's
        # first migration does not also have to edit this workflow, which is
        # the three-way collision the shared-registration step exists to avoid
        # (ADR-053 plan, Step Zero).
        #
        # `audit` and `notification` are both registered in migration
        # reversibility too, each the moment it had a real migration to
        # reverse and not before — a vacuous entry is worse than none (that
        # check left this job for its own with #198, and is split across the
        # `migration-reversibility-chain` shards since task 082). `audit`
        # arrived there with AUD-001 and `notification` with NTF-001, both
        # under the whole-chain `verify-migration-reversible.mjs <service>`.
        # `identity` is registered there as well, by the two named verifiers
        # that reach the migrations the whole-chain harness cannot — AUD-004's
        # `security_event_outbox` and AUD-003's `audit_correction_command`, in
