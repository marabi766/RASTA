          DATABASE_URL_SUPPLIER_MIGRATOR: postgresql://rasta_supplier_migrator:rasta_supplier_migrator_dev_password@localhost:5432/rasta_supplier?schema=public

      - name: Supplier privilege split, upgraded from main
        # Codex review of #120: supplier-service's runtime role must own
        # nothing — not the tables (it could disable the append-only
        # triggers), not the database (it could drop it). A throwaway database
        # is built and seeded exactly as main leaves it, then upgraded with
        # lib/supplier-privilege-split.bash and the remaining migrations; the
        # suite checks the rows survive and the runtime role gets 42501 for
        # DISABLE TRIGGER, ALTER, DROP and DROP DATABASE.
        timeout-minutes: 5
        run: pnpm run test:supplier-privilege-split
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: rasta
          PGPASSWORD: rasta_ci_password

      - name: Runtime roles own nothing (D-045)
        # A service's runtime database role must hold DML and nothing more: no
        # ownership of its database, a schema, a table, a function or a type;
        # no CREATE; no TRUNCATE, REFERENCES or TRIGGER; nothing on the
        # migration ledger; no CREATEDB, CREATEROLE, BYPASSRLS or SUPERUSER.
        # Owning a table is what lets SQL running as the service ALTER TABLE
        # … DISABLE TRIGGER and lift an integrity guard. Runs against every
        # service database this job bootstrapped and migrated; every service
        # must be split (audit its own way), so a new one that is not fails.
        timeout-minutes: 5
        run: pnpm run check:db-runtime-privileges
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: rasta
          PGPASSWORD: rasta_ci_password

      - name: Runtime-role check and the generic split, on a throwaway database
        # The negative control for the step above: a database built the way an
        # unsplit service is — owned by its runtime role — must be reported in
        # full; after lib/service-privilege-split.bash it must be reported
        # clean, its rows intact and its trigger out of the runtime role's reach.
        timeout-minutes: 5
        run: pnpm run test:db-runtime-privileges
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: rasta
          PGPASSWORD: rasta_ci_password

      - name: Every database session runs in UTC (L7-37)
        # A throwaway role whose default TimeZone is Asia/Tehran: a raw `now()`
        # into a `timestamp(3)` column under it comes back 3½ hours off, which
        # the control proves. The runtime URL every service builds
        # (@rasta/config), the migration runner (scripts/prisma.mjs) and the
        # demo seeds must each open their sessions in UTC regardless, and the
        # runner's copy of the URL function must agree with the services'.
        timeout-minutes: 5
        run: pnpm run test:db-session-utc
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: rasta
          PGPASSWORD: rasta_ci_password

      - name: The runtime pool and statement timeout come from configuration
        # DATABASE_POOL_SIZE and DATABASE_POOL_TIMEOUT_SECONDS reach Prisma
        # only through the URL every service builds (@rasta/config): unset,
        # a burst still opens Prisma's default pool; set, a client opened on
        # that URL keeps to the size and fails with P2024 after the wait. And
        # every service's clients are opened on that URL and no other.
        # DATABASE_STATEMENT_TIMEOUT_MS is opt-in: unset, the session keeps
        # the database's own; set, a longer statement is cancelled with 57014.
        timeout-minutes: 5
        run: pnpm run test:db-pool-config
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: rasta
          PGPASSWORD: rasta_ci_password

  integration-security:
    name: Tenant isolation, test independence and retry replay
    runs-on: ubuntu-latest
    # About 9.5 minutes on main run 38600385830 (setup ~4m, independence 57 s,
    # tenant isolation 253 s, retry replay 22 s). Tenant isolation keeps its
    # own 10.
    timeout-minutes: 25
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          # A throwaway cluster, bootstrapped as compose bootstraps its own:
          # unset role passwords take the published development defaults,
          # which lib/role-passwords.bash allows only under this flag.
          RASTA_DB_BOOTSTRAP: compose
          POSTGRES_USER: rasta
        run: |
          # The same script the local stack uses, so CI and a developer
          # laptop provision identically. Divergence here is how "works on my
          # machine" starts.
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - run: pnpm run db:generate

      - name: Build the shared packages
        # The suites below resolve @rasta/config, @rasta/nest-common and the
        # other workspace packages to their dist. In the single job, the
        # `Integration tests` step's turbo `^build` produced those before any
        # of these steps ran; here nothing else does. Packages only, as in
        # `migration-guards`: no service is built or started here.
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Start the authenticated Kafka broker
        # RUN-006, ADR-061 § 3: SASL_SSL with one SCRAM principal per service
        # and per-topic ACLs generated from the event contracts, started the
        # way compose starts it (infrastructure/docker/kafka/ci-up.sh), so a
        # service or test that reaches past its declared topics fails here as
        # it would in production. Per-run passwords, masked, stay in two
        # private directories (the admin's apart), each given only to the
        # steps that need it; only KAFKA_SSL and the CA go through GITHUB_ENV.
        # Every platform topic is created (auto-creation stays off, ADR-006)
        # and the group coordinator is loaded before any test joins a group.
        run: bash infrastructure/docker/kafka/ci-up.sh
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          KAFKA_ADMIN_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-admin-secrets

      - name: Pre-pull MinIO and ClamAV (retries transient registry errors)
        run: |
          scripts/ci-pull-image.sh \
            "$MINIO_IMAGE" "$MC_IMAGE" \
            clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6

      - name: Start MinIO and create the document bucket
        # document-service's suites are in the tenant isolation step's
        # selection. Same images, bucket and private policy as in
        # `integration-suites`; see that job for why each is the way it is.
        run: |
          set -euo pipefail
          docker run -d --name rasta-ci-minio --network host \
            --tmpfs /data:uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=rasta_minio_admin \
            -e MINIO_ROOT_PASSWORD=rasta_minio_ci_password \
            "$MINIO_IMAGE" server /data --address ':9000'

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo 'MinIO is live'
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null

          # Private bucket, explicitly. ADR-014 requires it: every read goes
          # through a signed URL, and an anonymous policy here would make the
          # download tests pass for the wrong reason.
          mc() {
            docker run --rm --network host \
              -e MC_HOST_rasta=http://rasta_minio_admin:rasta_minio_ci_password@localhost:9000 \
              "$MC_IMAGE" -C /tmp/.mc "$@"
          }
          mc mb --ignore-existing rasta/rasta-documents
          mc anonymous set none rasta/rasta-documents

      - name: Start ClamAV on a Unix socket
        # document-service's suites scan through the socket, as in
        # `integration-suites`. Same pinned digest, non-root entrypoint, CI-only
        # widening after startup and runner-side PING; see that job for why.
        run: |
          set -euo pipefail
          mkdir -p /tmp/clamav-socket
          # World-writable, because the runner's user and the container's
          # `clamav` (uid 100) are different and CI has no shared group to hang
          # the permission on. In production the socket sits on a Pod-local
          # emptyDir shared by exactly two containers and is mode 0660 with a
          # shared group — see docs/12-deployment-architecture.md.
          chmod 0777 /tmp/clamav-socket

          docker run -d --name rasta-ci-clamav \
            --user 100:101 \
            -e TZ=Etc/UTC \
            -v /tmp/clamav-socket:/run/clamav \
            -v "$PWD/infrastructure/docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            --entrypoint clamd \
            clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6

          # Loading ~110 MB of signatures takes a while, and the socket exists
          # before the engine is ready — so this asks clamd itself, which
          # answers PING only once it can scan.
          for attempt in $(seq 1 60); do
            if docker exec rasta-ci-clamav clamdscan --ping 1 >/dev/null 2>&1; then
              echo "clamd ready after ${attempt} attempt(s)"
              docker exec rasta-ci-clamav clamdscan --version
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo 'clamd did not become ready'
              docker logs --tail 100 rasta-ci-clamav
              exit 1
            fi
            sleep 5
          done

          # Widen the socket so the runner can open it.
          #
          # clamd creates it 0660 owned by uid 100 / gid 101, which is right:
          # in production the two containers share a Pod and a group, and
          # `fsGroup` makes filesystem permissions the access control
          # (ADR-049, docs/deployment). A GitHub runner has no group in common
          # with the container, so the same socket is unopenable to it and
          # every document suite fails with CONNECTION_FAILED — which is what
          # happened on the first run of this job.
          #
          # This widening is CI-only and applied *after* startup, so the
          # production config file keeps its 0660 and nothing about the
          # deployment posture changes. The socket lives on a runner-local tmp
          # path for the length of one job.
          docker exec rasta-ci-clamav chmod 0666 /run/clamav/clamd.sock

          # Prove the runner itself can speak to it, rather than discovering
          # it 60 test failures later. A setup step that only checks the
          # container has checked the wrong side of the boundary.
          node -e '
            const net = require("node:net");
            const s = net.connect({ path: "/tmp/clamav-socket/clamd.sock" });
            s.on("connect", () => s.write("zPING" + String.fromCharCode(0)));
            s.on("data", (d) => {
              const reply = d.toString().split(String.fromCharCode(0)).join("").trim();
              console.log("clamd answered the runner:", reply);
              process.exit(reply === "PONG" ? 0 : 1);
            });
            s.on("error", (e) => { console.error("runner cannot reach clamd:", e.code); process.exit(1); });
            setTimeout(() => { console.error("clamd did not answer the runner"); process.exit(1); }, 15000);
          '

      - name: Apply migrations
        # `integration-suites`' step and environment, unchanged: every
        # service, so each job starts from the same migrated databases the
        # single job gave these steps.
        run: pnpm run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_IDENTITY_MIGRATOR: postgresql://rasta_identity_migrator:rasta_identity_migrator_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ORGANIZATION_MIGRATOR: postgresql://rasta_organization_migrator:rasta_organization_migrator_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_ASSET_MIGRATOR: postgresql://rasta_asset_migrator:rasta_asset_migrator_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_FLEET_MIGRATOR: postgresql://rasta_fleet_migrator:rasta_fleet_migrator_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_MAINTENANCE_MIGRATOR: postgresql://rasta_maintenance_migrator:rasta_maintenance_migrator_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_ECONOMIC_MIGRATOR: postgresql://rasta_economic_migrator:rasta_economic_migrator_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_MARKETPLACE_MIGRATOR: postgresql://rasta_marketplace_migrator:rasta_marketplace_migrator_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_DOCUMENT_MIGRATOR: postgresql://rasta_document_migrator:rasta_document_migrator_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_SUPPLIER_MIGRATOR: postgresql://rasta_supplier_migrator:rasta_supplier_migrator_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_CONSTRUCTION: postgresql://rasta_construction:rasta_construction_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_CONSTRUCTION_MIGRATOR: postgresql://rasta_construction_migrator:rasta_construction_migrator_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_CONTRACT: postgresql://rasta_contract:rasta_contract_dev_password@localhost:5432/rasta_contract?schema=public
          DATABASE_URL_CONTRACT_MIGRATOR: postgresql://rasta_contract_migrator:rasta_contract_migrator_dev_password@localhost:5432/rasta_contract?schema=public
          DATABASE_URL_INVENTORY: postgresql://rasta_inventory:rasta_inventory_dev_password@localhost:5432/rasta_inventory?schema=public
          DATABASE_URL_INVENTORY_MIGRATOR: postgresql://rasta_inventory_migrator:rasta_inventory_migrator_dev_password@localhost:5432/rasta_inventory?schema=public
          DATABASE_URL_ANALYTICS: postgresql://rasta_analytics:rasta_analytics_dev_password@localhost:5432/rasta_analytics?schema=public
          DATABASE_URL_ANALYTICS_MIGRATOR: postgresql://rasta_analytics_migrator:rasta_analytics_migrator_dev_password@localhost:5432/rasta_analytics?schema=public
          DATABASE_URL_PROCUREMENT: postgresql://rasta_procurement:rasta_procurement_dev_password@localhost:5432/rasta_procurement?schema=public
          DATABASE_URL_PROCUREMENT_MIGRATOR: postgresql://rasta_procurement_migrator:rasta_procurement_migrator_dev_password@localhost:5432/rasta_procurement?schema=public
          DATABASE_URL_NOTIFICATION: postgresql://rasta_notification:rasta_notification_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_NOTIFICATION_MIGRATOR: postgresql://rasta_notification_migrator:rasta_notification_migrator_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Test independence (F-25)
        # Runs every test in maintenance's event-flow suite on its own and
        # requires it to pass alone.
        #
        # The step above this one re-runs single tests by name
        # (`--testNamePattern`), and that is only meaningful if a test selected
        # by name still has the state it asserts against. Five of the eight
        # tests in that file did not: they read rows an earlier `it()` had
        # written, so the file passed whole while `jest -t` failed four of them
        # with `findFirstOrThrow` raising "No record was found for a query" — a
        # message that names the query and says nothing about the missing
        # setup. That is F-25.
        #
        # A prose comment saying "each test must own its state" would not have
        # caught the regression, because the file kept passing. This executes
        # the claim instead: the script runs the file whole, takes the test
        # names from that run rather than from the source, and re-runs each one
        # alone, failing if a name selects zero tests or more than one.
        #
        # Scoped to the one file the defect was found in. Widening it is a
        # deliberate act, not a default, because each name costs a jest start.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm run test:independence
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_MAINTENANCE_MIGRATOR: postgresql://rasta_maintenance_migrator:rasta_maintenance_migrator_dev_password@localhost:5432/rasta_maintenance?schema=public

      - name: Tenant isolation and authorization tests
        # Called out separately from the rest of the suite so a failure names
        # itself in the job list. A tenant-isolation failure is a data leak,
        # not a flaky test, and must never be waved through (AGENTS.md § 5).
        #
        # Both projects, because the strongest isolation evidence now lives in
        # the integration suites — they prove the guard against a real database
        # rather than a mock that would assume the behaviour.
        #
        # The integration pattern names the invariants the product document
        # makes mandatory, one word each: `exclusivity` is fleet's one-driver
        # rule, `duplicate` is maintenance's duplicate-report control, and
        # `provenance` is the rule that a cost line must name the work that
        # produced it — the property economic-service audits against.
        #
        # The financial half was added with economic-service, and each word is
        # a row of docs/10 § 10.12's mandatory table rather than a test name:
        # `immutab` is the append-only ledger, `balance` is Σdebit = Σcredit and
        # the wallet/ledger agreement, `concurren` is the hundred parallel
        # withdrawals, `idempot` is one key one effect, `atomic` is a failed
        # settlement leaving nothing behind, `dispute` is the objection that
        # stops all movement, `overspend` is the negative balance that cannot
        # happen, and `cap` is the anti-fraud reward ceiling. A failure in any
        # of them is a financial defect, not a flaky test.
        #
        # Both commands go through the orchestrator, but only
        # `test:integration` has the exclusive phase — the aggregation stress
        # spec needs a real PostgreSQL, and `pnpm test` (so `pnpm verify`) must
        # run without one. So the stress spec is filtered and run alone by the
        # second command, where `concurren` selects its two 500-write proofs
        # (`check:test-phases`). The first command is unit suites only.
        timeout-minutes: 10
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm run test -- --testNamePattern="(tenant|isolation|authorization|subtree visibility)"
          pnpm run test:integration -- --testNamePattern="(tenant|isolation|exclusivity|duplicate|provenance|immutab|balance|concurren|idempot|atomic|dispute|overspend|cap)"
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_IDENTITY_MIGRATOR: postgresql://rasta_identity_migrator:rasta_identity_migrator_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ORGANIZATION_MIGRATOR: postgresql://rasta_organization_migrator:rasta_organization_migrator_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_ASSET_MIGRATOR: postgresql://rasta_asset_migrator:rasta_asset_migrator_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_FLEET_MIGRATOR: postgresql://rasta_fleet_migrator:rasta_fleet_migrator_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_MAINTENANCE_MIGRATOR: postgresql://rasta_maintenance_migrator:rasta_maintenance_migrator_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_ECONOMIC_MIGRATOR: postgresql://rasta_economic_migrator:rasta_economic_migrator_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_MARKETPLACE_MIGRATOR: postgresql://rasta_marketplace_migrator:rasta_marketplace_migrator_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_DOCUMENT_MIGRATOR: postgresql://rasta_document_migrator:rasta_document_migrator_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_SUPPLIER_MIGRATOR: postgresql://rasta_supplier_migrator:rasta_supplier_migrator_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_CONSTRUCTION: postgresql://rasta_construction:rasta_construction_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_CONSTRUCTION_MIGRATOR: postgresql://rasta_construction_migrator:rasta_construction_migrator_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_CONTRACT: postgresql://rasta_contract:rasta_contract_dev_password@localhost:5432/rasta_contract?schema=public
          DATABASE_URL_CONTRACT_MIGRATOR: postgresql://rasta_contract_migrator:rasta_contract_migrator_dev_password@localhost:5432/rasta_contract?schema=public
          DATABASE_URL_INVENTORY: postgresql://rasta_inventory:rasta_inventory_dev_password@localhost:5432/rasta_inventory?schema=public
          DATABASE_URL_INVENTORY_MIGRATOR: postgresql://rasta_inventory_migrator:rasta_inventory_migrator_dev_password@localhost:5432/rasta_inventory?schema=public
          DATABASE_URL_ANALYTICS: postgresql://rasta_analytics:rasta_analytics_dev_password@localhost:5432/rasta_analytics?schema=public
          DATABASE_URL_ANALYTICS_MIGRATOR: postgresql://rasta_analytics_migrator:rasta_analytics_migrator_dev_password@localhost:5432/rasta_analytics?schema=public
          DATABASE_URL_PROCUREMENT: postgresql://rasta_procurement:rasta_procurement_dev_password@localhost:5432/rasta_procurement?schema=public
          DATABASE_URL_PROCUREMENT_MIGRATOR: postgresql://rasta_procurement_migrator:rasta_procurement_migrator_dev_password@localhost:5432/rasta_procurement?schema=public
          DATABASE_URL_NOTIFICATION: postgresql://rasta_notification:rasta_notification_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_NOTIFICATION_MIGRATOR: postgresql://rasta_notification_migrator:rasta_notification_migrator_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: rasta_minio_admin
          S3_SECRET_KEY: rasta_minio_ci_password
          S3_BUCKET_DOCUMENTS: rasta-documents
          S3_FORCE_PATH_STYLE: 'true'
          # ADR-049. The socket is the production transport; document-service
          # refuses a TCP scanner when NODE_ENV is production, so proving it
          # here is proving what a deployment uses.
          DOCUMENT_CLAMAV_SOCKET_PATH: /tmp/clamav-socket/clamd.sock
          # The pinned image's database is frozen at its digest and freshclam is
          # off here for determinism, so it ages with the pin. Raised with a
          # written reason rather than left to fail every scan on a schedule
          # nobody chose. The production default is 48 hours and is asserted in
          # `env.spec.ts`; the rule itself is proven against a controlled clock
          # in `clamav.scanner.spec.ts`; and that freshclam updates at all is
          # proven by the `clamav-signatures` job.
          DOCUMENT_SCAN_SIGNATURE_MAX_AGE_HOURS: '8760'

      - name: Retry replay, published as ops-replay
        # D-039: a record the operator's replay principal publishes on
        # `<topic>.retry` is consumed like the original — applied once,
        # a forged producer dead-lettered with the message key kept. Only
        # ops-replay may write a `.retry` topic (RUN-006), so this is the one
        # step that gets its password (`kafka-credentials.sh replay`: the
        # `tests` scope plus ops-replay's), and it runs only the specs tagged
        # [retry-replay]. No other step's scope changes; `check:kafka-credential-scope`
        # allows exactly this step to take it. It fails, rather than skips,
        # without the credential.
        timeout-minutes: 5
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh replay)"
          eval "${kafka_credentials}"
          pnpm run test:retry-replay
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          KAFKA_ADMIN_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-admin-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          RETRY_REPLAY_REQUIRED: 'true'
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

  integration-coverage-critical:
    name: Coverage gates (construction, contract, inventory)
    runs-on: ubuntu-latest
    # About 11.5 minutes on main run 38600385830 (setup ~3.5m, construction
    # 325 s, contract 105 s, inventory 54 s). Each gate keeps its own 8.
    timeout-minutes: 25
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          # A throwaway cluster, bootstrapped as compose bootstraps its own:
          # unset role passwords take the published development defaults,
          # which lib/role-passwords.bash allows only under this flag.
          RASTA_DB_BOOTSTRAP: compose
          POSTGRES_USER: rasta
        run: |
          # The same script the local stack uses, so CI and a developer
          # laptop provision identically. Divergence here is how "works on my
          # machine" starts.
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - run: pnpm run db:generate

      - name: Build the shared packages
        # The suites below resolve @rasta/config, @rasta/nest-common and the
        # other workspace packages to their dist. In the single job, the
        # `Integration tests` step's turbo `^build` produced those before any
        # of these steps ran; here nothing else does. Packages only, as in
        # `migration-guards`: no service is built or started here.
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Start the authenticated Kafka broker
        # RUN-006, ADR-061 § 3: SASL_SSL with one SCRAM principal per service
        # and per-topic ACLs generated from the event contracts, started the
        # way compose starts it (infrastructure/docker/kafka/ci-up.sh), so a
