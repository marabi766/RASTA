        # The producer-side allocation protocol: strictly increasing sequences
        # on one stream, two transactions serializing on the counter row, a
        # rollback consuming no number, independent counters per key and per
        # topic, and the negative test that fleet and maintenance share nothing
        # for one asset. It runs here rather than in its own job because it
        # needs real service databases, which this job already has.
        #
        # Every url the suite touches is passed explicitly. Skipping a service
        # because its variable is missing would turn a missing gate into a
        # green one, which is the failure `pnpm test:e2e` used to have.
        timeout-minutes: 5
        run: pnpm run test:outbox-b3
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_IDENTITY_MIGRATOR: postgresql://rasta_identity_migrator:rasta_identity_migrator_dev_password@localhost:5432/rasta_identity?schema=public
