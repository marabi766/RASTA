        # made from, so it is in the 85% band with construction-service. Both
        # projects, for the reason the supplier gate gives: the unique index
        # that decides a race between two deliveries of one award, the CHECK
        # constraints and the origin-immutability trigger, the tenant guard
        # against real rows, the outbox coupling and the HTTP surface exist
        # only against a real database.
        timeout-minutes: 8
