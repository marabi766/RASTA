name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Supersede an in-flight run for the same ref: a stale result on an old
  # commit is worse than no result, because people act on it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Must match `packageManager` in package.json exactly. pnpm/action-setup
  # refuses to run when the two disagree, which is how every run before
  # 2026-08-27 died before `pnpm install` ever started (D-005).
  PNPM_VERSION: '11.22.0'
  # Object storage for document-service. Chainguard's signed builds, pinned by
  # multi-arch index digest: MinIO's own images stopped being publicly
  # pullable on 2026-09-24 (quay.io answers 401; Docker Hub's minio/minio is
  # gone). docker-compose.yml pins the same digests.
  MINIO_IMAGE: 'cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1'
  MC_IMAGE: 'cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338'

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback. Everything here runs without Docker, so it fails in ~2
  # minutes rather than after a container pull.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma clients are generated artefacts that typecheck depends on.
      - run: pnpm run db:generate

      - name: Product backlog and progress gate
        run: |
          pnpm run progress:check
          pnpm run test:progress

      - name: Service boundary gate
        # AGENTS.md A-02: a service reaches another only over REST or Kafka,
        # never by importing `services/<other>/src/**` or `test/**`. Runs the
        # checker's own tests first so a checker that stopped catching
        # anything fails loudly rather than passing an empty gate (AUD-004
        # Phase C1 hardening — the identity test tree once imported
        # audit-service directly and no gate caught it).
        run: |
          pnpm run test:service-boundaries-lib
          pnpm run check:service-boundaries

      - name: Local PostgreSQL defaults contract
        # `.env.example` must point host-side PostgreSQL at 127.0.0.1, not
        # `localhost`, which can try ::1 first against an IPv4-only listener
        # and time Prisma transactions out with P2028. Reads the committed file
        # as text only; the service-container URLs this workflow uses are its
        # own and are not checked or changed.
        run: |
          pnpm run test:local-postgres-config
          pnpm run check:local-postgres-config

      - name: Compose ports bound to loopback
        # L7-38: the dev stack runs Postgres, Redis, Kafka, MinIO and the rest
        # with development credentials or none. Every published port must bind
        # ${COMPOSE_BIND_ADDRESS:-127.0.0.1} (or 127.0.0.1), never 0.0.0.0.
        # Static; the checker's tests run first.
        run: |
          pnpm run test:compose-ports
          pnpm run check:compose-ports

      - name: Image scope rule
        # The rule that decides which images a pull request builds and scans
        # (L7-35). A wrong rule would quietly skip a changed image.
        run: pnpm run test:container-scope

      - name: Base images pinned by digest
        # L7-45: every service Dockerfile builds on one digest-pinned base and
        # runs no bare `apk upgrade`, so a rebuild of a commit is the same
        # image. Update procedure: docs/runbooks/base-image-update.md.
        run: |
          pnpm run test:dockerfile-pins
          pnpm run check:dockerfile-pins

      - name: Tenant-leading composite indexes
        # L7-44 / ADR-011: every composite index on a tenant table in
        # supplier, notification, document and audit leads with
        # organization_id, or is exempted by name with its reason. Replays the
        # migrations, so partial indexes that exist only in SQL are judged too.
        # Static; the checker's tests run first.
        run: |
          pnpm run test:tenant-index-order
          pnpm run check:tenant-index-order

      - name: Test phase contract
        # identity-service's aggregation stress spec (two 500-write proofs on
        # one hot row) must run exactly once, alone, after every other
        # workspace test task: beside the other services' integration suites
        # on one PostgreSQL it measured their WAL load instead of row
        # serialization (docs/14 § 14.3). Static — reads package.json,
        # turbo.json, identity's jest config and this workflow; no database.
        # The checker's own tests run first so a checker that stopped catching
        # anything fails loudly. The manual commit-rate evidence harness for the
        # same spec (`scripts/aggregation-evidence.mjs`) keeps its parsers,
        # probe validation and stress-constant contract tested here; the
        # measurement itself never runs in CI.
        run: |
          pnpm run test:test-phases
          pnpm run check:test-phases
          pnpm run test:aggregation-evidence-lib

      - name: Grafana dashboard contract
        # The provisioned local `Rasta Audit Evidence` dashboard: stable
        # datasource UID on every query, every alert in the rules file, the
        # alerts' own aggregations, bounded labels only, and the boundary text
        # (docs/13-observability.md § 13.7); and a self-contained local Grafana
        # start — the no-outbound GF_* settings on the Compose service and the
        # inert plugins/alerting provisioning. Static, so no Docker here; the
        # live provisioning and PromQL check on an internal Docker network is
        # `pnpm run verify:grafana-dashboard-live`. Checker tests run first so
        # a checker that stopped catching anything fails loudly. The isolation
        # helper tests run that harness's topology checks (internal network,
        # one network per container, no published port) against a fake Docker
        # only — they are not a live isolation run.
        run: |
          pnpm run test:grafana-dashboard-lib
          pnpm run check:grafana-dashboard
          pnpm run test:grafana-live-isolation-lib

      - name: Image scan coverage gate
        # Runs here, in a job that fires on pull requests, rather than beside
        # the `containers` job it protects — that one only runs on a push to
        # main, so it cannot catch a service being added without an image
        # build until the omission has already merged. Three services have
        # landed unscanned this way (PROJECT_MEMORY § 22).
        run: |
          pnpm run ci:image-matrix
          pnpm run test:image-matrix

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Cache the Temporal time-skipping test server
        # marketplace-service's saga specs run on it, and it is a ~300 MB
        # download. Fetched on every run it made the specs' setup hook exceed
        # its timeout whenever the network was slow (2026-09-25).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Unit tests
        run: pnpm run test:unit
        env:
          TEMPORAL_TEST_SERVER_DIR: ${{ runner.temp }}/temporal-test-server

      - name: Build
        run: pnpm run build

  # ---------------------------------------------------------------------------
  # Security. Every gate here fails the build rather than warning: a warning
  # nobody is forced to read is not a control.
  # ---------------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      # Gitleaks enumerates a pull request's commits through the API to decide
      # what to scan, so on a `pull_request` event it needs to read them. Until
      # the first PR-triggered run this job had only ever run on a push to
      # main, where that call is never made — so the missing permission
      # surfaced as `403 Resource not accessible by integration` and looked
      # exactly like a secret finding. It was not one.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit
        # High and critical fail. The repo holds no production secrets, but it
        # does hold the ledger, so a known-exploitable transitive dependency is
        # not something to merge past.
        run: pnpm audit --audit-level=high

      - name: Static analysis
        # Run the maintained image directly rather than semgrep/semgrep-action@v1.
        # That action is archived and ships semgrep 1.36 (2023), which dies on
        # any ruleset using the MEDIUM severity — "ValueError: invalid rule
        # severity value: MEDIUM" — and then exits 0. It reported success on
        # every run while scanning nothing, which is the one failure mode worse
        # than having no gate at all.
        #
        # No rule is excluded. Three registry-policy rules were, from
        # 2026-08-27 to 2026-09-22 (D-008): they ask pnpm-workspace.yaml for
        # `minimumReleaseAge` and `trustPolicy: no-downgrade` and .npmrc for
        # `min-release-age`, and the lockfile of the day failed both pnpm
        # settings. Those settings are now on, with four reviewed, version-
        # pinned trust exceptions listed beside them — so the policy the rules
        # check for is the policy pnpm actually enforces on every install, in
        # the `pnpm install --frozen-lockfile` step above and in every image
        # build. The per-package evidence is in docs/23 D-008.
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.175.0 \
            semgrep scan --error --metrics=off \
              --config p/typescript \
              --config p/nodejs \
              --config p/owasp-top-ten \
              --config p/secrets

  # ---------------------------------------------------------------------------
  # The portal in a real browser (EXP-002, ADR-059).
  #
  # Its own job because it needs a browser binary and a production build, and
  # neither belongs in `quality`. It runs against `next start`, not the dev
  # server: those are different programs, and a browser job passing against a
  # dev server would pass on code that could not ship.
  #
  # No database, no Keycloak, no gateway. The only page it visits is `/login`,
  # which a visitor without a cookie reaches without any of them — and the
  # three things it asserts are the three only a browser can show: the document
  # is right-to-left, the way in needs no JavaScript, and **nothing is in
  # browser storage**, which is ADR-059's central claim.
  # ---------------------------------------------------------------------------
  web-browser:
    name: Portal in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: 'controller,broker'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
          KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          CLUSTER_ID: 'rasta-e2e-cluster-000001'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Generate run secrets
        # Job-local and masked. In particular, WEB_SESSION_SECRET is never a
        # repository fixture: the browser receives only the cookie it seals.
        run: |
          set -euo pipefail
          keycloak_password="$(openssl rand -hex 24)"
          internal_secret="$(openssl rand -hex 32)"
          web_session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${keycloak_password}"
          echo "::add-mask::${internal_secret}"
          echo "::add-mask::${web_session_secret}"
          echo "KEYCLOAK_ADMIN_PASSWORD=${keycloak_password}" >> "$GITHUB_ENV"
          echo "INTERNAL_TOKEN_SECRET=${internal_secret}" >> "$GITHUB_ENV"
          echo "WEB_SESSION_SECRET=${web_session_secret}" >> "$GITHUB_ENV"

      - name: Start Keycloak with the platform realm
        # Service containers start before checkout, so the checked-in realm
        # import is mounted by an ordinary container after checkout instead.
        run: |
          set -euo pipefail
          docker run -d --name rasta-web-e2e-keycloak \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}" \
            -e KC_HEALTH_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            -v "$PWD/infrastructure/docker/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 \
            start-dev --import-realm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
        run: |
          export PGHOST=localhost PGPORT=5432 POSTGRES_USER=rasta
          bash infrastructure/docker/postgres/00-init-databases.sh

      - name: Create Kafka topics for the live path
        # Fleet consumes the three reference streams and publishes its own
        # outbox stream. Identity also owns its domain and audit-trail streams.
        # Auto-creation stays off, as it is in every deployed environment.
        run: |
          set -euo pipefail
          for topic in \
            rasta.fleet.v1 rasta.fleet.v1.retry rasta.fleet.v1.dlq \
            rasta.asset.v1 rasta.asset.v1.retry rasta.asset.v1.dlq \
            rasta.insurance.v1 rasta.maintenance.v1 \
            rasta.identity.v1 rasta.identity.v1.retry rasta.identity.v1.dlq \
            rasta.audit.trail.v1; do
            docker run --rm --network host apache/kafka:3.9.0 \
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
              --create --if-not-exists --partitions 3 --replication-factor 1 \
              --topic "$topic"
          done

      - run: pnpm run db:generate

      - name: Apply live-path migrations
        run: |
          pnpm --filter @rasta/identity-service run db:migrate
          pnpm --filter @rasta/fleet-service run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public

      - name: Seed the live user, asset reference and assignment
        # operator.one is the same platform user in identity, Keycloak and
        # fleet, and holds AST-SEED-0001 through ASG-SEED-0001.
        run: |
          pnpm --filter @rasta/identity-service run db:seed
          pnpm --filter @rasta/fleet-service run db:seed
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public

      - name: Build portal and live-path services
        # Build the exact deployable artifacts this job starts, plus their
        # workspace dependencies. Services run from dist, never watch mode.
        run: >-
          pnpm exec turbo run build
          --filter=@rasta/web...
          --filter=@rasta/api-gateway...
          --filter=@rasta/identity-service...
          --filter=@rasta/fleet-service...

      - name: Wait for Keycloak to import the realm
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -sfo /dev/null \
              "http://localhost:8080/realms/rasta/.well-known/openid-configuration"; then
              echo "Keycloak realm ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          docker logs rasta-web-e2e-keycloak
          exit 1

      - name: Start identity, fleet and api-gateway
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          REDIS_URL: redis://localhost:6379
          OIDC_ISSUER_URL: http://localhost:8080/realms/rasta
          OIDC_JWKS_URI: http://localhost:8080/realms/rasta/protocol/openid-connect/certs
          OIDC_AUDIENCE: rasta-api
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: rasta
          KEYCLOAK_BACKEND_CLIENT_ID: rasta-backend
          KEYCLOAK_BACKEND_CLIENT_SECRET: backend_dev_secret_change_me
          AUDIT_SERVICE_URL: http://localhost:3115
          IDENTITY_SERVICE_URL: http://localhost:3101
          ORGANIZATION_SERVICE_URL: http://localhost:3102
          ASSET_SERVICE_URL: http://localhost:3103
          FLEET_SERVICE_URL: http://localhost:3104
          MAINTENANCE_SERVICE_URL: http://localhost:3105
          MARKETPLACE_SERVICE_URL: http://localhost:3106
          PROCUREMENT_SERVICE_URL: http://localhost:3107
          SUPPLIER_SERVICE_URL: http://localhost:3108
          INVENTORY_SERVICE_URL: http://localhost:3109
          CONSTRUCTION_SERVICE_URL: http://localhost:3110
          CONTRACT_SERVICE_URL: http://localhost:3111
          ECONOMIC_SERVICE_URL: http://localhost:3112
          NOTIFICATION_SERVICE_URL: http://localhost:3113
          DOCUMENT_SERVICE_URL: http://localhost:3114
          ANALYTICS_SERVICE_URL: http://localhost:3116
        run: |
          set -euo pipefail
          mkdir -p /tmp/rasta-web-e2e-logs

          ( cd services/identity-service && \
            PORT=3101 SERVICE_NAME=identity-service \
            DATABASE_URL=postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/identity.log 2>&1 & )

          ( cd services/fleet-service && \
            PORT=3104 SERVICE_NAME=fleet-service \
            DATABASE_URL=postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public \
            node dist/main.js > /tmp/rasta-web-e2e-logs/fleet.log 2>&1 & )

          ( cd services/api-gateway && \
            PORT=3000 SERVICE_NAME=api-gateway \
            node dist/main.js > /tmp/rasta-web-e2e-logs/gateway.log 2>&1 & )

          for attempt in $(seq 1 60); do
            identity="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3101/health/ready || true)"
            fleet="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3104/health/ready || true)"
            gateway="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3000/v1/usage-records || true)"
            if [ "$identity" = "200" ] && [ "$fleet" = "200" ] && [ "$gateway" = "401" ]; then
              echo "portal live stack ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done

          echo "portal live stack failed (identity=${identity}, fleet=${fleet}, gateway=${gateway})"
          cat /tmp/rasta-web-e2e-logs/identity.log
          cat /tmp/rasta-web-e2e-logs/fleet.log
          cat /tmp/rasta-web-e2e-logs/gateway.log
          exit 1

      # Chromium only. A second engine doubles the job for a page whose
      # critical behavior is server-rendered HTML and a native form post.
      - name: Install the browser
        run: pnpm --filter @rasta/web exec playwright install --with-deps chromium

      - name: Run the browser suite
        run: pnpm --filter @rasta/web exec playwright test
        env:
          WEB_LIVE_STACK_E2E: 'true'
          WEB_E2E_FLEET_URL: http://localhost:3104
          API_GATEWAY_URL: http://localhost:3000
          OIDC_ISSUER_URL: http://localhost:8080/realms/rasta
          OIDC_CLIENT_ID: rasta-web
          WEB_PUBLIC_ORIGIN: http://localhost:3200
          WEB_COOKIE_SECURE: 'false'

      - name: Live-stack logs
        if: failure()
        run: |
          echo '--- identity-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/identity.log || true
          echo '--- fleet-service ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/fleet.log || true
          echo '--- api-gateway ---'
          tail -n 200 /tmp/rasta-web-e2e-logs/gateway.log || true
          echo '--- keycloak ---'
          docker logs --tail 200 rasta-web-e2e-keycloak || true

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Prometheus configuration and alert rules. Its own job so the Docker pull
  # stays out of `quality`. Same image as the `prometheus` service in
  # docker-compose.yml, with the whole directory mounted where that service
  # sees it, so `rule_files` resolves to the same path here as at runtime.
  # ---------------------------------------------------------------------------
  prometheus-rules:
    name: Prometheus config and alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check config and rule syntax
        # Also fails when a file named in `rule_files` does not exist.
        run: |
          docker run --rm -v "$PWD/infrastructure/docker/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Test alert rule behaviour
        # Every file under `tests/`, expanded inside the container rather than
        # named one by one here. A service that adds alert rules now adds its
        # test file and nothing else: naming them individually made this step
        # one more line every such change had to touch, and a test file
        # somebody forgot to name would have read as a tested rule that
        # nothing actually runs.
        run: |
          docker run --rm -v "$PWD/infrastructure/docker/prometheus:/etc/prometheus:ro" \
            --entrypoint sh prom/prometheus:v3.1.0 \
            -c 'promtool test rules /etc/prometheus/tests/*.test.yml'

  # ---------------------------------------------------------------------------
  # Integration and the security tests that need a real database.
  #
  # Service containers rather than Testcontainers here: GitHub provisions them
  # before the job starts, which is faster and avoids docker-in-docker.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # A real broker, because fleet-service's event-path test is the first
      # integration test on the platform that carries a domain write through
      # the outbox to Kafka and back out of a consumer. Without this container
      # that test skips itself, and the stage would be green while never
      # exercising the path it exists to prove.
      #
      # Single-node KRaft, mirroring docker-compose.yml. Topics are created
      # explicitly below: auto-creation stays off, because producing to an
      # unknown topic is a contract violation and must fail loudly (ADR-006).
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: 'controller,broker'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
          KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          CLUSTER_ID: 'rasta-ci-cluster-000001'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          POSTGRES_USER: rasta
        run: |
          # The same script the local stack uses, so CI and a developer
          # laptop provision identically. Divergence here is how "works on my
          # machine" starts.
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - run: pnpm run db:generate

      - name: Create Kafka topics
        # Auto-creation is off by design (ADR-006), so every topic a test
        # touches has to exist first. A missing one then fails the test rather
        # than being silently created with default partitioning — which is the
        # behaviour that makes ordering guarantees meaningless.
        run: |
          set -euo pipefail
          create() {
            docker run --rm --network host apache/kafka:3.9.0 \
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
              --create --if-not-exists --partitions 3 --replication-factor 1 \
              --topic "$1"
          }
          for topic in \
            rasta.identity.v1 rasta.identity.v1.retry rasta.identity.v1.dlq \
            rasta.organization.v1 rasta.organization.v1.retry rasta.organization.v1.dlq \
            rasta.fleet.v1 rasta.fleet.v1.retry rasta.fleet.v1.dlq \
            rasta.asset.v1 rasta.insurance.v1 \
            rasta.maintenance.v1 rasta.maintenance.v1.retry rasta.maintenance.v1.dlq \
            rasta.marketplace.v1 rasta.marketplace.v1.retry rasta.marketplace.v1.dlq \
            rasta.economic.v1 rasta.economic.v1.retry rasta.economic.v1.dlq \
            rasta.supplier.v1 rasta.supplier.v1.retry rasta.supplier.v1.dlq \
            rasta.notification.v1 rasta.notification.v1.retry rasta.notification.v1.dlq \
            rasta.audit.v1 rasta.audit.v1.retry rasta.audit.v1.dlq \
            rasta.audit.trail.v1 \
            rasta.document.v1; do
            create "$topic"
          done

          # Force the group coordinator up before any test needs it.
          #
          # A freshly started broker answers `kafka-topics --list` — which is
          # all its healthcheck asks — while `__consumer_offsets` is still
          # loading. A consumer connecting in that window is told "the group
          # coordinator is not available" and retries in the background, so the
          # test publishes into a topic nobody is reading yet and fails on a
          # timeout that names the wrong thing. That is exactly how the first
          # CI run of this suite failed.
          #
          # Listing consumer groups creates and loads the internal topic, which
          # removes the race rather than making it rarer. The event-flow test
          # also waits for GROUP_JOIN, so neither guard relies on the other.
          docker run --rm --network host apache/kafka:3.9.0 \
            /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --list

      - name: Start MinIO and create the document bucket
        # `docker run` rather than a `services:` container, and not by
        # preference: a service container cannot override the image's command,
        # and `minio/minio` needs `server /data` to start at all. The e2e job
        # below starts Keycloak and Temporal the same way for the same reason.
        #
        # document-service's suites talk to a real bucket. ADR-014 puts the
        # file outside the service entirely — signed URLs, magic-number
        # inspection on bytes read back from storage, an attachment
        # disposition set at the storage boundary — and none of that exists in
        # a mock. A suite that stubbed S3 would prove the mock.
        #
        # The Chainguard images (env above) run as uid 65532 with no shell,
        # hence the tmpfs for /data, `mc -C` for a writable config dir, and
        # MC_HOST_<alias> instead of `mc alias set` inside `sh -c`.
        run: |
          set -euo pipefail
          docker run -d --name rasta-ci-minio --network host \
            --tmpfs /data:uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=rasta_minio_admin \
            -e MINIO_ROOT_PASSWORD=rasta_minio_ci_password \
            "$MINIO_IMAGE" server /data --address ':9000'

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo 'MinIO is live'
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null

          # Private bucket, explicitly. ADR-014 requires it: every read goes
          # through a signed URL, and an anonymous policy here would make the
          # download tests pass for the wrong reason.
          mc() {
            docker run --rm --network host \
              -e MC_HOST_rasta=http://rasta_minio_admin:rasta_minio_ci_password@localhost:9000 \
              "$MC_IMAGE" -C /tmp/.mc "$@"
          }
          mc mb --ignore-existing rasta/rasta-documents
          mc anonymous set none rasta/rasta-documents

      - name: Start ClamAV on a Unix socket
        # The production transport, proven here rather than only described.
        #
        # ADR-049 makes a Unix domain socket on a volume shared inside one Pod
        # the production boundary, because the clamd protocol authenticates
        # nobody and a TCP listener's only protection would be "nothing else is
        # on this network" — the assumption AGENTS.md S-08 forbids.
        # `document-service` refuses `DOCUMENT_CLAMAV_HOST` outright when
        # NODE_ENV is production.
        #
        # A Linux runner can share a socket with a container through a bind
        # mount, so CI exercises the transport a deployment uses. A developer
        # machine on Windows cannot, and falls back to the loopback TCP
        # listener `docker-compose.yml` publishes.
        #
        # Pinned by digest, not by tag: `clamav/clamav:1.5.4` is rebuilt
        # whenever its base or bundled signature set changes, so a tag means a
        # different scanner on a different day with no commit to show for it.
        # Bumping it is a reviewable edit to this line and to the compose file.
        #
        # `--user 100:101` with the entrypoint overridden to `clamd`: the
        # image's own `/init` needs root at start to create /run/clamav and
        # link /var/lock, and running the whole container as root to get that
        # is a poor trade.
        #
        # **freshclam is deliberately not running here.** The image ships the
        # reviewed CVD set inside the pinned digest, so the suites start from a
        # known database and no test downloads ~110 MB from the ClamAV mirrors.
        # That is what makes these runs deterministic and fast; that updating
        # actually works is proven by the `clamav-signatures` job below, which
        # runs freshclam for real and is separate on purpose.
        run: |
          set -euo pipefail
          mkdir -p /tmp/clamav-socket
          # World-writable, because the runner's user and the container's
          # `clamav` (uid 100) are different and CI has no shared group to hang
          # the permission on. In production the socket sits on a Pod-local
          # emptyDir shared by exactly two containers and is mode 0660 with a
          # shared group — see docs/12-deployment-architecture.md.
          chmod 0777 /tmp/clamav-socket

          docker run -d --name rasta-ci-clamav \
            --user 100:101 \
            -e TZ=Etc/UTC \
            -v /tmp/clamav-socket:/run/clamav \
            -v "$PWD/infrastructure/docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            --entrypoint clamd \
            clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591

          # Loading ~110 MB of signatures takes a while, and the socket exists
          # before the engine is ready — so this asks clamd itself, which
          # answers PING only once it can scan.
          for attempt in $(seq 1 60); do
            if docker exec rasta-ci-clamav clamdscan --ping 1 >/dev/null 2>&1; then
              echo "clamd ready after ${attempt} attempt(s)"
              docker exec rasta-ci-clamav clamdscan --version
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo 'clamd did not become ready'
              docker logs --tail 100 rasta-ci-clamav
              exit 1
            fi
            sleep 5
          done

          # Widen the socket so the runner can open it.
          #
          # clamd creates it 0660 owned by uid 100 / gid 101, which is right:
          # in production the two containers share a Pod and a group, and
          # `fsGroup` makes filesystem permissions the access control
          # (ADR-049, docs/deployment). A GitHub runner has no group in common
          # with the container, so the same socket is unopenable to it and
          # every document suite fails with CONNECTION_FAILED — which is what
          # happened on the first run of this job.
          #
          # This widening is CI-only and applied *after* startup, so the
          # production config file keeps its 0660 and nothing about the
          # deployment posture changes. The socket lives on a runner-local tmp
          # path for the length of one job.
          docker exec rasta-ci-clamav chmod 0666 /run/clamav/clamd.sock

          # Prove the runner itself can speak to it, rather than discovering
          # it 60 test failures later. A setup step that only checks the
          # container has checked the wrong side of the boundary.
          node -e '
            const net = require("node:net");
            const s = net.connect({ path: "/tmp/clamav-socket/clamd.sock" });
            s.on("connect", () => s.write("zPING" + String.fromCharCode(0)));
            s.on("data", (d) => {
              const reply = d.toString().split(String.fromCharCode(0)).join("").trim();
              console.log("clamd answered the runner:", reply);
              process.exit(reply === "PONG" ? 0 : 1);
            });
            s.on("error", (e) => { console.error("runner cannot reach clamd:", e.code); process.exit(1); });
            setTimeout(() => { console.error("clamd did not answer the runner"); process.exit(1); }, 15000);
          '

      - name: Apply migrations
        # `notification` and `audit` are registered in the three steps that
        # iterate **every** workspace service — this one, `Integration tests`
        # and `Tenant isolation` — so the branch that adds either service's
        # first migration does not also have to edit this workflow, which is
        # the three-way collision the shared-registration step exists to avoid
        # (ADR-053 plan, Step Zero).
        #
        # `audit` and `notification` are both registered in `Migration
        # reversibility` too, each the moment it had a real migration to
        # reverse and not before — a vacuous entry is worse than none. `audit`
        # arrived there with AUD-001 and `notification` with NTF-001, both
        # under the whole-chain `verify-migration-reversible.mjs <service>`.
        # `identity` is registered there as well, by the two named verifiers
        # that reach the migrations the whole-chain harness cannot — AUD-004's
        # `security_event_outbox` and AUD-003's `audit_correction_command`. All
        # three services' urls are therefore present in that step.
        #
        # `notification` is deliberately absent from two other multi-service
        # steps, because neither would use it:
        #
        #   Outbox B3                passes every url it touches explicitly and
        #                            `notification` owns no outbox today (its
        #                            own arrives with NTF-004).
        #   E2E `Apply migrations`   carries only the services that job
        #                            actually starts (five, since AUD-004
        #                            Phase C1 added identity-service).
        #
        # A url present in a step that cannot use it reads as registration that
        # has happened. For `notification` in those two steps it has not.
        run: pnpm run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_NOTIFICATION: postgresql://rasta_notification:rasta_notification_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Integration tests
        # Two phases (`scripts/run-test-phases.mjs`): every package's
        # integration suites in parallel, then identity-service's aggregation
        # stress spec alone, once the rest have exited. Its 500-write proofs
        # serialize on one hot row; beside the other suites on this one
        # PostgreSQL they measured shared WAL load, not the upsert (docs/14
        # § 14.3). Never `turbo run test:integration` directly — that runs
        # the workspace phase only; `check:test-phases` enforces it.
        run: pnpm run test:integration
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_NOTIFICATION: postgresql://rasta_notification:rasta_notification_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: rasta_minio_admin
          S3_SECRET_KEY: rasta_minio_ci_password
          S3_BUCKET_DOCUMENTS: rasta-documents
          S3_FORCE_PATH_STYLE: 'true'
          # ADR-049. The socket is the production transport; document-service
          # refuses a TCP scanner when NODE_ENV is production, so proving it
          # here is proving what a deployment uses.
          DOCUMENT_CLAMAV_SOCKET_PATH: /tmp/clamav-socket/clamd.sock
          # The pinned image's database is frozen at its digest and freshclam is
          # off here for determinism, so it ages with the pin. Raised with a
          # written reason rather than left to fail every scan on a schedule
          # nobody chose. The production default is 48 hours and is asserted in
          # `env.spec.ts`; the rule itself is proven against a controlled clock
          # in `clamav.scanner.spec.ts`; and that freshclam updates at all is
          # proven by the `clamav-signatures` job.
          DOCUMENT_SCAN_SIGNATURE_MAX_AGE_HOURS: '8760'
          REDIS_URL: redis://localhost:6379

      - name: Economic coverage gate
        # `docs/14` § 14.2 sets 90% branch coverage for this service — the
        # highest band in the table, because an untested branch in a ledger is
        # not a missing feature but an unbalanced journal nobody saw.
        #
        # The threshold has been in `jest.config.js` all along and was never
        # evaluated: no job here ran jest with `--coverage`, and the manual
        # command its own comment named did not exist as a script. A gate that
        # nothing runs is documentation.
        #
        # Both projects in one run. The ledger triggers, the row locks and the
        # settlement rollback exist only in the database, so a unit-only
        # measurement would both understate the number and reward mocking the
        # very things `docs/10` § 10.12 requires to be tested for real.
        run: pnpm --filter @rasta/economic-service run test:coverage
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public

      - name: Marketplace coverage gate
        # `docs/14` § 14.2 puts marketplace-service in the 75% band, and until
        # now nothing measured it: no job in this file ran jest with
        # `--coverage`, so the figure was whatever it happened to be. It had
        # fallen to 40% branches.
        #
        # Both projects in one run, because most of this service's coverage
        # comes from the integration suites — a unit-only run would report a
        # number far below the truth and fail a gate that should pass. In band
        # for the same reason every other integration step here is: the suites
        # share one database.
        run: pnpm --filter @rasta/marketplace-service run test:coverage
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public

      - name: Document coverage gate
        # `docs/14` § 14.2 puts document-service in the 75% band. The number
        # has been in `jest.config.js` since the service was scaffolded and,
        # like economic's and marketplace's before it, nothing evaluated it.
        #
        # Both projects in one run: the download refusal, the magic-number
        # inspection and the signed-URL round trip only exist against a real
        # database and a real bucket, so a unit-only measurement would report a
        # number far below the truth and reward mocking exactly the systems
        # ADR-014 is about.
        run: pnpm --filter @rasta/document-service run test:coverage
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: rasta_minio_admin
          S3_SECRET_KEY: rasta_minio_ci_password
          S3_BUCKET_DOCUMENTS: rasta-documents
          S3_FORCE_PATH_STYLE: 'true'
          # ADR-049. The socket is the production transport; document-service
          # refuses a TCP scanner when NODE_ENV is production, so proving it
          # here is proving what a deployment uses.
          DOCUMENT_CLAMAV_SOCKET_PATH: /tmp/clamav-socket/clamd.sock
          # The pinned image's database is frozen at its digest and freshclam is
          # off here for determinism, so it ages with the pin. Raised with a
          # written reason rather than left to fail every scan on a schedule
          # nobody chose. The production default is 48 hours and is asserted in
          # `env.spec.ts`; the rule itself is proven against a controlled clock
          # in `clamav.scanner.spec.ts`; and that freshclam updates at all is
          # proven by the `clamav-signatures` job.
          DOCUMENT_SCAN_SIGNATURE_MAX_AGE_HOURS: '8760'

      # These are called out separately from the rest of the suite so a failure
      # names itself in the job list. A tenant-isolation failure is a data
      # leak, not a flaky test, and must never be waved through (AGENTS.md §5).
      - name: Supplier coverage gate
        # `docs/14` § 14.2 puts supplier-service in the 75% band. Measured here
        # rather than in the unit job for the same reason as the three gates
        # above: most of this service's coverage comes from the integration
        # suites — the CHECK constraints, the conditional `updateMany` that
        # decides a race, the ADR-050 claim protocol, the B3 allocator and the
        # HTTP surface only exist against a real database, and a unit-only
        # measurement would both report a number far below the truth and reward
        # mocking exactly the systems this service's correctness rests on.
        run: pnpm --filter @rasta/supplier-service run test:coverage
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public

      - name: Audit coverage gate
        # `docs/14` § 14.2 puts audit-service in the 75% band, unchanged by
        # AUD-001. Measured across both projects because the append-only
        # guarantee lives in PostgreSQL privileges and triggers and the
        # projector's behaviour lives against a real broker -- a unit-only
        # number would reward mocking exactly the systems this service's
        # correctness rests on.
        run: pnpm --filter @rasta/audit-service run test:coverage
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          # The append-only suites need the owner connection to disable one
          # control while testing the other, and to clean up rows the runtime
          # role genuinely cannot delete.
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Notification coverage gate
        # `docs/14` § 14.2 puts notification-service in the 75% band, gated from
        # its first real story (ADR-054 plan § 7.8). Measured across both
        # projects because the properties NTF-001 rests on — the semantic
        # dedupe upsert, the deferred foreign key, the fenced claim, the CHECK
        # constraints — live in PostgreSQL, and a unit-only number would reward
        # mocking exactly the system this service's correctness depends on.
        run: pnpm --filter @rasta/notification-service run test:coverage
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_NOTIFICATION: postgresql://rasta_notification:rasta_notification_dev_password@localhost:5432/rasta_notification?schema=public

      - name: Test independence (F-25)
        # Runs every test in maintenance's event-flow suite on its own and
        # requires it to pass alone.
        #
        # The step above this one re-runs single tests by name
        # (`--testNamePattern`), and that is only meaningful if a test selected
        # by name still has the state it asserts against. Five of the eight
        # tests in that file did not: they read rows an earlier `it()` had
        # written, so the file passed whole while `jest -t` failed four of them
        # with `findFirstOrThrow` raising "No record was found for a query" — a
        # message that names the query and says nothing about the missing
        # setup. That is F-25.
        #
        # A prose comment saying "each test must own its state" would not have
        # caught the regression, because the file kept passing. This executes
        # the claim instead: the script runs the file whole, takes the test
        # names from that run rather than from the source, and re-runs each one
        # alone, failing if a name selects zero tests or more than one.
        #
        # Scoped to the one file the defect was found in. Widening it is a
        # deliberate act, not a default, because each name costs a jest start.
        run: pnpm run test:independence
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public

      - name: Tenant isolation and authorization tests
        # Called out separately from the rest of the suite so a failure names
        # itself in the job list. A tenant-isolation failure is a data leak,
        # not a flaky test, and must never be waved through (AGENTS.md § 5).
        #
        # Both projects, because the strongest isolation evidence now lives in
        # the integration suites — they prove the guard against a real database
        # rather than a mock that would assume the behaviour.
        #
        # The integration pattern names the invariants the product document
        # makes mandatory, one word each: `exclusivity` is fleet's one-driver
        # rule, `duplicate` is maintenance's duplicate-report control, and
        # `provenance` is the rule that a cost line must name the work that
        # produced it — the property economic-service audits against.
        #
        # The financial half was added with economic-service, and each word is
        # a row of docs/10 § 10.12's mandatory table rather than a test name:
        # `immutab` is the append-only ledger, `balance` is Σdebit = Σcredit and
        # the wallet/ledger agreement, `concurren` is the hundred parallel
        # withdrawals, `idempot` is one key one effect, `atomic` is a failed
        # settlement leaving nothing behind, `dispute` is the objection that
        # stops all movement, `overspend` is the negative balance that cannot
        # happen, and `cap` is the anti-fraud reward ceiling. A failure in any
        # of them is a financial defect, not a flaky test.
        #
        # Both commands go through the orchestrator, but only
        # `test:integration` has the exclusive phase — the aggregation stress
        # spec needs a real PostgreSQL, and `pnpm test` (so `pnpm verify`) must
        # run without one. So the stress spec is filtered and run alone by the
        # second command, where `concurren` selects its two 500-write proofs
        # (`check:test-phases`). The first command is unit suites only.
        run: |
          pnpm run test -- --testNamePattern="(tenant|isolation|authorization|subtree visibility)"
          pnpm run test:integration -- --testNamePattern="(tenant|isolation|exclusivity|duplicate|provenance|immutab|balance|concurren|idempot|atomic|dispute|overspend|cap)"
        env:
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_NOTIFICATION: postgresql://rasta_notification:rasta_notification_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: rasta_minio_admin
          S3_SECRET_KEY: rasta_minio_ci_password
          S3_BUCKET_DOCUMENTS: rasta-documents
          S3_FORCE_PATH_STYLE: 'true'
          # ADR-049. The socket is the production transport; document-service
          # refuses a TCP scanner when NODE_ENV is production, so proving it
          # here is proving what a deployment uses.
          DOCUMENT_CLAMAV_SOCKET_PATH: /tmp/clamav-socket/clamd.sock
          # The pinned image's database is frozen at its digest and freshclam is
          # off here for determinism, so it ages with the pin. Raised with a
          # written reason rather than left to fail every scan on a schedule
          # nobody chose. The production default is 48 hours and is asserted in
          # `env.spec.ts`; the rule itself is proven against a controlled clock
          # in `clamav.scanner.spec.ts`; and that freshclam updates at all is
          # proven by the `clamav-signatures` job.
          DOCUMENT_SCAN_SIGNATURE_MAX_AGE_HOURS: '8760'

      - name: Migration reversibility
        # AGENTS.md § 7 requires every migration to be reversible, and until
        # this step existed nothing had ever run a down script. up → down → up
        # against a throwaway schema, asserting between each step that every
        # object the migration owns is there, gone, and back — and, for the
        # named verifiers, that every object it does *not* own survived, and
        # that each `down.sql` removed its own `_prisma_migrations` row so the
        # rollback can be rolled forward again. It runs here rather than in its
        # own job because this is where a migrated database already exists.
        run: pnpm run test:migration
        env:
          # All nine, not only the six the whole-chain checks cover. ADR-050
          # adds its claim columns to every service-owned database, and
          # `verify-outbox-claim-migration.mjs --in-place` reverses that one
          # migration on each of them — so a missing url here is a database
          # whose rollback is never exercised, which is the failure this step
          # exists to prevent.
          #
          # supplier is the exception that proves it: it folds ADR-050 and B1
          # into its initial migration, so the by-name verifier cannot reach it
          # and `verify-migration-reversible.mjs supplier` covers it instead —
          # which is why that command is now in `test:migration` rather than
          # only being available to run by hand.
          #
          # identity is the mirror of that exception: its *initial* migration
          # has no down.sql, so the whole-chain verifier cannot reach any of
          # its migrations, and each one it owns needs a verifier addressed to
          # it by name. Two are registered — `security_event_outbox` (AUD-004
          # C1/C2) and `audit_correction_command` (AUD-003's correction half).
          # A third identity migration would need a third entry; nothing here
          # discovers it.
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_NOTIFICATION: postgresql://rasta_notification:rasta_notification_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Outbox stream-sequence protocol (ADR-051 B3)
        # The producer-side allocation protocol: strictly increasing sequences
        # on one stream, two transactions serializing on the counter row, a
        # rollback consuming no number, independent counters per key and per
        # topic, and the negative test that fleet and maintenance share nothing
        # for one asset. It runs here rather than in its own job because it
        # needs real service databases, which this job already has.
        #
        # Every url the suite touches is passed explicitly. Skipping a service
        # because its variable is missing would turn a missing gate into a
        # green one, which is the failure `pnpm test:e2e` used to have.
        run: pnpm run test:outbox-b3
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public

  # ---------------------------------------------------------------------------
  # End-to-end. The economic critical path through the whole stack.
  #
  # AGENTS.md § 7 makes a green E2E suite mandatory for `economic`, `identity`
  # and `construction`, and until this job existed `pnpm test:e2e` exited zero
  # having executed nothing — a gate that passes without running, which is
  # read as evidence.
  #
  # Everything this job needs, it provisions. Nothing is assumed to be on the
  # runner and nothing is borrowed from a developer machine.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end (economic critical path)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: 'controller,broker'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
          KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          CLUSTER_ID: 'rasta-e2e-cluster-000001'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Generate run secrets
        # Minted per run and masked, never stored. The repository holds no real
        # secret and must not start holding one because a test needed a value
        # (AGENTS.md S-01). The Keycloak administrator password is only ever
        # used by the harness to reconcile a realm that predates a fixture user;
        # here the realm is imported fresh, so it is never exercised.
        run: |
          set -euo pipefail
          keycloak_password="$(openssl rand -hex 24)"
          internal_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${keycloak_password}"
          echo "::add-mask::${internal_secret}"
          echo "KEYCLOAK_ADMIN_PASSWORD=${keycloak_password}" >> "$GITHUB_ENV"
          echo "INTERNAL_TOKEN_SECRET=${internal_secret}" >> "$GITHUB_ENV"

      - name: Start Keycloak with the platform realm
        # A `docker run` rather than a service container, because the realm
        # import needs a file from the repository and service containers start
        # before the checkout exists. In-memory storage: this Keycloak lives for
        # one job and imports the realm on every boot.
        run: |
          set -euo pipefail
          docker run -d --name rasta-e2e-keycloak \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}" \
            -e KC_HEALTH_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            -v "$PWD/infrastructure/docker/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.0 \
            start-dev --import-realm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
        run: |
          export PGHOST=localhost PGPORT=5432 POSTGRES_USER=rasta
          bash infrastructure/docker/postgres/00-init-databases.sh

      - name: Create Kafka topics
        # Auto-creation is off by design (ADR-006). The economic topic and its
        # retry/dlq siblings must exist before the service connects, or the
        # outbox relay fails to publish and the correlation scenario times out
        # blaming the wrong component.
        run: |
          set -euo pipefail
          for topic in \
            rasta.economic.v1 rasta.economic.v1.retry rasta.economic.v1.dlq \
            rasta.maintenance.v1 rasta.maintenance.v1.retry rasta.maintenance.v1.dlq \
            rasta.marketplace.v1 rasta.marketplace.v1.retry rasta.marketplace.v1.dlq \
            rasta.fleet.v1 rasta.fleet.v1.retry rasta.fleet.v1.dlq \
            rasta.asset.v1 rasta.insurance.v1 \
            rasta.notification.v1 rasta.notification.v1.retry rasta.notification.v1.dlq \
            rasta.audit.v1 rasta.audit.v1.retry rasta.audit.v1.dlq \
            rasta.audit.trail.v1 \
            rasta.identity.v1 rasta.organization.v1 rasta.supplier.v1 \
            rasta.document.v1; do
            docker run --rm --network host apache/kafka:3.9.0 \
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
              --create --if-not-exists --partitions 3 --replication-factor 1 \
              --topic "$topic"
          done
          docker run --rm --network host apache/kafka:3.9.0 \
            /opt/kafka/bin/kafka-consumer-groups.sh \
            --bootstrap-server localhost:9092 --list

      - run: pnpm run db:generate

      - name: Apply migrations
        run: |
          pnpm --filter @rasta/identity-service run db:migrate
          pnpm --filter @rasta/economic-service run db:migrate
          pnpm --filter @rasta/marketplace-service run db:migrate
          pnpm --filter @rasta/document-service run db:migrate
          pnpm --filter @rasta/audit-service run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          # The audit migration runs as the schema owner, never as the runtime
          # role. ADR-053 § 6: a privilege the runtime role could hand back to
          # itself is not a barrier, so `rasta_audit` owns nothing it writes to.
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Seed identity-service
        # AUD-004 Phase C1's refusal scenario needs `dehyari.admin` to have a
        # real membership row in exactly one organization, so a switch to the
        # other seeded tenant (`ORG-DEH-0002`) is a genuine, unmodified
        # `TENANT_MISMATCH` rather than a fixture built for the test. The
        # Keycloak realm import above already carries the matching
        # `rasta_user_id` attributes; this is the other half of the same seed
        # (`services/identity-service/prisma/seed.ts`).
        run: pnpm --filter @rasta/identity-service run db:seed
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public

      - name: Build
        run: pnpm run build

      - name: Wait for Keycloak to import the realm
        # Waited for here rather than only inside globalSetup, so that a
        # Keycloak that never came up is reported as a Keycloak failure and its
        # log is printed, instead of surfacing as a token error in a test.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -sfo /dev/null \
              "http://localhost:8080/realms/rasta/.well-known/openid-configuration"; then
              echo "Keycloak realm 'rasta' is ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready"
          docker logs rasta-e2e-keycloak
          exit 1

      - name: Start Temporal
        # marketplace-service's order saga needs a real Temporal server. An
        # in-memory `dev-server` rather than the compose stack's Postgres-backed
        # one: this cluster lives for a single job and imports nothing.
        run: |
          set -euo pipefail
          docker run -d --name rasta-e2e-temporal --network host \
            --entrypoint temporal \
            temporalio/admin-tools:1.26.2 \
            server start-dev --ip 0.0.0.0 --port 7233 --headless

          for attempt in $(seq 1 40); do
            if docker exec rasta-e2e-temporal temporal operator cluster health \
                 --address localhost:7233 >/dev/null 2>&1; then
              echo "Temporal ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo 'Temporal did not become ready'
          docker logs rasta-e2e-temporal
          exit 1

      - name: Start MinIO and create the document bucket
        # ADR-014 puts the file outside the platform entirely, so the document
        # scenario's upload is a PUT straight to this bucket carrying no Rasta
        # credential at all. Without it the suite fails at the first upload,
        # which is the step the whole ADR exists to make observable.
        run: |
          set -euo pipefail
          # Same images and uid-65532 adjustments as the integration job.
          docker run -d --name rasta-e2e-minio --network host \
            --tmpfs /data:uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=rasta_minio_admin \
            -e MINIO_ROOT_PASSWORD=rasta_minio_ci_password \
            "$MINIO_IMAGE" server /data --address ':9000'

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null

          mc() {
            docker run --rm --network host \
              -e MC_HOST_rasta=http://rasta_minio_admin:rasta_minio_ci_password@localhost:9000 \
              "$MC_IMAGE" -C /tmp/.mc "$@"
          }
          mc mb --ignore-existing rasta/rasta-documents
          mc anonymous set none rasta/rasta-documents

      - name: Start ClamAV on a Unix socket
        # The document scenario ends with a downloadable file, and only a
        # CLEAN verdict authorizes one (ADR-014, ADR-049). Without a scanner
        # here every document would sit PENDING and the download step would be
        # correctly refused — so this container is what makes the end-to-end
        # path reachable at all, rather than a convenience.
        #
        # Same pinned digest, same non-root entrypoint and same socket
        # transport as the integration job. See that job for why each of those
        # is the way it is.
        run: |
          set -euo pipefail
          mkdir -p /tmp/clamav-socket
          chmod 0777 /tmp/clamav-socket

          docker run -d --name rasta-e2e-clamav \
            --user 100:101 \
            -e TZ=Etc/UTC \
            -v /tmp/clamav-socket:/run/clamav \
            -v "$PWD/infrastructure/docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            --entrypoint clamd \
            clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591

          for attempt in $(seq 1 60); do
            if docker exec rasta-e2e-clamav clamdscan --ping 1 >/dev/null 2>&1; then
              echo "clamd ready after ${attempt} attempt(s)"
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo 'clamd did not become ready'
              docker logs --tail 100 rasta-e2e-clamav
              exit 1
            fi
            sleep 5
          done

          # See the integration job for why this is needed and why it changes
          # nothing about the production posture: the runner shares no group
          # with the container, so the 0660 socket clamd creates is unopenable
          # to the document-service process this job starts.
          docker exec rasta-e2e-clamav chmod 0666 /run/clamav/clamd.sock

          node -e '
            const net = require("node:net");
            const s = net.connect({ path: "/tmp/clamav-socket/clamd.sock" });
            s.on("connect", () => s.write("zPING" + String.fromCharCode(0)));
            s.on("data", (d) => {
              const reply = d.toString().split(String.fromCharCode(0)).join("").trim();
              console.log("clamd answered the runner:", reply);
              process.exit(reply === "PONG" ? 0 : 1);
            });
            s.on("error", (e) => { console.error("runner cannot reach clamd:", e.code); process.exit(1); });
            setTimeout(() => { console.error("clamd did not answer the runner"); process.exit(1); }, 15000);
          '

      - name: Start identity, economic, marketplace, document and audit services and api-gateway
        # From `dist`, the same artefact the container image runs, rather than
        # from a watch-mode dev server. Started here rather than by Playwright's
        # `webServer` because several processes have to come up in order and
        # their logs must survive the job for a failure to be diagnosable.
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          KAFKA_BROKERS: localhost:9092
          REDIS_URL: redis://localhost:6379
          OIDC_ISSUER_URL: http://localhost:8080/realms/rasta
          OIDC_JWKS_URI: http://localhost:8080/realms/rasta/protocol/openid-connect/certs
          OIDC_AUDIENCE: rasta-api
          PORT_IDENTITY: '3101'
          # AUD-004 Phase C2. The refusal scenario waits for a window to close
          # before its aggregated record can exist; ten seconds keeps that wait
          # short without a production bypass. The E2E step reads the same
          # value to align its burst to a fresh window.
          SECURITY_EVENT_AGGREGATION_WINDOW_SECONDS: '10'
          # The realm import above already carries this client with this exact
          # throwaway secret (`infrastructure/docker/keycloak/rasta-realm.json`,
          # `.env.example`) — a per-run secret here would just be a second value
          # to keep in sync with a file that is already checked in.
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: rasta
          KEYCLOAK_BACKEND_CLIENT_ID: rasta-backend
          KEYCLOAK_BACKEND_CLIENT_SECRET: backend_dev_secret_change_me
          PORT_ECONOMIC: '3112'
          PORT_API_GATEWAY: '3000'
          ECONOMIC_PLATFORM_ORGANIZATION_ID: ORG-PLATFORM
          # The reconciliation is a timer that reports; it has nothing to
          # observe in a fresh database and only adds noise to the log.
          ECONOMIC_BALANCE_AUDIT_ENABLED: 'false'
          PORT_MARKETPLACE: '3106'
          TEMPORAL_ADDRESS: localhost:7233
          MARKETPLACE_TEMPORAL_TASK_QUEUE: rasta-order
          MARKETPLACE_TEMPORAL_ENABLED: 'true'
          # Short enough that the E2E suite can observe an overdue order
          # without waiting a week, and long enough that no scenario trips it
          # by accident. Nothing expires into a settlement (ADR-043).
          MARKETPLACE_FULFILLMENT_WINDOW_DAYS: '7'
          MARKETPLACE_RECEIPT_WINDOW_DAYS: '3'
          PORT_DOCUMENT: '3114'
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: rasta_minio_admin
          S3_SECRET_KEY: rasta_minio_ci_password
          S3_BUCKET_DOCUMENTS: rasta-documents
          S3_FORCE_PATH_STYLE: 'true'
          # ADR-049. The socket is the production transport; document-service
          # refuses a TCP scanner when NODE_ENV is production, so proving it
          # here is proving what a deployment uses.
          DOCUMENT_CLAMAV_SOCKET_PATH: /tmp/clamav-socket/clamd.sock
          # The pinned image's database is frozen at its digest and freshclam is
          # off here for determinism, so it ages with the pin. Raised with a
          # written reason rather than left to fail every scan on a schedule
          # nobody chose. The production default is 48 hours and is asserted in
          # `env.spec.ts`; the rule itself is proven against a controlled clock
          # in `clamav.scanner.spec.ts`; and that freshclam updates at all is
          # proven by the `clamav-signatures` job.
          DOCUMENT_SCAN_SIGNATURE_MAX_AGE_HOURS: '8760'
          # api-gateway validates every service URL at boot, including the
          # fourteen services that do not exist yet. They are unreachable and
          # unrouted-to by this suite; the values only have to parse.
          IDENTITY_SERVICE_URL: http://localhost:3101
          ORGANIZATION_SERVICE_URL: http://localhost:3102
          ASSET_SERVICE_URL: http://localhost:3103
          FLEET_SERVICE_URL: http://localhost:3104
          MAINTENANCE_SERVICE_URL: http://localhost:3105
          MARKETPLACE_SERVICE_URL: http://localhost:3106
          PROCUREMENT_SERVICE_URL: http://localhost:3107
          SUPPLIER_SERVICE_URL: http://localhost:3108
          INVENTORY_SERVICE_URL: http://localhost:3109
          CONSTRUCTION_SERVICE_URL: http://localhost:3110
          CONTRACT_SERVICE_URL: http://localhost:3111
          ECONOMIC_SERVICE_URL: http://localhost:3112
          NOTIFICATION_SERVICE_URL: http://localhost:3113
          DOCUMENT_SERVICE_URL: http://localhost:3114
          AUDIT_SERVICE_URL: http://localhost:3115
          ANALYTICS_SERVICE_URL: http://localhost:3116
        run: |
          set -euo pipefail
          mkdir -p /tmp/rasta-logs

          ( cd services/identity-service && \
            PORT=3101 SERVICE_NAME=identity-service \
            DATABASE_URL=postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public \
            node dist/main.js > /tmp/rasta-logs/identity.log 2>&1 & )

          ( cd services/economic-service && \
            PORT=3112 SERVICE_NAME=economic-service \
            node dist/main.js > /tmp/rasta-logs/economic.log 2>&1 & )

          ( cd services/marketplace-service && \
            PORT=3106 SERVICE_NAME=marketplace-service \
            DATABASE_URL=postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public \
            node dist/main.js > /tmp/rasta-logs/marketplace.log 2>&1 & )

          ( cd services/document-service && \
            PORT=3114 SERVICE_NAME=document-service \
            DATABASE_URL=postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public \
            node dist/main.js > /tmp/rasta-logs/document.log 2>&1 & )

          # The runtime role, never the migrator: audit-service must not be able
          # to alter or drop what it writes (ADR-053 § 6).
          ( cd services/audit-service && \
            PORT=3115 SERVICE_NAME=audit-service \
            DATABASE_URL=postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit \
            node dist/main.js > /tmp/rasta-logs/audit.log 2>&1 & )

          ( cd services/api-gateway && \
            PORT=3000 SERVICE_NAME=api-gateway \
            node dist/main.js > /tmp/rasta-logs/gateway.log 2>&1 & )

          for attempt in $(seq 1 60); do
            identity="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3101/health/ready || true)"
            economic="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3112/health/ready || true)"
            marketplace="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3106/health/ready || true)"
            document="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3114/health/ready || true)"
            # 200 only once the domain projector has actually joined its
            # consumer group: a readiness answer that ignored the projector
            # would let the audit scenario start before anything could be
            # recorded, and it would time out blaming the query API.
            audit="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3115/health/ready || true)"
            gateway="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3000/v1/wallets/me || true)"
            if [ "$identity" = "200" ] && [ "$economic" = "200" ] && [ "$marketplace" = "200" ] \
               && [ "$document" = "200" ] && [ "$audit" = "200" ] \
               && [ "$gateway" = "401" ]; then
              echo "stack up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done

          echo "the stack did not come up (identity=${identity}, economic=${economic}, marketplace=${marketplace}, document=${document}, audit=${audit}, gateway=${gateway})"
          cat /tmp/rasta-logs/identity.log
          cat /tmp/rasta-logs/economic.log
          cat /tmp/rasta-logs/marketplace.log
          cat /tmp/rasta-logs/document.log
          cat /tmp/rasta-logs/audit.log
          cat /tmp/rasta-logs/gateway.log
          exit 1

      - name: End-to-end tests
        # Playwright fails a run that matches no tests, and that default is kept
        # deliberately — `--pass-with-no-tests` appears nowhere in this
        # repository.
        run: pnpm run test:e2e
        env:
          E2E_GATEWAY_URL: http://localhost:3000
          E2E_ECONOMIC_URL: http://localhost:3112
          E2E_MARKETPLACE_URL: http://localhost:3106
          E2E_DOCUMENT_URL: http://localhost:3114
          E2E_AUDIT_URL: http://localhost:3115
          E2E_IDENTITY_URL: http://localhost:3101
          SECURITY_EVENT_AGGREGATION_WINDOW_SECONDS: '10'
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: rasta
          KEYCLOAK_WEB_CLIENT_ID: rasta-web
          KEYCLOAK_ADMIN: admin
          KAFKA_BROKERS: localhost:9092

      - name: Service logs
        if: failure()
        run: |
          echo '--- identity-service ---'
          tail -n 200 /tmp/rasta-logs/identity.log || true
          echo '--- economic-service ---'
          tail -n 200 /tmp/rasta-logs/economic.log || true
          echo '--- marketplace-service ---'
          tail -n 200 /tmp/rasta-logs/marketplace.log || true
          echo '--- document-service ---'
          tail -n 200 /tmp/rasta-logs/document.log || true
          echo '--- audit-service ---'
          tail -n 200 /tmp/rasta-logs/audit.log || true
          echo '--- api-gateway ---'
          tail -n 200 /tmp/rasta-logs/gateway.log || true
          echo '--- keycloak ---'
          docker logs --tail 200 rasta-e2e-keycloak || true
          echo '--- minio ---'
          docker logs --tail 100 rasta-e2e-minio || true
          echo '--- clamav ---'
          docker logs --tail 100 rasta-e2e-clamav || true

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The malware scanner's own supply chain (ADR-049).
  #
  # Separate from `integration` on purpose, and the separation is the point.
  # Those suites run the pinned image with freshclam **off**, so they start
  # from the reviewed database inside the digest, download nothing, and produce
  # the same result on every run. That determinism is bought by not exercising
  # signature updating at all — so updating is proven here instead, once, where
  # a failure names itself rather than surfacing as a flaky scan.
  #
  # It also scans the image. `document-service` does not embed ClamAV, so the
  # eight-service `containers` matrix below neither builds nor scans it: that
  # matrix is derived from `services/*/Dockerfile` and ClamAV is an external
  # sidecar dependency, not a ninth Rasta service. Left there, a pinned image
  # we deploy alongside the platform would be the one container nobody looked
  # at.
  # ---------------------------------------------------------------------------
  clamav-signatures:
    name: ClamAV image scan and signature freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pull the pinned image
        # By digest, so this job scans exactly what the integration job, the
        # E2E job and `docker-compose.yml` run. A tag here would scan a
        # different image than the one deployed and report on it confidently.
        run: |
          set -euo pipefail
          docker pull clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591
          docker tag clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591 \
            rasta/clamav-pinned:ci

      - name: Scan the image
        # The same severity and the same `exit-code: 1` as every Rasta image
        # below — the threshold is not relaxed because the image is somebody
        # else's. When it fires, the fix is to bump the pinned digest, which is
        # a reviewable edit rather than a silent drift.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rasta/clamav-pinned:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Record the engine and signature versions the pin carries
        # Evidence rather than decoration: ADR-049 requires the image source
        # and version to be recorded, and a run log that names the engine and
        # the database build is what makes a later "which signatures cleared
        # this document" question answerable.
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh rasta/clamav-pinned:ci -c \
            'clamd --version; ls -l /var/lib/clamav/'

      - name: Verify freshclam can update the database
        # The check the deterministic suites deliberately do not make.
        #
        # A failing updater is silent by nature: scanning keeps working with an
        # old database and keeps answering `OK`, and the only symptom is the
        # signature age climbing until `document-service` stops issuing clean
        # verdicts. So this runs freshclam for real against the mirrors, from
        # the image's own database, and fails if it cannot.
        #
        # `--no-warnings` is not passed and the output is kept: "up to date" is
        # a pass, and so is a downloaded increment. What is not a pass is a
        # non-zero exit.
        run: |
          set -euo pipefail
          docker run --rm \
            -e TZ=Etc/UTC \
            -v "$PWD/infrastructure/docker/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro" \
            --entrypoint freshclam \
            rasta/clamav-pinned:ci 2>&1 | tee /tmp/freshclam.log

          # freshclam exits 0 both when it updated and when nothing was newer,
          # so the log is checked for evidence it actually reached a mirror
          # rather than failing quietly into a success.
          grep -Eq 'is up-to-date|updated \(version' /tmp/freshclam.log

  # ---------------------------------------------------------------------------
  # Container build and image scan. Only on main, because it is the slowest
  # stage and a PR has already been gated by everything above.
  # ---------------------------------------------------------------------------
  container-scope:
    name: Images to build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.scope.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The pull request's base must be present to diff against.
          fetch-depth: 0

      - name: Decide which images this change affects
        id: scope
        # L7-35: images were built and scanned only after merge, so a broken
        # or vulnerable image was found on main. A pull request now builds the
        # images it can affect (scripts/container-scope-lib.mjs explains the
        # rule); a push to main still builds all of them.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            services="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | node scripts/container-scope.mjs)"
          else
            services="$(node scripts/container-scope.mjs --all)"
          fi
          echo "Images to build: ${services}"
          echo "services=${services}" >> "$GITHUB_OUTPUT"

  containers:
    name: Build and scan images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # E2E joins the list: main must stay deployable, and an image built from a
    # commit whose critical financial path was never exercised is not something
    # to publish (AGENTS.md § 6, § 7). The same gates hold on a pull request,
    # which now builds and scans the images it touches before merge (L7-35).
    needs: [container-scope, quality, security, integration, e2e]
    if: needs.container-scope.outputs.services != '[]'

    strategy:
      fail-fast: false
      matrix:
        # Every service with a Dockerfile on a push to main; on a pull request,
        # the ones the change can affect. Derived from the repository rather
        # than listed here: asset-service, fleet-service and document-service
        # were each absent from a hand-kept list for one or more releases, so
        # their images went unbuilt and unscanned (PROJECT_MEMORY § 22).
        service: ${{ fromJSON(needs.container-scope.outputs.services) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          # Tagged with the commit SHA, never a bare `latest`: an image you
          # cannot trace back to a commit is not deployable.
          tags: rasta/${{ matrix.service }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image
        # Tags on this action carry a `v` prefix; the unprefixed `0.28.0` this
        # once pinned does not resolve, so the job died at "Set up job" before
        # running a single step (D-005). Moved to the current release rather
        # than back-pinning: a vulnerability scanner two years behind is a
        # gate in name only.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rasta/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
