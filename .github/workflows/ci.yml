        # The verifier's builders and static checks, plus the cases that need
        # a server: a kept extension passes only exactly as deployed — not at
        # another version, not in another schema (scripts/
        # verify-migration-reversible-lib.test.mjs). Each case runs in its own
        # throwaway database; REQUIRED makes a missing URL an error, not a skip.
        run: pnpm run test:migration-lib
        env:
          # A role that may CREATE DATABASE: identity's migrator. Its runtime role
          # lost CREATEDB with the owner split (D-045).
          MIGRATION_LIB_TEST_DATABASE_URL: postgresql://rasta_identity_migrator:rasta_identity_migrator_dev_password@localhost:5432/rasta_identity
          # A second role, connected to a scratch database while the first one
          # drops it: the case that made `DROP DATABASE … WITH (FORCE)` fail
          # here once (an autovacuum worker, on main cd0c39a). The scratch drop
          # must wait for it, never kill it.
          # It creates a scratch database too, so it needs CREATEDB: organization's
          # migrator, since the owner split took it from the runtime role (D-045).
          MIGRATION_LIB_TEST_FOREIGN_DATABASE_URL: postgresql://rasta_organization_migrator:rasta_organization_migrator_dev_password@localhost:5432/rasta_organization
