  integration-coverage:
    name: Coverage gates (economic, marketplace, document, supplier, audit, notification, organization, procurement, analytics)
    runs-on: ubuntu-latest
    # About 10.5 minutes on main run 38600385830 (setup ~4m, the seven gates
    # 399 s together, economic the longest at 115 s). Each keeps its own 8.
    timeout-minutes: 25
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # notification-service's SMTP suites (`email-delivery`, `mail-channel`)
      # read the messages back through Mailpit's HTTP API. Same image and
      # digest as `docker-compose.yml`. The steps that run them set
      # REQUIRE_MAILPIT=1, so an unreachable Mailpit fails the suite instead of
      # skipping it (`services/notification-service/test/mailpit.ts`).
      mailpit:
        image: axllent/mailpit:v1.22@sha256:f7f7c31de4de59540ad6515a0ca057a77525bca2069b6e747d873ca66c10fe08
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          # A throwaway cluster, bootstrapped as compose bootstraps its own:
          # unset role passwords take the published development defaults,
          # which lib/role-passwords.bash allows only under this flag.
          RASTA_DB_BOOTSTRAP: compose
          POSTGRES_USER: rasta
        run: |
          # The same script the local stack uses, so CI and a developer
          # laptop provision identically. Divergence here is how "works on my
          # machine" starts.
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - run: pnpm run db:generate

      - name: Build the shared packages
        # The suites below resolve @rasta/config, @rasta/nest-common and the
        # other workspace packages to their dist. In the single job, the
        # `Integration tests` step's turbo `^build` produced those before any
        # of these steps ran; here nothing else does. Packages only, as in
        # `migration-guards`: no service is built or started here.
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Start the authenticated Kafka broker
        # RUN-006, ADR-061 § 3: SASL_SSL with one SCRAM principal per service
        # and per-topic ACLs generated from the event contracts, started the
        # way compose starts it (infrastructure/docker/kafka/ci-up.sh), so a
        # service or test that reaches past its declared topics fails here as
        # it would in production. Per-run passwords, masked, stay in two
        # private directories (the admin's apart), each given only to the
        # steps that need it; only KAFKA_SSL and the CA go through GITHUB_ENV.
        # Every platform topic is created (auto-creation stays off, ADR-006)
        # and the group coordinator is loaded before any test joins a group.
        run: bash infrastructure/docker/kafka/ci-up.sh
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          KAFKA_ADMIN_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-admin-secrets

      - name: Pre-pull MinIO and ClamAV (retries transient registry errors)
        run: |
          scripts/ci-pull-image.sh \
            "$MINIO_IMAGE" "$MC_IMAGE" \
            clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6

      - name: Start MinIO and create the document bucket
        # For the document coverage gate. Same images, bucket and private
        # policy as in `integration-suites`; see that job for why.
        run: |
          set -euo pipefail
          docker run -d --name rasta-ci-minio --network host \
            --tmpfs /data:uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=rasta_minio_admin \
            -e MINIO_ROOT_PASSWORD=rasta_minio_ci_password \
            "$MINIO_IMAGE" server /data --address ':9000'

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo 'MinIO is live'
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null

          # Private bucket, explicitly. ADR-014 requires it: every read goes
          # through a signed URL, and an anonymous policy here would make the
          # download tests pass for the wrong reason.
          mc() {
            docker run --rm --network host \
              -e MC_HOST_rasta=http://rasta_minio_admin:rasta_minio_ci_password@localhost:9000 \
              "$MC_IMAGE" -C /tmp/.mc "$@"
          }
          mc mb --ignore-existing rasta/rasta-documents
          mc anonymous set none rasta/rasta-documents

      - name: Start ClamAV on a Unix socket
        # For the document coverage gate, through the production transport as
        # in `integration-suites`; see that job for why each setting is so.
        run: |
          set -euo pipefail
          mkdir -p /tmp/clamav-socket
          # World-writable, because the runner's user and the container's
          # `clamav` (uid 100) are different and CI has no shared group to hang
          # the permission on. In production the socket sits on a Pod-local
          # emptyDir shared by exactly two containers and is mode 0660 with a
          # shared group — see docs/12-deployment-architecture.md.
          chmod 0777 /tmp/clamav-socket

          docker run -d --name rasta-ci-clamav \
            --user 100:101 \
            -e TZ=Etc/UTC \
            -v /tmp/clamav-socket:/run/clamav \
            -v "$PWD/infrastructure/docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            --entrypoint clamd \
            clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6

          # Loading ~110 MB of signatures takes a while, and the socket exists
          # before the engine is ready — so this asks clamd itself, which
          # answers PING only once it can scan.
          for attempt in $(seq 1 60); do
            if docker exec rasta-ci-clamav clamdscan --ping 1 >/dev/null 2>&1; then
              echo "clamd ready after ${attempt} attempt(s)"
              docker exec rasta-ci-clamav clamdscan --version
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo 'clamd did not become ready'
              docker logs --tail 100 rasta-ci-clamav
              exit 1
            fi
            sleep 5
          done

          # Widen the socket so the runner can open it.
          #
          # clamd creates it 0660 owned by uid 100 / gid 101, which is right:
          # in production the two containers share a Pod and a group, and
          # `fsGroup` makes filesystem permissions the access control
          # (ADR-049, docs/deployment). A GitHub runner has no group in common
          # with the container, so the same socket is unopenable to it and
          # every document suite fails with CONNECTION_FAILED — which is what
          # happened on the first run of this job.
          #
          # This widening is CI-only and applied *after* startup, so the
          # production config file keeps its 0660 and nothing about the
          # deployment posture changes. The socket lives on a runner-local tmp
          # path for the length of one job.
          docker exec rasta-ci-clamav chmod 0666 /run/clamav/clamd.sock

          # Prove the runner itself can speak to it, rather than discovering
          # it 60 test failures later. A setup step that only checks the
          # container has checked the wrong side of the boundary.
          node -e '
            const net = require("node:net");
            const s = net.connect({ path: "/tmp/clamav-socket/clamd.sock" });
            s.on("connect", () => s.write("zPING" + String.fromCharCode(0)));
            s.on("data", (d) => {
              const reply = d.toString().split(String.fromCharCode(0)).join("").trim();
              console.log("clamd answered the runner:", reply);
              process.exit(reply === "PONG" ? 0 : 1);
            });
            s.on("error", (e) => { console.error("runner cannot reach clamd:", e.code); process.exit(1); });
            setTimeout(() => { console.error("clamd did not answer the runner"); process.exit(1); }, 15000);
          '

      - name: Apply migrations
        # `integration-suites`' step and environment, unchanged: every
        # service, so each job starts from the same migrated databases the
        # single job gave these steps.
        run: pnpm run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_IDENTITY_MIGRATOR: postgresql://rasta_identity_migrator:rasta_identity_migrator_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ORGANIZATION_MIGRATOR: postgresql://rasta_organization_migrator:rasta_organization_migrator_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_ASSET_MIGRATOR: postgresql://rasta_asset_migrator:rasta_asset_migrator_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_FLEET_MIGRATOR: postgresql://rasta_fleet_migrator:rasta_fleet_migrator_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_MAINTENANCE_MIGRATOR: postgresql://rasta_maintenance_migrator:rasta_maintenance_migrator_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_ECONOMIC_MIGRATOR: postgresql://rasta_economic_migrator:rasta_economic_migrator_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_MARKETPLACE_MIGRATOR: postgresql://rasta_marketplace_migrator:rasta_marketplace_migrator_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_DOCUMENT_MIGRATOR: postgresql://rasta_document_migrator:rasta_document_migrator_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_SUPPLIER_MIGRATOR: postgresql://rasta_supplier_migrator:rasta_supplier_migrator_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_CONSTRUCTION: postgresql://rasta_construction:rasta_construction_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_CONSTRUCTION_MIGRATOR: postgresql://rasta_construction_migrator:rasta_construction_migrator_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_CONTRACT: postgresql://rasta_contract:rasta_contract_dev_password@localhost:5432/rasta_contract?schema=public
          DATABASE_URL_CONTRACT_MIGRATOR: postgresql://rasta_contract_migrator:rasta_contract_migrator_dev_password@localhost:5432/rasta_contract?schema=public
          DATABASE_URL_INVENTORY: postgresql://rasta_inventory:rasta_inventory_dev_password@localhost:5432/rasta_inventory?schema=public
          DATABASE_URL_INVENTORY_MIGRATOR: postgresql://rasta_inventory_migrator:rasta_inventory_migrator_dev_password@localhost:5432/rasta_inventory?schema=public
          DATABASE_URL_ANALYTICS: postgresql://rasta_analytics:rasta_analytics_dev_password@localhost:5432/rasta_analytics?schema=public
          DATABASE_URL_ANALYTICS_MIGRATOR: postgresql://rasta_analytics_migrator:rasta_analytics_migrator_dev_password@localhost:5432/rasta_analytics?schema=public
          DATABASE_URL_PROCUREMENT: postgresql://rasta_procurement:rasta_procurement_dev_password@localhost:5432/rasta_procurement?schema=public
          DATABASE_URL_PROCUREMENT_MIGRATOR: postgresql://rasta_procurement_migrator:rasta_procurement_migrator_dev_password@localhost:5432/rasta_procurement?schema=public
          DATABASE_URL_NOTIFICATION: postgresql://rasta_notification:rasta_notification_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_NOTIFICATION_MIGRATOR: postgresql://rasta_notification_migrator:rasta_notification_migrator_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Economic coverage gate
        # `docs/14` § 14.2 sets 90% branch coverage for this service — the
        # highest band in the table, because an untested branch in a ledger is
        # not a missing feature but an unbalanced journal nobody saw.
        #
        # The threshold has been in `jest.config.js` all along and was never
        # evaluated: no job here ran jest with `--coverage`, and the manual
        # command its own comment named did not exist as a script. A gate that
        # nothing runs is documentation.
        #
        # Both projects in one run. The ledger triggers, the row locks and the
        # settlement rollback exist only in the database, so a unit-only
        # measurement would both understate the number and reward mocking the
        # very things `docs/10` § 10.12 requires to be tested for real.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm --filter @rasta/economic-service run test:coverage
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_ECONOMIC_MIGRATOR: postgresql://rasta_economic_migrator:rasta_economic_migrator_dev_password@localhost:5432/rasta_economic?schema=public

      - name: Marketplace coverage gate
        # `docs/14` § 14.2 puts marketplace-service in the 75% band, and until
        # now nothing measured it: no job in this file ran jest with
        # `--coverage`, so the figure was whatever it happened to be. It had
        # fallen to 40% branches.
        #
        # Both projects in one run, because most of this service's coverage
        # comes from the integration suites — a unit-only run would report a
        # number far below the truth and fail a gate that should pass. In band
        # for the same reason every other integration step here is: the suites
        # share one database.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm --filter @rasta/marketplace-service run test:coverage
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_MARKETPLACE_MIGRATOR: postgresql://rasta_marketplace_migrator:rasta_marketplace_migrator_dev_password@localhost:5432/rasta_marketplace?schema=public

      - name: Document coverage gate
        # `docs/14` § 14.2 puts document-service in the 75% band. The number
        # has been in `jest.config.js` since the service was scaffolded and,
        # like economic's and marketplace's before it, nothing evaluated it.
        #
        # Both projects in one run: the download refusal, the magic-number
        # inspection and the signed-URL round trip only exist against a real
        # database and a real bucket, so a unit-only measurement would report a
        # number far below the truth and reward mocking exactly the systems
        # ADR-014 is about.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm --filter @rasta/document-service run test:coverage
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_DOCUMENT_MIGRATOR: postgresql://rasta_document_migrator:rasta_document_migrator_dev_password@localhost:5432/rasta_document?schema=public
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: rasta_minio_admin
          S3_SECRET_KEY: rasta_minio_ci_password
          S3_BUCKET_DOCUMENTS: rasta-documents
          S3_FORCE_PATH_STYLE: 'true'
          # ADR-049. The socket is the production transport; document-service
          # refuses a TCP scanner when NODE_ENV is production, so proving it
          # here is proving what a deployment uses.
          DOCUMENT_CLAMAV_SOCKET_PATH: /tmp/clamav-socket/clamd.sock
          # The pinned image's database is frozen at its digest and freshclam is
          # off here for determinism, so it ages with the pin. Raised with a
          # written reason rather than left to fail every scan on a schedule
          # nobody chose. The production default is 48 hours and is asserted in
          # `env.spec.ts`; the rule itself is proven against a controlled clock
          # in `clamav.scanner.spec.ts`; and that freshclam updates at all is
          # proven by the `clamav-signatures` job.
          DOCUMENT_SCAN_SIGNATURE_MAX_AGE_HOURS: '8760'

      - name: Supplier coverage gate
        # `docs/14` § 14.2 puts supplier-service in the 75% band. Measured here
        # rather than in the unit job for the same reason as the three gates
        # above: most of this service's coverage comes from the integration
        # suites — the CHECK constraints, the conditional `updateMany` that
        # decides a race, the ADR-050 claim protocol, the B3 allocator and the
        # HTTP surface only exist against a real database, and a unit-only
        # measurement would both report a number far below the truth and reward
        # mocking exactly the systems this service's correctness rests on.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm --filter @rasta/supplier-service run test:coverage
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_SUPPLIER_MIGRATOR: postgresql://rasta_supplier_migrator:rasta_supplier_migrator_dev_password@localhost:5432/rasta_supplier?schema=public

      - name: Audit coverage gate
        # `docs/14` § 14.2 puts audit-service in the 75% band, unchanged by
        # AUD-001. Measured across both projects because the append-only
        # guarantee lives in PostgreSQL privileges and triggers and the
        # projector's behaviour lives against a real broker -- a unit-only
        # number would reward mocking exactly the systems this service's
        # correctness rests on.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm --filter @rasta/audit-service run test:coverage
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          # The append-only suites need the owner connection to disable one
          # control while testing the other, and to clean up rows the runtime
          # role genuinely cannot delete.
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Notification coverage gate
        # `docs/14` § 14.2 puts notification-service in the 75% band, gated from
        # its first real story (ADR-054 plan § 7.8). Measured across both
        # projects because the properties NTF-001 rests on — the semantic
        # dedupe upsert, the deferred foreign key, the fenced claim, the CHECK
        # constraints — live in PostgreSQL, and a unit-only number would reward
        # mocking exactly the system this service's correctness depends on.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm --filter @rasta/notification-service run test:coverage
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          REQUIRE_MAILPIT: '1'
          MAILPIT_API_URL: http://localhost:8025
          NOTIFICATION_SMTP_HOST: localhost
          NOTIFICATION_SMTP_PORT: '1025'
          DATABASE_URL_NOTIFICATION: postgresql://rasta_notification:rasta_notification_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_NOTIFICATION_MIGRATOR: postgresql://rasta_notification_migrator:rasta_notification_migrator_dev_password@localhost:5432/rasta_notification?schema=public

      - name: Organization coverage gate
        # organization-service carried a 70% threshold in `jest.config.js` that
        # nothing evaluated twice over: the config's `collectCoverageFrom`
        # resolved to `src/src/**` under `rootDir: 'src'`, so `--coverage`
        # reported 0% over passing tests, and no job here ran jest with
        # `--coverage` at all. Both are fixed together — a gate that measures
        # nothing, or that nothing runs, is documentation.
        #
        # Both projects in one run, like every gate above: unit alone measures
        # about 52% statements and 45% branches, because the repository, the
        # outbox store and the controller are exercised only by the integration
        # suites against a real PostgreSQL. A unit-only number would fail a gate
        # that the service passes.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm --filter @rasta/organization-service run test:coverage
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ORGANIZATION_MIGRATOR: postgresql://rasta_organization_migrator:rasta_organization_migrator_dev_password@localhost:5432/rasta_organization?schema=public

      - name: Procurement coverage gate
        # `docs/14` § 14.2 puts procurement-service with the other services, in the 75% band
        # (COM-007 PR 1, ADR-070). Both projects: the aggregation's row lock that serialises
        # demands, the partial unique index of one open window, the triggers that keep a demand
        # inside its window and a window's totals its demands', and the tenant guard against
        # real rows exist only against a real database.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm --filter @rasta/procurement-service run test:coverage
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_PROCUREMENT: postgresql://rasta_procurement:rasta_procurement_dev_password@localhost:5432/rasta_procurement?schema=public
          DATABASE_URL_PROCUREMENT_MIGRATOR: postgresql://rasta_procurement_migrator:rasta_procurement_migrator_dev_password@localhost:5432/rasta_procurement?schema=public

      - name: Analytics coverage gate
        # `docs/14` § 14.2 puts analytics-service in the 75% band, set in its `jest.config.js`
        # (ADR-071 PR 1). Both projects: the append-only fact tables, the runtime-role
        # refusals and the shutdown ordering are exercised only by the integration suites
        # against a real PostgreSQL, so a unit-only number would not be the service's.
        timeout-minutes: 8
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm --filter @rasta/analytics-service run test:coverage
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_ANALYTICS: postgresql://rasta_analytics:rasta_analytics_dev_password@localhost:5432/rasta_analytics?schema=public
          DATABASE_URL_ANALYTICS_MIGRATOR: postgresql://rasta_analytics_migrator:rasta_analytics_migrator_dev_password@localhost:5432/rasta_analytics?schema=public

  # The check branch protection and the merge queue require by name. It runs
  # always(), not on the default success(): a job skipped because a job it
  # needs failed reports "skipped", which a required check counts as passing.
  # So this runs whatever happened and fails unless every split job succeeded,
  # whether one failed, was cancelled, timed out or was skipped (when
  # `quality` fails, all four are skipped and so this fails too). `containers`
  # still needs `integration`, and so all four through it.
  integration:
    name: Integration and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - integration-suites
      - integration-security
      - integration-coverage-critical
      - integration-coverage
    if: ${{ always() }}
    steps:
      - name: Every integration job passed
        # Named, not the runner's default (bash -e, no pipefail): the split
        # guard runs this script under exactly the shell set here.
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const names = Object.keys(needs);
            for (const name of names) console.log(name + ": " + needs[name].result);
            const failed = names.filter((name) => needs[name].result !== "success");
            if (names.length === 0 || failed.length > 0) {
              console.error("not passed: " + (failed.join(", ") || "no jobs at all"));
              process.exit(1);
            }
          '

  # ---------------------------------------------------------------------------
  # Migration reversibility and the database-only guards, beside the
  # integration jobs rather than after them (#198), and since task 082 split
  # into parallel jobs, each against a PostgreSQL of its own: the one job had
  # reached 1417 s of reversibility alone against a 28-minute bound on main
  # run 40006639729, and grew with every migration.
  #
  #   migration-reversibility-chain  the whole-chain check, one matrix leg per
  #                                  shard of services (sized by that run's
  #                                  per-service times);
  #   migration-guards               the by-name verifiers and the database
  #                                  guards;
  #   migration-reversibility        the aggregate: the check branch protection
  #                                  and the merge queue require by name.
  #
  # Every step needs only PostgreSQL — no Kafka, MinIO, ClamAV or Redis. Same
  # image, same provisioning script and role split (D-045), same migrator
  # credentials passed through the environment and never on a command line
  # (#191); the commands are exactly the ones the single job ran, and
  # `pnpm run test:migration` still runs all of them in one sequence locally.
  # `scripts/ci-migration-reversibility-lib.mjs` refuses a service with
  # migrations that no shard verifies, a step dropped, and an aggregate that
  # could pass without every job here succeeding.
  # ---------------------------------------------------------------------------
  migration-reversibility-chain:
    name: Migration reversibility, whole chain (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Setup about 2 minutes; the heaviest shard's chain about 6.2 minutes on
    # that run's per-service times. The step has its own, tighter bound.
    timeout-minutes: 20
    needs: quality
    strategy:
      # Every shard reports, so one red service does not hide another.
      fail-fast: false
      matrix:
        # Balanced on main run 40006639729's times (seconds): economic 233,
        # document 58, notification 49, procurement 29 = 369; construction 96,
        # marketplace 81, fleet 75, audit 49, supplier 41, analytics 17 = 359;
        # asset 90, identity 88, contract 65, maintenance 49, organization 44,
        # inventory 32 = 368. A new service goes into the lightest shard; the
        # guard fails until it is in one.
        include:
          - shard: 1/3
            services: economic document notification procurement
          - shard: 2/3
            services: construction marketplace fleet audit supplier analytics
          - shard: 3/3
            services: asset identity contract maintenance organization inventory
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          # A throwaway cluster, bootstrapped as compose bootstraps its own:
          # unset role passwords take the published development defaults,
          # which lib/role-passwords.bash allows only under this flag.
          RASTA_DB_BOOTSTRAP: compose
          POSTGRES_USER: rasta
        run: |
          # The same script the local stack uses, so CI and a developer
          # laptop provision identically. Divergence here is how "works on my
          # machine" starts.
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - name: Apply migrations
        # `integration-suites`' step, unchanged. The whole-chain checks build
        # their own scratch schema or database beside each service's real one;
        # the runtime-privileges check below reads the real, migrated databases,
        # as it did when it ran after every check in one job.
        run: pnpm run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_IDENTITY_MIGRATOR: postgresql://rasta_identity_migrator:rasta_identity_migrator_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ORGANIZATION_MIGRATOR: postgresql://rasta_organization_migrator:rasta_organization_migrator_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_ASSET_MIGRATOR: postgresql://rasta_asset_migrator:rasta_asset_migrator_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_FLEET_MIGRATOR: postgresql://rasta_fleet_migrator:rasta_fleet_migrator_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_MAINTENANCE_MIGRATOR: postgresql://rasta_maintenance_migrator:rasta_maintenance_migrator_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_ECONOMIC_MIGRATOR: postgresql://rasta_economic_migrator:rasta_economic_migrator_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_MARKETPLACE_MIGRATOR: postgresql://rasta_marketplace_migrator:rasta_marketplace_migrator_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_DOCUMENT_MIGRATOR: postgresql://rasta_document_migrator:rasta_document_migrator_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_SUPPLIER_MIGRATOR: postgresql://rasta_supplier_migrator:rasta_supplier_migrator_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_CONSTRUCTION: postgresql://rasta_construction:rasta_construction_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_CONSTRUCTION_MIGRATOR: postgresql://rasta_construction_migrator:rasta_construction_migrator_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_CONTRACT: postgresql://rasta_contract:rasta_contract_dev_password@localhost:5432/rasta_contract?schema=public
          DATABASE_URL_CONTRACT_MIGRATOR: postgresql://rasta_contract_migrator:rasta_contract_migrator_dev_password@localhost:5432/rasta_contract?schema=public
          DATABASE_URL_INVENTORY: postgresql://rasta_inventory:rasta_inventory_dev_password@localhost:5432/rasta_inventory?schema=public
          DATABASE_URL_INVENTORY_MIGRATOR: postgresql://rasta_inventory_migrator:rasta_inventory_migrator_dev_password@localhost:5432/rasta_inventory?schema=public
          DATABASE_URL_ANALYTICS: postgresql://rasta_analytics:rasta_analytics_dev_password@localhost:5432/rasta_analytics?schema=public
          DATABASE_URL_ANALYTICS_MIGRATOR: postgresql://rasta_analytics_migrator:rasta_analytics_migrator_dev_password@localhost:5432/rasta_analytics?schema=public
          DATABASE_URL_PROCUREMENT: postgresql://rasta_procurement:rasta_procurement_dev_password@localhost:5432/rasta_procurement?schema=public
          DATABASE_URL_PROCUREMENT_MIGRATOR: postgresql://rasta_procurement_migrator:rasta_procurement_migrator_dev_password@localhost:5432/rasta_procurement?schema=public
          DATABASE_URL_NOTIFICATION: postgresql://rasta_notification:rasta_notification_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_NOTIFICATION_MIGRATOR: postgresql://rasta_notification_migrator:rasta_notification_migrator_dev_password@localhost:5432/rasta_notification?schema=public
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Migration reversibility, whole chain
        # AGENTS.md § 7 requires every migration to be reversible, and until
        # this check existed nothing had ever run a down script. up → down → up
        # against a throwaway schema, asserting between each step that every
        # object the migration owns is there, gone, and back — and that each
        # `down.sql` removed its own `_prisma_migrations` row so the rollback
        # can be rolled forward again. This leg runs it for its shard's
        # services, one after another, exactly as `test:migration` does.
        #
        # Every service with migrations is covered by the whole-chain check.
        # The five whose initial migration once had no down.sql (identity,
        # organization, asset, fleet, maintenance) were beyond it until the
        # platform-safety pass; each is now verified up → down → up like the
        # rest, and `scripts/verify-migration-reversible-lib.test.mjs` fails if
        # a service with migrations is in no shard above (or in two), or
        # missing from `test:migration`.
        #
        # The whole-chain check proves each down.sql an *exact* inverse: after
        # every down script the schema must match, object for object, the
        # state recorded just before that migration (built by applying each
        # migration.sql in turn), and the ledger must no longer list it. The
        # one documented allowance is marketplace's NOT VALID rollback.
        #
        # organization and asset run in a throwaway database cloned from
        # template1 rather than a schema, because their migrations use ltree
        # and geography unqualified; the service roles hold CREATEDB for this.
        #
        # About twice the heaviest shard's 369 s.
        timeout-minutes: 13
        run: |
          test -n "${MIGRATION_SERVICES}"
          for service in ${MIGRATION_SERVICES}; do
            node scripts/verify-migration-reversible.mjs "${service}"
          done
        env:
          MIGRATION_SERVICES: ${{ matrix.services }}
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_IDENTITY_MIGRATOR: postgresql://rasta_identity_migrator:rasta_identity_migrator_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ORGANIZATION_MIGRATOR: postgresql://rasta_organization_migrator:rasta_organization_migrator_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ASSET: postgresql://rasta_asset:rasta_asset_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_ASSET_MIGRATOR: postgresql://rasta_asset_migrator:rasta_asset_migrator_dev_password@localhost:5432/rasta_asset?schema=public
          DATABASE_URL_FLEET: postgresql://rasta_fleet:rasta_fleet_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_FLEET_MIGRATOR: postgresql://rasta_fleet_migrator:rasta_fleet_migrator_dev_password@localhost:5432/rasta_fleet?schema=public
          DATABASE_URL_MAINTENANCE: postgresql://rasta_maintenance:rasta_maintenance_dev_password@localhost:5432/rasta_maintenance?schema=public
          DATABASE_URL_MAINTENANCE_MIGRATOR: postgresql://rasta_maintenance_migrator:rasta_maintenance_migrator_dev_password@localhost:5432/rasta_maintenance?schema=public
