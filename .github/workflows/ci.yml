          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_ECONOMIC_MIGRATOR: postgresql://rasta_economic_migrator:rasta_economic_migrator_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_MARKETPLACE_MIGRATOR: postgresql://rasta_marketplace_migrator:rasta_marketplace_migrator_dev_password@localhost:5432/rasta_marketplace?schema=public

      - name: Runtime roles own nothing (D-045), after the reversals
        # `integration-suites` runs this check too. It ran there after the steps
        # above, so it also proved that no up → down → up cycle left an object
        # owned by a runtime role; this copy keeps that proof with the cycles.
        # A service's runtime database role must hold DML and nothing more: no
        # ownership of its database, a schema, a table, a function or a type;
        # no CREATE; no TRUNCATE, REFERENCES or TRIGGER; nothing on the
        # migration ledger; no CREATEDB, CREATEROLE, BYPASSRLS or SUPERUSER.
        # Owning a table is what lets SQL running as the service ALTER TABLE
        # … DISABLE TRIGGER and lift an integrity guard. Runs against every
        # service database this job bootstrapped and migrated; every service
        # must be split (audit its own way), so a new one that is not fails.
        run: pnpm run check:db-runtime-privileges
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: rasta
          PGPASSWORD: rasta_ci_password

  # The required check, by name. It runs always(), not on the default
  # success(): a job skipped because a job it needs failed reports "skipped",
  # which a required check counts as passing. So it runs whatever happened and
  # fails unless every leg of the chain matrix and the guards job succeeded —
  # a matrix job's result is "success" only when every leg's is. `containers`
  # needs this job, and so all of them through it.
  migration-reversibility:
    name: Migration reversibility and database guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - migration-reversibility-chain
      - migration-guards
    if: ${{ always() }}
    steps:
      - name: Every migration job passed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const names = Object.keys(needs);
            for (const name of names) console.log(name + ": " + needs[name].result);
            const failed = names.filter((name) => needs[name].result !== "success");
            if (names.length === 0 || failed.length > 0) {
              console.error("not passed: " + (failed.join(", ") || "no jobs at all"));
              process.exit(1);
            }
          '

  # ---------------------------------------------------------------------------
  # Broker authorisation, on a broker of its own.
  #
  # RUN-006's broker tests and the DLQ replay tool's, apart from every other
  # suite: a fresh broker, which nothing but these tests writes, declared
  # throwaway (REPLAY_TEST_DISPOSABLE_BROKER), so the replay test may delete
  # the records retention would — only records it wrote itself, which it
  # checks before deleting any (round 2 on #144). Their allowed writes are
  # marker records on real topics; no other suite runs here to read them.
  # ---------------------------------------------------------------------------
  broker-authorisation:
    name: Broker authorisation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start the authenticated Kafka broker
        # The same bootstrap as the integration job (ci-up.sh): SASL_SSL,
        # every platform topic, the generated development ACLs. It writes no
        # record, so every record on it is the tests' own.
        run: bash infrastructure/docker/kafka/ci-up.sh
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          KAFKA_ADMIN_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-admin-secrets

      - name: Broker authorisation, asked of the broker
        # The DLQ replay tool first, as ops-replay, on real dead letters a
        # real EventConsumer writes (docs/runbooks/replay-dlq.md): dry-run by
        # default, every refusal, a replay consumed from .retry with only the
        # platform headers and its key, never the original topic, and a
        # staleness retention has made unknowable — the admin deletes records
        # from one rasta.fleet.v1 partition, as retention would, once it has
        # checked each one is this run's (first, so no other test has written
        # there). It loads @rasta/contracts and @rasta/nest-common from dist.
        # Then RUN-006: the generated ACLs observed on the live broker — only
        # a topic's owner writes it, a service reads what it subscribes to
        # under its own group namespace, dead-letter and retry topics, refused
        # credentials and PLAINTEXT, no topic creation, and the idempotent
        # producer on WRITE alone. Both refuse to run without the bootstrap's
        # environment rather than skip.
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh admin)"
          eval "${kafka_credentials}"
          pnpm exec turbo run build --filter=@rasta/nest-common
          REPLAY_TEST_DISPOSABLE_BROKER=1 pnpm run test:replay-dlq-broker
          pnpm run test:kafka-acl-broker
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          KAFKA_ADMIN_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-admin-secrets

  # ---------------------------------------------------------------------------
  # End-to-end. The economic critical path through the whole stack.
  #
  # AGENTS.md § 7 makes a green E2E suite mandatory for `economic`, `identity`
  # and `construction`, and until this job existed `pnpm test:e2e` exited zero
  # having executed nothing — a gate that passes without running, which is
  # read as evidence.
  #
  # Everything this job needs, it provisions. Nothing is assumed to be on the
  # runner and nothing is borrowed from a developer machine.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end (economic critical path)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: rasta
          POSTGRES_PASSWORD: rasta_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Generate run secrets
        # Minted per run and masked, never stored. The repository holds no real
        # secret and must not start holding one because a test needed a value
        # (AGENTS.md S-01). The Keycloak administrator password is only ever
        # used by the harness to reconcile a realm that predates a fixture user;
        # here the realm is imported fresh, so it is never exercised.
        run: |
          set -euo pipefail
          keycloak_password="$(openssl rand -hex 24)"
          internal_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${keycloak_password}"
          echo "::add-mask::${internal_secret}"
          echo "KEYCLOAK_ADMIN_PASSWORD=${keycloak_password}" >> "$GITHUB_ENV"
          echo "INTERNAL_TOKEN_SECRET=${internal_secret}" >> "$GITHUB_ENV"

      - name: Pre-pull Keycloak, Temporal, MinIO and ClamAV (retries transient registry errors)
        run: |
          scripts/ci-pull-image.sh \
            quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858 \
            temporalio/admin-tools:1.26.2@sha256:37e2e33dbd7b86a12fa1daecf48f5b42544956ae503a83bd45460587f25591f2 \
            "$MINIO_IMAGE" "$MC_IMAGE" \
            clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6

      - name: Start Keycloak with the platform realm
        # A `docker run` rather than a service container, because the realm
        # import needs a file from the repository and service containers start
        # before the checkout exists. In-memory storage: this Keycloak lives for
        # one job and imports the realm on every boot.
        run: |
          set -euo pipefail
          docker run -d --name rasta-e2e-keycloak \
            -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD}" \
            -e KC_HEALTH_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            -e RASTA_KEYCLOAK_DEV_REALM=allow \
            -v "$PWD/infrastructure/docker/keycloak:/opt/keycloak/data/import:ro" \
            --entrypoint /bin/bash \
            quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858 \
            /opt/keycloak/data/import/dev-realm-gate.sh start-dev --import-realm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          # A throwaway cluster, bootstrapped as compose bootstraps its own:
          # unset role passwords take the published development defaults,
          # which lib/role-passwords.bash allows only under this flag.
          RASTA_DB_BOOTSTRAP: compose
        run: |
          export PGHOST=localhost PGPORT=5432 POSTGRES_USER=rasta
          bash infrastructure/docker/postgres/00-init-databases.sh

      - name: Start the authenticated Kafka broker
        # RUN-006, ADR-061 § 3: SASL_SSL with one SCRAM principal per service
        # and per-topic ACLs generated from the event contracts, started the
        # way compose starts it (infrastructure/docker/kafka/ci-up.sh), so a
        # service or test that reaches past its declared topics fails here as
        # it would in production. Per-run passwords, masked, stay in two
        # private directories (the admin's apart), each given only to the
        # steps that need it; only KAFKA_SSL and the CA go through GITHUB_ENV.
        # Every platform topic is created (auto-creation stays off, ADR-006)
        # and the group coordinator is loaded before any test joins a group.
        run: bash infrastructure/docker/kafka/ci-up.sh
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          KAFKA_ADMIN_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-admin-secrets

      - run: pnpm run db:generate

      - name: Apply migrations
        run: |
          pnpm --filter @rasta/identity-service run db:migrate
          pnpm --filter @rasta/economic-service run db:migrate
          pnpm --filter @rasta/marketplace-service run db:migrate
          pnpm --filter @rasta/document-service run db:migrate
          pnpm --filter @rasta/audit-service run db:migrate
          pnpm --filter @rasta/construction-service run db:migrate
          pnpm --filter @rasta/organization-service run db:migrate
          pnpm --filter @rasta/supplier-service run db:migrate
          pnpm --filter @rasta/contract-service run db:migrate
        env:
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_IDENTITY_MIGRATOR: postgresql://rasta_identity_migrator:rasta_identity_migrator_dev_password@localhost:5432/rasta_identity?schema=public
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_ORGANIZATION_MIGRATOR: postgresql://rasta_organization_migrator:rasta_organization_migrator_dev_password@localhost:5432/rasta_organization?schema=public
          DATABASE_URL_CONSTRUCTION: postgresql://rasta_construction:rasta_construction_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_CONSTRUCTION_MIGRATOR: postgresql://rasta_construction_migrator:rasta_construction_migrator_dev_password@localhost:5432/rasta_construction?schema=public
          DATABASE_URL_ECONOMIC: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_ECONOMIC_MIGRATOR: postgresql://rasta_economic_migrator:rasta_economic_migrator_dev_password@localhost:5432/rasta_economic?schema=public
          DATABASE_URL_MARKETPLACE: postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_MARKETPLACE_MIGRATOR: postgresql://rasta_marketplace_migrator:rasta_marketplace_migrator_dev_password@localhost:5432/rasta_marketplace?schema=public
          DATABASE_URL_DOCUMENT: postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_DOCUMENT_MIGRATOR: postgresql://rasta_document_migrator:rasta_document_migrator_dev_password@localhost:5432/rasta_document?schema=public
          DATABASE_URL_SUPPLIER: postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_SUPPLIER_MIGRATOR: postgresql://rasta_supplier_migrator:rasta_supplier_migrator_dev_password@localhost:5432/rasta_supplier?schema=public
          DATABASE_URL_CONTRACT: postgresql://rasta_contract:rasta_contract_dev_password@localhost:5432/rasta_contract?schema=public
          DATABASE_URL_CONTRACT_MIGRATOR: postgresql://rasta_contract_migrator:rasta_contract_migrator_dev_password@localhost:5432/rasta_contract?schema=public
          # The audit migration runs as the schema owner, never as the runtime
          # role. ADR-053 § 6: a privilege the runtime role could hand back to
          # itself is not a barrier, so `rasta_audit` owns nothing it writes to.
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
          DATABASE_URL_AUDIT_MIGRATOR: postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit

      - name: Record the reward evaluation cutover
        # A freshly migrated economic database has no reward history, so its
        # cutover is now. Without the row the reward consumer fails closed and
        # dead-letters every trigger (ADR-061 § 4.2). Production records it by
        # the runbook instead (docs/runbooks/reward-evaluation-cutover.md).
        #
        # The password goes to psql in its environment, never in the URL: an
        # argument is readable by every local user while the process runs.
        env:
          PGPASSWORD: rasta_economic_dev_password
        run: >-
          psql -v ON_ERROR_STOP=1
          "postgresql://rasta_economic@localhost:5432/rasta_economic"
          -c 'INSERT INTO reward_evaluation_cutover (singleton, cutover_at)
          VALUES (TRUE, CURRENT_TIMESTAMP) ON CONFLICT DO NOTHING'

      - name: Seed identity-service
        # AUD-004 Phase C1's refusal scenario needs `dehyari.admin` to have a
        # real membership row in exactly one organization, so a switch to the
        # other seeded tenant (`ORG-DEH-0002`) is a genuine, unmodified
        # `TENANT_MISMATCH` rather than a fixture built for the test. The
        # Keycloak realm import above already carries the matching
        # `rasta_user_id` attributes; this is the other half of the same seed
        # (`services/identity-service/prisma/seed.ts`).
        # Through turbo so @rasta/config is built before the seed imports it;
        # this step runs before the job's own build (see turbo.json db:seed).
        run: pnpm exec turbo run db:seed --filter=@rasta/identity-service
        env:
          # Demo seeds refuse to run without both (packages/config seed-guard).
          NODE_ENV: test
          RASTA_ALLOW_DEMO_SEED: 'true'
          DATABASE_URL_IDENTITY: postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public

      - name: Seed organization-service
        # Q-70 (7): construction-service asks organization-service whether an
        # organization is within the policy author's union. The seeded tree is
        # used as it is — the scenario writes a union policy for the union's
        # own organization and is refused for a dehyari outside it.
        run: pnpm exec turbo run db:seed --filter=@rasta/organization-service
        env:
          NODE_ENV: test
          RASTA_ALLOW_DEMO_SEED: 'true'
          DATABASE_URL_ORGANIZATION: postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public

      - name: Build
        run: pnpm run build

      - name: Wait for Keycloak to import the realm
        # Waited for here rather than only inside globalSetup, so that a
        # Keycloak that never came up is reported as a Keycloak failure and its
        # log is printed, instead of surfacing as a token error in a test.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -sfo /dev/null \
              "http://localhost:8080/realms/rasta/.well-known/openid-configuration"; then
              echo "Keycloak realm 'rasta' is ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak did not become ready"
          docker logs rasta-e2e-keycloak
          exit 1

      - name: Keycloak projection vs concurrent changes (live Keycloak)
        # identity-service's `keycloak-live` jest project: the real
        # KeycloakAdminClient against this job's Keycloak, with a projection's
        # write held after its read while an administrator changes the account
        # (ADR-060 § 5, docs/23 D-037). Here and not in `integration-*` because
        # this is the job with a Keycloak; it adds seconds, not a container.
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh tests)"
          eval "${kafka_credentials}"
          pnpm --filter @rasta/identity-service run test:keycloak-live
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          # The suite creates, changes and deletes users, so it refuses unless
          # it is opted in here — and only here — NODE_ENV=test, the Keycloak
          # is on loopback, and the realm carries the disposable-stack marker
          # (test/keycloak-live/live-target-guard.ts).
          KEYCLOAK_LIVE_ALLOW_WRITES: 'true'
          NODE_ENV: test
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: rasta
          KEYCLOAK_BACKEND_CLIENT_ID: rasta-backend
          KEYCLOAK_BACKEND_CLIENT_SECRET: backend_dev_secret_change_me
          KEYCLOAK_ADMIN: admin

      - name: Start Temporal
        # marketplace-service's order saga needs a real Temporal server. An
        # in-memory `dev-server` rather than the compose stack's Postgres-backed
        # one: this cluster lives for a single job and imports nothing.
        run: |
          set -euo pipefail
          docker run -d --name rasta-e2e-temporal --network host \
            --entrypoint temporal \
            temporalio/admin-tools:1.26.2@sha256:37e2e33dbd7b86a12fa1daecf48f5b42544956ae503a83bd45460587f25591f2 \
            server start-dev --ip 0.0.0.0 --port 7233 --headless

          for attempt in $(seq 1 40); do
            if docker exec rasta-e2e-temporal temporal operator cluster health \
                 --address localhost:7233 >/dev/null 2>&1; then
              echo "Temporal ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo 'Temporal did not become ready'
          docker logs rasta-e2e-temporal
          exit 1

      - name: Start MinIO and create the document bucket
        # ADR-014 puts the file outside the platform entirely, so the document
        # scenario's upload is a PUT straight to this bucket carrying no Rasta
        # credential at all. Without it the suite fails at the first upload,
        # which is the step the whole ADR exists to make observable.
        run: |
          set -euo pipefail
          # Same images and uid-65532 adjustments as `integration-suites`.
          docker run -d --name rasta-e2e-minio --network host \
            --tmpfs /data:uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=rasta_minio_admin \
            -e MINIO_ROOT_PASSWORD=rasta_minio_ci_password \
            "$MINIO_IMAGE" server /data --address ':9000'

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live >/dev/null

          mc() {
            docker run --rm --network host \
              -e MC_HOST_rasta=http://rasta_minio_admin:rasta_minio_ci_password@localhost:9000 \
              "$MC_IMAGE" -C /tmp/.mc "$@"
          }
          mc mb --ignore-existing rasta/rasta-documents
          mc anonymous set none rasta/rasta-documents

      - name: Start ClamAV on a Unix socket
        # The document scenario ends with a downloadable file, and only a
        # CLEAN verdict authorizes one (ADR-014, ADR-049). Without a scanner
        # here every document would sit PENDING and the download step would be
        # correctly refused — so this container is what makes the end-to-end
        # path reachable at all, rather than a convenience.
        #
        # Same pinned digest, same non-root entrypoint and same socket
        # transport as `integration-suites`. See that job for why each of those
        # is the way it is.
        run: |
          set -euo pipefail
          mkdir -p /tmp/clamav-socket
          chmod 0777 /tmp/clamav-socket

          docker run -d --name rasta-e2e-clamav \
            --user 100:101 \
            -e TZ=Etc/UTC \
            -v /tmp/clamav-socket:/run/clamav \
            -v "$PWD/infrastructure/docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            --entrypoint clamd \
            clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6

          for attempt in $(seq 1 60); do
            if docker exec rasta-e2e-clamav clamdscan --ping 1 >/dev/null 2>&1; then
              echo "clamd ready after ${attempt} attempt(s)"
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo 'clamd did not become ready'
              docker logs --tail 100 rasta-e2e-clamav
              exit 1
            fi
            sleep 5
          done

          # See `integration-suites` for why this is needed and why it changes
          # nothing about the production posture: the runner shares no group
          # with the container, so the 0660 socket clamd creates is unopenable
          # to the document-service process this job starts.
          docker exec rasta-e2e-clamav chmod 0666 /run/clamav/clamd.sock

          node -e '
            const net = require("node:net");
            const s = net.connect({ path: "/tmp/clamav-socket/clamd.sock" });
            s.on("connect", () => s.write("zPING" + String.fromCharCode(0)));
            s.on("data", (d) => {
              const reply = d.toString().split(String.fromCharCode(0)).join("").trim();
              console.log("clamd answered the runner:", reply);
              process.exit(reply === "PONG" ? 0 : 1);
            });
            s.on("error", (e) => { console.error("runner cannot reach clamd:", e.code); process.exit(1); });
            setTimeout(() => { console.error("clamd did not answer the runner"); process.exit(1); }, 15000);
          '

      - name: Start identity, organization, supplier, economic, marketplace, document, audit, construction and contract services and api-gateway
        # From `dist`, the same artefact the container image runs, rather than
        # from a watch-mode dev server. Started here rather than by Playwright's
        # `webServer` because several processes have to come up in order and
        # their logs must survive the job for a failure to be diagnosable.
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          DATABASE_URL: postgresql://rasta_economic:rasta_economic_dev_password@localhost:5432/rasta_economic?schema=public
          KAFKA_BROKERS: localhost:9092
          REDIS_URL: redis://localhost:6379
          OIDC_ISSUER_URL: http://localhost:8080/realms/rasta
          OIDC_JWKS_URI: http://localhost:8080/realms/rasta/protocol/openid-connect/certs
          OIDC_AUDIENCE: rasta-api
          PORT_IDENTITY: '3101'
          # AUD-004 Phase C2. The refusal scenario waits for a window to close
          # before its aggregated record can exist; ten seconds keeps that wait
          # short without a production bypass. The E2E step reads the same
          # value to align its burst to a fresh window.
          SECURITY_EVENT_AGGREGATION_WINDOW_SECONDS: '10'
          # The realm import above already carries this client with this exact
          # throwaway secret (`infrastructure/docker/keycloak/rasta-realm.json`,
          # `.env.example`) — a per-run secret here would just be a second value
          # to keep in sync with a file that is already checked in.
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: rasta
          KEYCLOAK_BACKEND_CLIENT_ID: rasta-backend
          KEYCLOAK_BACKEND_CLIENT_SECRET: backend_dev_secret_change_me
          PORT_ECONOMIC: '3112'
          PORT_API_GATEWAY: '3000'
          ECONOMIC_PLATFORM_ORGANIZATION_ID: ORG-PLATFORM
          # The reconciliation is a timer that reports; it has nothing to
          # observe in a fresh database and only adds noise to the log.
          ECONOMIC_BALANCE_AUDIT_ENABLED: 'false'
          PORT_MARKETPLACE: '3106'
          TEMPORAL_ADDRESS: localhost:7233
          MARKETPLACE_TEMPORAL_TASK_QUEUE: rasta-order
          MARKETPLACE_TEMPORAL_ENABLED: 'true'
          # Short enough that the E2E suite can observe an overdue order
          # without waiting a week, and long enough that no scenario trips it
          # by accident. Nothing expires into a settlement (ADR-043).
          MARKETPLACE_FULFILLMENT_WINDOW_DAYS: '7'
          MARKETPLACE_RECEIPT_WINDOW_DAYS: '3'
          PORT_DOCUMENT: '3114'
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: rasta_minio_admin
          S3_SECRET_KEY: rasta_minio_ci_password
          S3_BUCKET_DOCUMENTS: rasta-documents
          S3_FORCE_PATH_STYLE: 'true'
          # ADR-049. The socket is the production transport; document-service
          # refuses a TCP scanner when NODE_ENV is production, so proving it
          # here is proving what a deployment uses.
          DOCUMENT_CLAMAV_SOCKET_PATH: /tmp/clamav-socket/clamd.sock
          # The pinned image's database is frozen at its digest and freshclam is
          # off here for determinism, so it ages with the pin. Raised with a
          # written reason rather than left to fail every scan on a schedule
          # nobody chose. The production default is 48 hours and is asserted in
          # `env.spec.ts`; the rule itself is proven against a controlled clock
          # in `clamav.scanner.spec.ts`; and that freshclam updates at all is
          # proven by the `clamav-signatures` job.
          DOCUMENT_SCAN_SIGNATURE_MAX_AGE_HOURS: '8760'
          # api-gateway validates every service URL at boot, including the
          # fourteen services that do not exist yet. They are unreachable and
          # unrouted-to by this suite; the values only have to parse.
          IDENTITY_SERVICE_URL: http://localhost:3101
          ORGANIZATION_SERVICE_URL: http://localhost:3102
          ASSET_SERVICE_URL: http://localhost:3103
          FLEET_SERVICE_URL: http://localhost:3104
          MAINTENANCE_SERVICE_URL: http://localhost:3105
          MARKETPLACE_SERVICE_URL: http://localhost:3106
          PROCUREMENT_SERVICE_URL: http://localhost:3107
          SUPPLIER_SERVICE_URL: http://localhost:3108
          INVENTORY_SERVICE_URL: http://localhost:3109
          CONSTRUCTION_SERVICE_URL: http://localhost:3110
          CONTRACT_SERVICE_URL: http://localhost:3111
          ECONOMIC_SERVICE_URL: http://localhost:3112
          NOTIFICATION_SERVICE_URL: http://localhost:3113
          DOCUMENT_SERVICE_URL: http://localhost:3114
          AUDIT_SERVICE_URL: http://localhost:3115
          ANALYTICS_SERVICE_URL: http://localhost:3116
        run: |
          set -euo pipefail
          # kafka-credentials.sh alone reads the secrets directory: kept in a
          # shell variable and out of the environment, so no process launched
          # below (a service, or api-gateway) inherits it.
          kafka_secrets_dir="${KAFKA_SECRETS_DIR}"
          unset KAFKA_SECRETS_DIR
          mkdir -p /tmp/rasta-logs

          # D-045 (Codex on #178): started with its owner's URL, a service is gone
          # before Nest builds a single provider. audit-service: a Kafka event
          # queued for its domain projector is neither consumed nor committed.
          # identity-service: its Keycloak re-projection consumer, which starts
          # in its own onModuleInit, never joins its group. Before any service
          # starts, so neither group has run. The positive controls are the step
          # after this one. scripts/runtime-preflight.e2e.mjs.
          ( audit_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service audit-service)" && \
            asset_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service asset-service)" && \
            eval "${audit_credentials}" && eval "${asset_credentials}" && \
            PORT=3115 SERVICE_NAME=audit-service \
            DATABASE_URL_AUDIT=postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit \
            PREFLIGHT_OWNER_URL=postgresql://rasta_audit_migrator:rasta_audit_migrator_dev_password@localhost:5432/rasta_audit?schema=audit \
            node scripts/runtime-preflight.e2e.mjs refused audit-service )
          ( identity_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service identity-service)" && \
            eval "${identity_credentials}" && \
            PORT=3101 \
            PREFLIGHT_OWNER_URL=postgresql://rasta_identity_migrator:rasta_identity_migrator_dev_password@localhost:5432/rasta_identity?schema=public \
            node scripts/runtime-preflight.e2e.mjs refused identity-service )

          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service identity-service)" && \
            eval "${kafka_credentials}" && \
            cd services/identity-service && \
            PORT=3101 SERVICE_NAME=identity-service \
            DATABASE_URL=postgresql://rasta_identity:rasta_identity_dev_password@localhost:5432/rasta_identity?schema=public \
            node dist/main.js > /tmp/rasta-logs/identity.log 2>&1 & )

          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service economic-service)" && \
            eval "${kafka_credentials}" && \
            cd services/economic-service && \
            PORT=3112 SERVICE_NAME=economic-service \
            node dist/main.js > /tmp/rasta-logs/economic.log 2>&1 & )

          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service marketplace-service)" && \
            eval "${kafka_credentials}" && \
            cd services/marketplace-service && \
            PORT=3106 SERVICE_NAME=marketplace-service \
            DATABASE_URL=postgresql://rasta_marketplace:rasta_marketplace_dev_password@localhost:5432/rasta_marketplace?schema=public \
            node dist/main.js > /tmp/rasta-logs/marketplace.log 2>&1 & )

          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service document-service)" && \
            eval "${kafka_credentials}" && \
            cd services/document-service && \
            PORT=3114 SERVICE_NAME=document-service \
            DATABASE_URL=postgresql://rasta_document:rasta_document_dev_password@localhost:5432/rasta_document?schema=public \
            node dist/main.js > /tmp/rasta-logs/document.log 2>&1 & )

          # The runtime role, never the migrator: audit-service must not be able
          # to alter or drop what it writes (ADR-053 § 6).
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service audit-service)" && \
            eval "${kafka_credentials}" && \
            cd services/audit-service && \
            PORT=3115 SERVICE_NAME=audit-service \
            DATABASE_URL_AUDIT=postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit \
            node dist/main.js > /tmp/rasta-logs/audit.log 2>&1 & )

          # Q-70 (7): the hierarchy construction-service confirms a union's
          # policy against. Only construction-service's service token is
          # admitted, on GET /v1/organizations/:id alone.
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service organization-service)" && \
            eval "${kafka_credentials}" && \
            cd services/organization-service && \
            PORT=3102 SERVICE_NAME=organization-service \
            DATABASE_URL=postgresql://rasta_organization:rasta_organization_dev_password@localhost:5432/rasta_organization?schema=public \
            node dist/main.js > /tmp/rasta-logs/organization.log 2>&1 & )

          # CON-002 PR 12: the contractor side of a tender. A contractor may bid
          # only while supplier-service says, at that moment, that it is
          # qualified and not suspended (BIDDER_NOT_ELIGIBLE otherwise), and an
          # award asks it again for the winner's standing — so the tender
          # scenario needs the real service, migrated above by its owner role and
          # run here as its runtime role. Started before construction-service,
          # which loads its standing read model from supplier-service's snapshot
          # (and retries until it can).
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service supplier-service)" && \
            eval "${kafka_credentials}" && \
            cd services/supplier-service && \
            PORT=3108 SERVICE_NAME=supplier-service \
            DATABASE_URL=postgresql://rasta_supplier:rasta_supplier_dev_password@localhost:5432/rasta_supplier?schema=public \
            node dist/main.js > /tmp/rasta-logs/supplier.log 2>&1 & )

          # CON-001: its project scenarios, and the audit record they produce.
          # No widened roles: the union writes, the platform approves (Q-70 (7)).
          # CON-002: a tender is published only with a key-encryption key to wrap
          # its private key (ADR-066 § 2); without one publishing is 503 and
          # nothing is published. Minted for this run, masked, and handed to this
          # one process alone — no other service holds it, as in a deployment,
          # where it comes from the secret store.
          tender_kek="$(openssl rand -base64 32)"
          echo "::add-mask::${tender_kek}"
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service construction-service)" && \
            eval "${kafka_credentials}" && \
            cd services/construction-service && \
            PORT=3110 SERVICE_NAME=construction-service \
            DATABASE_URL=postgresql://rasta_construction:rasta_construction_dev_password@localhost:5432/rasta_construction?schema=public \
            CONSTRUCTION_TENDER_KEKS="e2e-run:${tender_kek}" \
            CONSTRUCTION_TENDER_KEK_CURRENT=e2e-run \
            node dist/main.js > /tmp/rasta-logs/construction.log 2>&1 & )
          unset tender_kek

          # CON-003: a draft contract appears when construction-service publishes
          # TENDER_AWARDED; the service reads the award back from construction-service
          # and confirms a union-written signing policy with organization-service, each
          # with a service token it signs itself. No setting here widens a role: who
          # signs for the employer is a policy the scenario writes, not configuration.
          ( kafka_credentials="$(KAFKA_SECRETS_DIR="${kafka_secrets_dir}" bash infrastructure/docker/kafka/kafka-credentials.sh service contract-service)" && \
            eval "${kafka_credentials}" && \
            cd services/contract-service && \
            PORT=3111 SERVICE_NAME=contract-service \
            DATABASE_URL=postgresql://rasta_contract:rasta_contract_dev_password@localhost:5432/rasta_contract?schema=public \
            node dist/main.js > /tmp/rasta-logs/contract.log 2>&1 & )

          ( cd services/api-gateway && \
            PORT=3000 SERVICE_NAME=api-gateway \
            node dist/main.js > /tmp/rasta-logs/gateway.log 2>&1 & )

          for attempt in $(seq 1 60); do
            identity="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3101/health/ready || true)"
            economic="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3112/health/ready || true)"
            marketplace="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3106/health/ready || true)"
            document="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3114/health/ready || true)"
            # 200 only once the domain projector has actually joined its
            # consumer group: a readiness answer that ignored the projector
            # would let the audit scenario start before anything could be
            # recorded, and it would time out blaming the query API.
            audit="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3115/health/ready || true)"
            construction="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3110/health/ready || true)"
            organization="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3102/health/ready || true)"
            supplier="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3108/health/ready || true)"
            contract="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3111/health/ready || true)"
            gateway="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3000/v1/wallets/me || true)"
            if [ "$identity" = "200" ] && [ "$economic" = "200" ] && [ "$marketplace" = "200" ] \
               && [ "$document" = "200" ] && [ "$audit" = "200" ] \
               && [ "$construction" = "200" ] && [ "$organization" = "200" ] \
               && [ "$supplier" = "200" ] && [ "$contract" = "200" ] && [ "$gateway" = "401" ]; then
              echo "stack up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done

          echo "the stack did not come up (identity=${identity}, economic=${economic}, marketplace=${marketplace}, document=${document}, audit=${audit}, construction=${construction}, organization=${organization}, supplier=${supplier}, contract=${contract}, gateway=${gateway})"
          cat /tmp/rasta-logs/identity.log
          cat /tmp/rasta-logs/economic.log
          cat /tmp/rasta-logs/marketplace.log
          cat /tmp/rasta-logs/document.log
          cat /tmp/rasta-logs/audit.log
          cat /tmp/rasta-logs/construction.log
          cat /tmp/rasta-logs/organization.log
          cat /tmp/rasta-logs/supplier.log
          cat /tmp/rasta-logs/contract.log
          cat /tmp/rasta-logs/gateway.log
          exit 1

      - name: What the owner-URL starts left alone happens through the runtime role
        # The positive controls for the refusals above (D-045, Codex on #178):
        # without them, an event that was never deliverable would pass as "not
        # consumed", and a consumer that never runs as "never joined". Now
        # audit-service runs as rasta_audit, the same event must become an audit
        # row and the projector's offset must move; now identity-service runs as
        # rasta_identity, its re-projection group must form.
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          NODE_ENV: test
          KAFKA_BROKERS: localhost:9092
          DATABASE_URL_AUDIT: postgresql://rasta_audit:rasta_audit_dev_password@localhost:5432/rasta_audit?schema=audit
        run: |
          set -euo pipefail
          audit_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh service audit-service)"
          identity_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh service identity-service)"
          unset KAFKA_SECRETS_DIR
          ( eval "${audit_credentials}" && node scripts/runtime-preflight.e2e.mjs consumed audit-service )
          ( eval "${identity_credentials}" && node scripts/runtime-preflight.e2e.mjs consumed identity-service )

      - name: End-to-end tests
        # Playwright fails a run that matches no tests, and that default is kept
        # deliberately — `--pass-with-no-tests` appears nowhere in this
        # repository.
        run: |
          kafka_credentials="$(bash infrastructure/docker/kafka/kafka-credentials.sh observer)"
          eval "${kafka_credentials}"
          pnpm run test:e2e
        env:
          KAFKA_SECRETS_DIR: ${{ runner.temp }}/rasta-kafka-secrets
          # The suite refuses to start without both, and refuses any endpoint
          # off loopback (tests/e2e/src/target-guard.ts).
          NODE_ENV: test
          E2E_ALLOW_WRITES: 'true'
          E2E_GATEWAY_URL: http://localhost:3000
          E2E_ECONOMIC_URL: http://localhost:3112
          E2E_MARKETPLACE_URL: http://localhost:3106
          E2E_DOCUMENT_URL: http://localhost:3114
          E2E_AUDIT_URL: http://localhost:3115
          E2E_IDENTITY_URL: http://localhost:3101
          E2E_CONSTRUCTION_URL: http://localhost:3110
          E2E_ORGANIZATION_URL: http://localhost:3102
          E2E_SUPPLIER_URL: http://localhost:3108
          E2E_CONTRACT_URL: http://localhost:3111
          SECURITY_EVENT_AGGREGATION_WINDOW_SECONDS: '10'
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: rasta
          KEYCLOAK_WEB_CLIENT_ID: rasta-web
          KEYCLOAK_ADMIN: admin
          KAFKA_BROKERS: localhost:9092

      - name: Service logs
        if: failure()
        run: |
          echo '--- identity-service ---'
          tail -n 200 /tmp/rasta-logs/identity.log || true
          echo '--- economic-service ---'
          tail -n 200 /tmp/rasta-logs/economic.log || true
          echo '--- marketplace-service ---'
          tail -n 200 /tmp/rasta-logs/marketplace.log || true
          echo '--- document-service ---'
          tail -n 200 /tmp/rasta-logs/document.log || true
          echo '--- audit-service ---'
          tail -n 200 /tmp/rasta-logs/audit.log || true
          echo '--- construction-service ---'
          tail -n 200 /tmp/rasta-logs/construction.log || true
          echo '--- organization-service ---'
          tail -n 200 /tmp/rasta-logs/organization.log || true
          echo '--- supplier-service ---'
          tail -n 200 /tmp/rasta-logs/supplier.log || true
          echo '--- contract-service ---'
          tail -n 200 /tmp/rasta-logs/contract.log || true
          echo '--- api-gateway ---'
          tail -n 200 /tmp/rasta-logs/gateway.log || true
          echo '--- keycloak ---'
          docker logs --tail 200 rasta-e2e-keycloak || true
          echo '--- minio ---'
          docker logs --tail 100 rasta-e2e-minio || true
          echo '--- clamav ---'
          docker logs --tail 100 rasta-e2e-clamav || true

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The malware scanner's own supply chain (ADR-049).
  #
  # Separate from `integration` on purpose, and the separation is the point.
  # Those suites run the pinned image with freshclam **off**, so they start
  # from the reviewed database inside the digest, download nothing, and produce
  # the same result on every run. That determinism is bought by not exercising
  # signature updating at all — so updating is proven here instead, once, where
  # a failure names itself rather than surfacing as a flaky scan.
  #
  # It also scans the image. `document-service` does not embed ClamAV, so the
  # eight-service `containers` matrix below neither builds nor scans it: that
  # matrix is derived from `services/*/Dockerfile` and ClamAV is an external
  # sidecar dependency, not a ninth Rasta service. Left there, a pinned image
  # we deploy alongside the platform would be the one container nobody looked
  # at.
  # ---------------------------------------------------------------------------
  clamav-signatures:
    name: ClamAV image scan and signature freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pull the pinned image
        # By digest, so this job scans exactly what the integration job, the
        # E2E job and `docker-compose.yml` run. A tag here would scan a
        # different image than the one deployed and report on it confidently.
        # The pull is the retrying helper's: an explicit `docker pull` contacts
        # the registry even when the image is already local.
        run: |
          set -euo pipefail
          scripts/ci-pull-image.sh \
            clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
          docker tag clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6 \
            rasta/clamav-pinned:ci

      - name: Scan the image
        # The same severity and the same `exit-code: 1` as every Rasta image
        # below — the threshold is not relaxed because the image is somebody
        # else's. When it fires, the fix is to bump the pinned digest, which is
        # a reviewable edit rather than a silent drift. Like that gate, it
        # rejects fixable HIGH/CRITICAL only (`ignore-unfixed`).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rasta/clamav-pinned:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Record the engine and signature versions the pin carries
        # Evidence rather than decoration: ADR-049 requires the image source
        # and version to be recorded, and a run log that names the engine and
        # the database build is what makes a later "which signatures cleared
        # this document" question answerable.
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh rasta/clamav-pinned:ci -c \
            'clamd --version; ls -l /var/lib/clamav/'

      - name: Verify freshclam can update the database
        # The check the deterministic suites deliberately do not make.
        #
        # A failing updater is silent by nature: scanning keeps working with an
        # old database and keeps answering `OK`, and the only symptom is the
        # signature age climbing until `document-service` stops issuing clean
        # verdicts. So this runs freshclam for real against the mirrors, from
        # the image's own database, and fails if it cannot.
        #
        # `--no-warnings` is not passed and the output is kept: "up to date" is
        # a pass, and so is a downloaded increment. What is not a pass is a
        # non-zero exit.
        run: |
          set -euo pipefail
          docker run --rm \
            -e TZ=Etc/UTC \
            -v "$PWD/infrastructure/docker/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro" \
            --entrypoint freshclam \
            rasta/clamav-pinned:ci 2>&1 | tee /tmp/freshclam.log

          # freshclam exits 0 both when it updated and when nothing was newer,
          # so the log is checked for evidence it actually reached a mirror
          # rather than failing quietly into a success.
          grep -Eq 'is up-to-date|updated \(version' /tmp/freshclam.log

  # ---------------------------------------------------------------------------
  # Container build and image scan. Only on main, because it is the slowest
  # stage and a PR has already been gated by everything above.
  # ---------------------------------------------------------------------------
  container-scope:
    name: Images to build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.scope.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The pull request's base must be present to diff against.
          fetch-depth: 0

      - name: Decide which images this change affects
        id: scope
        # L7-35: images were built and scanned only after merge, so a broken
        # or vulnerable image was found on main. A pull request now builds the
        # images it can affect (scripts/container-scope-lib.mjs explains the
        # rule); a push to main still builds all of them.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            services="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | node scripts/container-scope.mjs)"
          else
            services="$(node scripts/container-scope.mjs --all)"
          fi
          echo "Images to build: ${services}"
          echo "services=${services}" >> "$GITHUB_OUTPUT"

  containers:
    name: Build and scan images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # E2E joins the list: main must stay deployable, and an image built from a
    # commit whose critical financial path was never exercised is not something
    # to publish (AGENTS.md § 6, § 7). The same gates hold on a pull request,
    # which now builds and scans the images it touches before merge (L7-35).
    needs: [container-scope, quality, security, integration, migration-reversibility, e2e]
    if: needs.container-scope.outputs.services != '[]'

    strategy:
      fail-fast: false
      matrix:
        # Every service with a Dockerfile on a push to main; on a pull request,
        # the ones the change can affect. Derived from the repository rather
        # than listed here: asset-service, fleet-service and document-service
        # were each absent from a hand-kept list for one or more releases, so
        # their images went unbuilt and unscanned (PROJECT_MEMORY § 22).
        service: ${{ fromJSON(needs.container-scope.outputs.services) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          # Tagged with the commit SHA, never a bare `latest`: an image you
          # cannot trace back to a commit is not deployable.
          tags: rasta/${{ matrix.service }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image
        # Tags on this action carry a `v` prefix; the unprefixed `0.28.0` this
        # once pinned does not resolve, so the job died at "Set up job" before
        # running a single step (D-005). Moved to the current release rather
        # than back-pinning: a vulnerability scanner two years behind is a
        # gate in name only.
        #
        # What this gate claims, exactly: it rejects **fixable** HIGH and
        # CRITICAL findings. `ignore-unfixed: true` passes a HIGH/CRITICAL that
        # has no fixed version anywhere yet — deliberately, since failing on it
        # would turn every PR red over a CVE nobody can act on. Such findings
        # are not tracked by this job; an expiring, reviewed allowlist (a
        # .trivyignore entry per CVE with an owner and an expiry date, and the
        # gate run without ignore-unfixed) is the recorded follow-up (L7-35
        # review).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rasta/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
