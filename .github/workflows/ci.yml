          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Provision databases, roles and extensions
        env:
          PGPASSWORD: rasta_ci_password
          # A throwaway cluster, bootstrapped as compose bootstraps its own:
          # unset role passwords take the published development defaults,
          # which lib/role-passwords.bash allows only under this flag.
          RASTA_DB_BOOTSTRAP: compose
          POSTGRES_USER: rasta
        run: |
          # The same script the local stack uses, so CI and a developer
          # laptop provision identically. Divergence here is how "works on my
          # machine" starts.
          export PGHOST=localhost PGPORT=5432
          psql -U rasta -d postgres -c "SELECT 1" >/dev/null
          bash infrastructure/docker/postgres/00-init-databases.sh

      - run: pnpm run db:generate

      - name: Build the shared packages
        # The B2 vacuum test loads packages/nest-common's dist, and the seed
        # guard runs each seed against @rasta/config and @rasta/nest-common —
        # which resolve to their dist. In `integration-suites` the suites'
        # `^build` produces those first; here nothing else does. Packages
        # only: no service is built or started in this job.
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Apply migrations
        # `integration-suites`' step, unchanged, and why it is needed here: the
        # in-place outbox-claim verifier and the seed guard work on each
        # service's real, migrated database. So it must come first, and the
        # in-place verifier runs before the seed guard and the privileges
        # check, as it did in the single job: both read the database it has
        # just reversed and rolled forward again.
