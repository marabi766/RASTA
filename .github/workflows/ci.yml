      - name: Inventory coverage gate
        # `docs/14` § 14.2: inventory-service is the concurrency core of stock (ADR-056 § 3),
        # so it is in the 85% band with construction and contract. Both projects: the row locks
        # that serialise concurrent reservations, the CHECKs that refuse an oversell, the
        # triggers that keep the ledger append-only and every balance equal to its movements,
        # the tenant guard against real rows and the outbox coupling exist only against a
        # real database.
        timeout-minutes: 8
        run: |
