# =============================================================================
# Rasta — local development infrastructure
#
#   docker compose up -d                           core stack (default)
#   docker compose --profile search up -d          + OpenSearch
#   docker compose --profile observability up -d   + OTel / Prometheus / Grafana
#   docker compose --profile tools up -d           + Kafka UI, Temporal UI, Mailpit
#   docker compose --profile all up -d             everything
#
# Every credential below is a throwaway development value (see .env.example).
# =============================================================================

name: rasta

x-restart: &restart
  restart: unless-stopped

services:
  # ----------------------------------------------------------------- database
  postgres:
    <<: *restart
    image: postgis/postgis:16-3.4
    container_name: rasta-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-rasta}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-rasta_dev_password}
      POSTGRES_DB: postgres
      POSTGRES_SERVICE_PASSWORD: ${POSTGRES_SERVICE_PASSWORD:-rasta_service_dev_password}
      LANG: C.UTF-8
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_SUPERUSER:-rasta} -d postgres']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # -------------------------------------------------------------------- cache
  redis:
    <<: *restart
    image: redis:7.4-alpine
    container_name: rasta-redis
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------- event backbone
  kafka:
    <<: *restart
    # The official Apache image. We started on bitnami/kafka and it stopped
    # resolving when Bitnami reorganised their catalogue — a vendor repackage
    # is one publishing decision away from breaking every clone of this repo.
    image: apache/kafka:3.9.0
    container_name: rasta-kafka
    environment:
      # KRaft, single node (controller + broker). Production runs a 3-node
      # quorum — see docs/deployment/README.md.
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: 'controller,broker'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9094,CONTROLLER://:9093,EXTERNAL://:9092'
      # The external advertised address must match the *host* port, because a
      # client connecting from the host is redirected to whatever this says.
      # It is configurable for the same reason POSTGRES_PORT is: a Windows
      # machine can have 9092 inside a reserved exclusion range
      # (`netsh interface ipv4 show excludedportrange protocol=tcp`), and
      # Docker then refuses to publish it at all. Defaults to 9092 so CI and
      # every other machine are unaffected.
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9094,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      # An unknown topic is a contract violation, not a typo to absorb (ADR-006).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: '168'
      CLUSTER_ID: 'rasta-local-cluster-000001'
    ports:
      - '${KAFKA_HOST_PORT:-9092}:9092'
    # Deliberately no named volume. The container runs as uid 1000, and a named
    # volume mounts root-owned, so the broker cannot write its log dir. Local
    # Kafka data is disposable anyway — kafka-init recreates every topic on each
    # `up`, and the outbox means nothing is lost when the log is (ADR-021).
    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list || exit 1'
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  # Creates the platform topics once, then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: rasta-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/docker/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ['/bin/bash', '/create-topics.sh']
    restart: 'no'

  # ----------------------------------------------------------------- identity
  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.0
    container_name: rasta-keycloak
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_SUPERUSER:-rasta}
      KC_DB_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-rasta_dev_password}
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
    ports:
      - '8080:8080'
      - '9003:9000'
    volumes:
      - ./infrastructure/docker/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The Keycloak image ships no curl/wget; talk to the management port
      # through bash's own /dev/tcp.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q UP <&3"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ------------------------------------------------------------ object storage
  minio:
    <<: *restart
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: rasta-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rasta_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rasta_minio_dev_password}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: rasta-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set rasta http://minio:9000 "${S3_ACCESS_KEY:-rasta_minio_admin}" "${S3_SECRET_KEY:-rasta_minio_dev_password}"
        mc mb --ignore-existing "rasta/${S3_BUCKET_DOCUMENTS:-rasta-documents}"
        mc anonymous set none "rasta/${S3_BUCKET_DOCUMENTS:-rasta-documents}"
        echo 'MinIO buckets ready'
    restart: 'no'

  # ------------------------------------------------------------ malware scan
  #
  # ClamAV, pinned to an immutable digest (ADR-049, closes Q-18).
  #
  # `clamav/clamav:1.5.4` — the official Cisco-Talos image — resolved on
  # 2026-08-31 to the digest below. Pinned by digest rather than by tag because
  # a tag is a moving pointer: `1.5.4` is rebuilt whenever its base or its
  # bundled signature set changes, so a tag reference means a different scanner
  # engine on a different day with no commit to show for it. Bumping it is a
  # deliberate, reviewable edit here.
  #
  # The non-`_base` variant, which ships the reviewed CVD set (main, daily,
  # bytecode) inside the image. The `_base` variant carries none and downloads
  # ~110 MB from the ClamAV mirrors before clamd will start.
  #
  # amd64 only. On Apple Silicon this runs under emulation and is slow but
  # correct; there is no arm64 manifest to point at.
  clamav:
    <<: *restart
    image: clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591
    container_name: rasta-clamav
    # `clamd` directly rather than the image's `/init`, which needs root at
    # start to create /run/clamav and link /var/lock. Bypassing it lets the
    # whole container run as the image's unprivileged `clamav` user (uid 100),
    # which is the AGENTS.md posture rather than "the daemon drops privileges
    # eventually". freshclam runs as its own container below for the same
    # reason.
    user: '100:101'
    entrypoint: ['clamd']
    read_only: true
    tmpfs:
      - /run/clamav:uid=100,gid=101,mode=0770
      - /tmp:uid=100,gid=101,mode=0770
    environment:
      # The build date in `zVERSION` carries no zone designator, and
      # document-service reads it as UTC. Pinned here so the two agree.
      TZ: Etc/UTC
    ports:
      # **Loopback only.** clamd authenticates nobody — anything that can reach
      # this port can submit a stream and enumerate the signature database — so
      # it is bound to 127.0.0.1 and never to 0.0.0.0. Production does not use
      # TCP at all: document-service refuses `DOCUMENT_CLAMAV_HOST` when
      # NODE_ENV is production and uses a shared Unix socket instead (ADR-049).
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    volumes:
      # The local/CI config, which is `clamd.conf` plus the TCP listener. The
      # production file beside it has no listener at all.
      - ./infrastructure/docker/clamav/clamd.local.conf:/etc/clamav/clamd.conf:ro
      - clamav-signatures:/var/lib/clamav
    healthcheck:
      # clamd's own protocol rather than a port check: the port is open while
      # the 110 MB database is still loading, and a scan submitted then is
      # refused. PING answers only once the engine is ready.
      #
      # `clamdscan --ping` rather than the image's bundled `clamdcheck.sh`.
      # That script does `nc localhost 3310`, and Alpine's resolver answers
      # `localhost` with ::1 first — which clamd, bound to 0.0.0.0, does not
      # listen on. It reports "Unable to contact server" against a completely
      # healthy daemon. `clamdscan` reads clamd.conf instead, so it finds the
      # Unix socket and works for the production config too, which has no TCP
      # listener at all for a port check to aim at.
      test: ['CMD-SHELL', 'clamdscan --ping 1 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      # The database load genuinely takes this long on a cold start.
      start_period: 120s

  # Keeps the signature database current, into the volume clamd reads.
  #
  # Its own container, non-root, sharing only the volume. clamd picks up a new
  # database through its own `SelfCheck` rather than being notified, so this
  # needs no access to clamd's socket.
  #
  # The named volume is seeded from the image on first creation, so the first
  # run starts from the reviewed database inside the pinned digest and updates
  # from there — rather than downloading the whole set before anything works.
  clamav-freshclam:
    <<: *restart
    image: clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591
    container_name: rasta-clamav-freshclam
    user: '100:101'
    entrypoint: ['freshclam', '--daemon', '--foreground']
    read_only: true
    tmpfs:
      - /tmp:uid=100,gid=101,mode=0770
    environment:
      TZ: Etc/UTC
    volumes:
      - ./infrastructure/docker/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
      - clamav-signatures:/var/lib/clamav
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      # Disabled, not forgotten. The image's own HEALTHCHECK runs
      # `clamdcheck.sh`, which pings clamd — and this container is freshclam,
      # which is not clamd and never will be. Inherited, it reports
      # `unhealthy` forever while the updater works perfectly, and an operator
      # scanning `docker ps` learns to ignore the column.
      #
      # A real check would have to decide what "healthy" means for a process
      # that sleeps between updates, and the honest signal for that already
      # exists: `rasta_document_scan_signature_age_seconds`, which climbs when
      # this container stops doing its job. See
      # `docs/runbooks/malware-scanner-down.md` § 4.
      disable: true

  # --------------------------------------------------------- workflow engine
  temporal:
    <<: *restart
    image: temporalio/auto-setup:1.26.2
    container_name: rasta-temporal
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-rasta}
      POSTGRES_PWD: ${POSTGRES_SUPERUSER_PASSWORD:-rasta_dev_password}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # auto-setup otherwise binds the frontend to the container's own IP, so a
      # loopback healthcheck can never succeed even though the server is fine.
      BIND_ON_IP: '0.0.0.0'
    ports:
      - '7233:7233'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', 'localhost:7233']
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

  temporal-ui:
    <<: *restart
    image: temporalio/ui:2.34.0
    container_name: rasta-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3200
    ports:
      - '8088:8080'
    depends_on:
      - temporal
    profiles: ['tools', 'all']

  # ------------------------------------------------------------------ search
  opensearch:
    <<: *restart
    image: opensearchproject/opensearch:2.18.0
    container_name: rasta-opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - '9200:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    profiles: ['search', 'all']

  # ----------------------------------------------------------- observability
  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: rasta-otel-collector
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./infrastructure/docker/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    profiles: ['observability', 'all']

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.1.0
    container_name: rasta-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    profiles: ['observability', 'all']

  grafana:
    <<: *restart
    image: grafana/grafana:11.5.1
    container_name: rasta-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_dev_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    profiles: ['observability', 'all']

  # --------------------------------------------------------------- dev tools
  kafka-ui:
    <<: *restart
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: rasta-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: rasta-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      DYNAMIC_CONFIG_ENABLED: 'true'
    ports:
      - '8081:8080'
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ['tools', 'all']

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.22
    container_name: rasta-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    profiles: ['tools', 'all']

volumes:
  postgres-data:
  redis-data:
  minio-data:
  # Persistent, and load-bearing. Without it every restart re-downloads roughly
  # 110 MB from the ClamAV mirrors before clamd will start — slow, rude, and
  # rate-limited. Docker seeds a named volume from the image path on first
  # creation, so this starts as the reviewed database inside the pinned digest.
  clamav-signatures:
  opensearch-data:
  prometheus-data:
  grafana-data:
