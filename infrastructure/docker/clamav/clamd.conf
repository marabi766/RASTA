# =============================================================================
# clamd — production baseline (ADR-049)
#
# This file has **no TCP listener**, and that is the point. AGENTS.md S-08
# forbids implicit trust in an internal network, and a clamd TCP port is an
# unauthenticated command channel: anything that can reach it can submit a
# stream, read the engine version and enumerate the signature database. There
# is no password, no TLS and no client certificate in the clamd protocol, so
# "only reachable from inside the cluster" would be the entire access control.
#
# The production boundary is therefore a Unix domain socket on a volume shared
# by exactly two containers in one Pod — document-service and this sidecar.
# Filesystem permissions become the authorization, and nothing outside the Pod
# can address the socket at all.
#
# `clamd.local.conf` beside this file adds a TCP listener for local
# development and CI, where a Unix socket cannot be shared with a Node process
# on a Windows host. `document-service` refuses a TCP scanner outright when
# NODE_ENV is production, so that file cannot become a deployment by accident.
# =============================================================================

# --- Process -----------------------------------------------------------------

# Foreground, so the container supervisor sees clamd rather than a shell that
# outlived it, and logs go to the collector rather than to a file nobody reads.
Foreground yes
LogTime yes
LogClean no
LogVerbose no

# Never as root. The image ships a `clamav` user (uid 100, gid 101); the
# deployment starts the container as that user, so this file deliberately
# carries no `User` directive — a `User` line is a request to drop privileges,
# and a process that never had them cannot honour it.

# Refuse to run degraded rather than run without limits.
ExitOnOOM yes

# --- Socket ------------------------------------------------------------------

LocalSocket /run/clamav/clamd.sock
# 0660 with a shared group: the sidecar owns the socket, document-service's
# container joins the group. World-writable here would undo the whole boundary.
LocalSocketMode 660
# A stale socket after an unclean restart otherwise stops clamd from binding.
FixStaleSocket yes

# How long clamd waits on a client that has stopped sending. Bounded, so a
# hung document-service cannot pin a scanning thread indefinitely.
ReadTimeout 60
CommandReadTimeout 30
MaxThreads 4
MaxQueue 50
MaxConnectionQueueLength 30

# --- Stream and size limits ---------------------------------------------------
#
# These are the server half of the bounded-scan requirement. The adapter
# enforces its own ceiling before it sends a byte (`DOCUMENT_SCAN_MAX_BYTES`),
# and these numbers sit above it so that the client's limit is the one that
# normally fires and the server's is the backstop for a client that lies.

# Largest INSTREAM body clamd will accept. Above document-service's own
# ceiling, so an oversize object is refused by the adapter with a size reason
# rather than by clamd with a protocol error.
StreamMaxLength 64M

MaxScanSize 200M
MaxFileSize 64M

# --- Archive and decompression limits ----------------------------------------
#
# DOCX and XLSX are ZIP containers, so every accepted document class can carry
# a compressed archive. These bound what one submission may cost: recursion
# depth, member count, and the expanded size of what a small upload can turn
# into. Without them a few kilobytes of nested archive is a way to spend the
# scanner's memory and CPU on demand.

MaxRecursion 10
MaxFiles 1000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxHTMLNoTags 2M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxPartitions 50
MaxIconsPE 100
MaxRecHWP3 16

# Report a limit that was hit instead of finishing quietly.
#
# Load-bearing. With this off, a document that exceeded MaxRecursion or
# MaxFiles is answered `OK` — clamd stopped looking and says nothing, and
# "we stopped looking" would be recorded as "clean". With it on, clamd answers
# `Heuristics.Limits.Exceeded`, which document-service maps to a scan failure
# and never to a clean verdict and never to a virus finding: it is neither.
AlertExceedsMax yes

# Bound the wall-clock cost of one submission (milliseconds).
MaxScanTime 120000

# --- Engine -------------------------------------------------------------------

ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanArchive yes
ScanMail no

Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 60000

# A reload doubles resident memory while both databases are held. The sidecar
# is sized for one, and a scan queued during a reload waits rather than being
# answered by a half-loaded engine.
ConcurrentDatabaseReload no

DatabaseDirectory /var/lib/clamav
