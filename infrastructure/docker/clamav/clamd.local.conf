# =============================================================================
# clamd — local development and CI only (ADR-049)
#
# **This file must never be mounted into a production deployment.**
#
# It is `clamd.conf` plus a TCP listener, and it exists for one reason: a Unix
# domain socket cannot be shared between a Linux container and a Node process
# running on a Windows host, so `pnpm infra:up` on a developer machine has no
# way to reach the production boundary. CI on Linux uses the socket and proves
# that transport; a laptop uses this and proves the protocol.
#
# Two things keep it from drifting into a deployment:
#
#   1. `docker-compose.yml` publishes the port as `127.0.0.1:3310:3310`, so it
#      is not reachable from another machine even on a developer's network.
#   2. `document-service` refuses to start with a TCP scanner when NODE_ENV is
#      `production` (`documentEnvSchema`, ADR-049). It is not a warning and
#      not a default that can be overridden — the process exits.
#
# The listener is still unauthenticated, which is exactly why it is confined
# here rather than made "safe enough" for production with a network policy.
# =============================================================================

Foreground yes
LogTime yes
LogClean no
LogVerbose no
ExitOnOOM yes

LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
FixStaleSocket yes

# The local/CI addition, and the only difference from `clamd.conf`.
#
# 0.0.0.0 inside the container, because a published Docker port forwards to
# the container's external interface and a 127.0.0.1 bind inside would refuse
# it. The confinement is the host-side `127.0.0.1:` publish, not this line.
TCPSocket 3310
TCPAddr 0.0.0.0

ReadTimeout 60
CommandReadTimeout 30
MaxThreads 4
MaxQueue 50
MaxConnectionQueueLength 30

StreamMaxLength 64M
MaxScanSize 200M
MaxFileSize 64M

MaxRecursion 10
MaxFiles 1000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxHTMLNoTags 2M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxPartitions 50
MaxIconsPE 100
MaxRecHWP3 16
AlertExceedsMax yes
MaxScanTime 120000

ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanArchive yes
ScanMail no

Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 60000

ConcurrentDatabaseReload no
DatabaseDirectory /var/lib/clamav
