# =============================================================================
# freshclam — signature updates (ADR-049)
#
# Runs as its own container beside clamd, writing to the shared, persistent
# signature volume. Separate rather than the image's bundled supervisor for one
# reason: the bundled `/init` needs root at start (it creates `/run/clamav` and
# links `/var/lock`), and running the whole container as root to get an updater
# is a poor trade when the updater can be its own non-root process.
#
# clamd notices the new database on its own. `SelfCheck` — every 600 seconds by
# default — re-stats the database directory and reloads when it changed, so
# there is no `NotifyClamd` here and freshclam needs no access to clamd's
# socket. One less cross-container dependency, at the cost of up to ten minutes
# before a fresh database is in use.
#
# The volume is what makes this worth running at all: without persistence every
# restart re-downloads ~110 MB from the ClamAV mirrors, which is both slow and
# rude, and which the mirrors rate-limit.
# =============================================================================

DatabaseDirectory /var/lib/clamav

# Foreground, so the container supervisor sees freshclam itself and its output
# goes to the collector. There is deliberately **no** `UpdateLogFile`: pointed
# at `/dev/stdout` freshclam refuses to start at all — it opens the path with
# `O_NOFOLLOW`-like semantics and reports "Symbolic link loop" against the
# container's own stdout symlink — and pointed at a file it writes somewhere
# nobody reads. With no log file configured and `Foreground yes` it writes to
# the console, which is what a container wants.
#
# That output is the whole risk this file manages: a failing updater has no
# other symptom. Scanning keeps working with an old database and keeps
# answering, so the only other signal is the signature age climbing
# (`rasta_document_scan_signature_age_seconds`), and past
# DOCUMENT_SCAN_SIGNATURE_MAX_AGE_HOURS document-service stops issuing clean
# verdicts entirely.
Foreground yes
LogTime yes

# Four times a day, which is roughly the cadence the daily CVD is published at.
# More often mostly costs mirror requests.
Checks 4

DatabaseMirror database.clamav.net

# Refuse a database that fails its own integrity check rather than loading it.
TestDatabases yes

# Bounded, so a hung mirror does not leave the updater stuck until a restart.
ConnectTimeout 60
ReceiveTimeout 300

# Identify the client honestly. ClamAV asks for this so mirror operators can
# contact the owner of a misbehaving updater.
DatabaseOwner clamav
