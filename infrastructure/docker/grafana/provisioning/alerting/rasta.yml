apiVersion: 1
# Inert on purpose. Grafana reads this directory on every start and logs an
# error when it does not exist; this file makes it exist without provisioning
# anything. It declares no alert rule groups, contact points, notification
# policies, templates or mute timings: the local stack has no Alertmanager and
# delivers no notifications, and the audit alerts are Prometheus rules
# (infrastructure/docker/prometheus/rules), not Grafana-managed alerts.
# scripts/check-grafana-dashboard-lib.mjs refuses any other key.
