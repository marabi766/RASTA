global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: rasta-local

# Resolved relative to this file, so it is the same path in the container
# (/etc/prometheus/rules/...) and under `promtool check config`. Named
# explicitly rather than globbed: a glob that matches nothing loads no rules and
# still passes the config check. tests/ is never listed here.
rule_files:
  - rules/rasta-audit-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  # docker-compose.yml `kafka-exporter`, over the Compose network. A slower
  # interval and a longer timeout than the default: the exporter queries the
  # broker for every consumer group on each scrape, and a local broker that has
  # accumulated test groups took 2-9 s to answer.
  - job_name: kafka-exporter
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak:9000']

  # Rasta services expose /metrics on their own HTTP port. host.docker.internal
  # lets the container reach services running on the developer's host.
  - job_name: rasta-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'host.docker.internal:3000'
          - 'host.docker.internal:3102'
        labels:
          environment: local

  # identity-service in its own job, and only here, for the same reason as
  # audit-service below: the job name is the service's stable operational
  # identity, while `instance` is a deployment-specific address.
  # RastaIdentityServiceMetricsUnavailable selects up{job="identity-service"}
  # and keeps only `job`. The refusal-evidence capture-gap, closed-backlog and
  # publish-failure alerts read this target's samples, so losing it has to be
  # an alert in its own right rather than a quiet absence of those three.
  - job_name: identity-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'host.docker.internal:3101'
        labels:
          environment: local

  # audit-service in its own job, and only here. The job name is the service's
  # operational identity: RastaAuditServiceMetricsUnavailable selects
  # up{job="audit-service"} and keeps only `job`. Inside the shared
  # rasta-services job the only thing telling audit-service apart would be the
  # deployment-specific `instance` address, and an alert keyed on that breaks
  # whenever the address does. Every audit ingestion, failure, lag and
  # producer-silence alert reads this target's samples, so losing it has to be
  # an alert in its own right rather than a quiet absence of the others.
  - job_name: audit-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'host.docker.internal:3115'
        labels:
          environment: local
