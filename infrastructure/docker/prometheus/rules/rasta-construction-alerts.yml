# Alert rules for the tender close sweeper (CON-002 PR 7, ADR-065 § 3) and for bid
# opening refused on integrity grounds (PR 8, ADR-066 § 3), evaluated by
# the local Prometheus in docker-compose.yml (`observability` profile).
#
# Local-only, like the audit, notification and economic rules next door: there is no
# Alertmanager in this repository, so a firing alert is visible at
# http://localhost:9090/alerts and nowhere else. Production routing is a deployment
# concern this file does not provide.
#
# Behaviour is proven by tests/rasta-construction-alerts.test.yml:
#   promtool test rules /etc/prometheus/tests/rasta-construction-alerts.test.yml
#
# What is at stake: a bid is refused after the deadline by the database's clock whether
# or not the sweeper runs, so a tender that cannot be closed is not a correctness
# problem — but it stays PUBLISHED, so nobody can open the bids, evaluate or award it.
# The sweeper backs off a failing tender (bounded exponential) so it cannot starve the
# others; this alert is how a person hears that one keeps failing.
#
# No label carries a tender or a tenant: the gauge is a count, and the rows are in the
# database under authorization (AGENTS.md S-09).

groups:
  - name: rasta-construction-tender-close
    rules:
      # More than five failed close attempts of one overdue tender: with the default
      # backoff (10 s base, 15 min cap) that is a tender that has been failing for
      # minutes, not a transient database blip. The gauge is sampled every upkeep
      # tick, so a short `for` rides out one sample.
      - alert: RastaConstructionTenderCloseRetriesHigh
        expr: max(rasta_construction_tender_close_max_attempts) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'An overdue tender cannot be closed ({{ $value }} failed attempts)'
          description: 'At least one PUBLISHED tender past its deadline has failed more than 5 close attempts. Bids on it are already refused, but it stays PUBLISHED, so it cannot be opened, evaluated or awarded. The sweeper keeps retrying with a growing backoff; the construction-service log names the tender and the closed error code. This alert deliberately carries neither.'
          runbook: docs/runbooks/tender-close-stuck.md

  - name: rasta-construction-bid-opening
    rules:
      # Page-level, and on the first occurrence: an opening or an owner read was refused
      # because a stored bid, or the whole receipt chain, did not match the evidence that
      # audit-service holds (ADR-066 § 3). That is either tampering with the bid store or
      # a defect in the chain; either way the tender's bids stay sealed until a person has
      # looked. The counter only exists once it has been incremented, so the plain value
      # (not a rate) is what catches the first one; it clears when the service restarts,
      # by which time the runbook has been followed.
      - alert: RastaConstructionBidOpeningIntegrityRefused
        expr: sum(rasta_construction_bid_opening_refusals_total{reason="integrity"}) > 0
        labels:
          severity: critical
        annotations:
          summary: 'Bids did not match the receipt evidence and were not opened ({{ $value }} refusals)'
          description: 'An opening or an owner read of bids was refused with reason "integrity": a stored bid, or the receipt chain, differs from what audit-service holds. Nothing was opened or shown. Treat as possible tampering until proven otherwise; the construction-service log says the sealing failure code, and this alert deliberately carries neither tender nor tenant.'
          runbook: docs/runbooks/bid-opening-integrity.md

      # Page-level, first occurrence: after an opening committed, identity-service says the
      # proposer or the approver MAY have been a member of a bidding organization: a possible
      # conflict over the window windowStart..checkedAt, checked conservatively, so a false
      # positive is an alert and nothing more (ADR-066 § 4, the residual of the conflict check
      # at the approval). The opening stands; a person decides. Same counter semantics as
      # above (born at its first increment).
      - alert: RastaConstructionBidOpeningConflictDetected
        expr: sum(rasta_construction_bid_opening_conflict_checks_total{outcome="conflict"}) > 0
        labels:
          severity: critical
        annotations:
          summary: 'A bid opening may have been made by a member of a bidding organization (possible conflict, {{ $value }} detected)'
          description: 'A POSSIBLE conflict of interest: after an opening committed, identity-service said its proposer or approver held a membership of an organization that bid on the tender at some time in the window windowStart to checkedAt (windowStart is the earliest of the identity reads at the approval and the decision instant; checkedAt is the clock of identity-service as it answered, after the commit). The check is conservative: a membership that came and went inside the window, or began after the commit, is a false positive, which is an alert and nothing more. The opening was not undone. BID_OPENING_CONFLICT_DETECTED names the tender, the person and the organizations (ids only); this alert deliberately carries none of them.'
          runbook: docs/runbooks/bid-opening-conflict.md

      # Warning: identity-service could not say whom someone belongs to, so an opening or an
      # owner read of bids was refused (fail closed), or the check after an opening could not
      # be made (and is not retried). Nothing is shown in the first case; the second needs a
      # person to do the check by hand.
      - alert: RastaConstructionBidOpeningIdentityUnavailable
        expr: >-
          sum(rasta_construction_bid_opening_refusals_total{reason="identity_unavailable"}) > 0
          or sum(rasta_construction_bid_opening_conflict_checks_total{outcome="unavailable"}) > 0
        labels:
          severity: warning
        annotations:
          summary: 'identity-service could not say whom a reader of bids belongs to ({{ $value }})'
          description: 'An opening or an owner read of bids was refused with reason "identity_unavailable" (identity-service unreachable, slow or answering outside its contract; nothing was shown), or the check made after an opening could not be made. Neither names a tender or a tenant here; the construction-service log says which.'
          runbook: docs/runbooks/bid-opening-identity-unavailable.md

  - name: rasta-construction-award
    rules:
      # Page-level, first occurrence: after an award committed, supplier-service says the winner
      # MAY have been suspended, or lost its contracting qualification, in the window between the
      # standing read the award was made on and the commit (ADR-067 section 3, the residual of the
      # standing check). Conservative, so a false positive is an alert and nothing more. The award
      # stands; a person decides. The counter is born at its first increment, so the plain value
      # (not a rate) catches the first one; the event is written in the same commit that settles
      # the check, so a restart that resets the counter loses the page and never the event.
      - alert: RastaConstructionAwardStandingConflictDetected
        expr: sum(rasta_construction_award_standing_checks_total{outcome="conflict"}) > 0
        labels:
          severity: critical
        annotations:
          summary: 'A tender may have been awarded to a suspended or no longer qualified contractor (possible conflict, {{ $value }} detected)'
          description: 'A POSSIBLE award to a contractor that was not eligible: after an award committed, supplier-service said the winner had a suspension that began inside the window windowStart to checkedAt (windowStart is the instant of the standing read the award was made on; checkedAt is the clock of supplier-service as it answered, after the commit), a suspension still open, or no longer held its contracting qualification. The check is conservative: a suspension that began and ended inside the window is a hit too, which is an alert and nothing more. The award was not undone. TENDER_AWARD_STANDING_CONFLICT_DETECTED names the tender, the bid, the contractor and the suspensions (ids only); this alert deliberately carries none of them.'
          runbook: docs/runbooks/award-standing-conflict.md

      # Warning: a standing check after an award is still pending past the configured age. The
      # check is a row written in the award's transaction and made by a sweeper (retried with a
      # backoff while supplier-service cannot answer), so this fires when it is not being made at all
      # or cannot be, never because a request was lost. The gauge is sampled every upkeep tick.
      - alert: RastaConstructionAwardStandingCheckOverdue
        expr: max(rasta_construction_award_standing_check_overdue) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'A standing check after an award is overdue ({{ $value }} pending past the alert age)'
          description: 'At least one standing check after an award has been pending longer than CONSTRUCTION_AWARD_CHECK_ALERT_AGE_SECONDS: supplier-service could not say whether the winner was suspended in the window around the award (unreachable, slow or answering outside its contract), or the sweeper is not running. The check is retried with a bounded backoff and the award stands, but nobody has yet looked at the winner since the award committed. The construction-service log names the tender, the winning bid and a closed error code for each failed attempt; this alert deliberately carries none of them.'
          runbook: docs/runbooks/award-standing-conflict.md
