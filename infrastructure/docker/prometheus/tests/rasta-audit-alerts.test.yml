  # ---------------------------------------------------------------------------
  # RastaAuditProducerSilent — an expected producer contributed no row.
  #
  # Gate: rasta_audit_expected_active_producer{source_service} 1, which
  # audit-service exports only for AUDIT_EXPECTED_ACTIVE_PRODUCERS, present now
  # and 6h ago. Condition: no increase of rasta_audit_records_ingested_total for
  # that source_service over [6h], summed across topics, outcomes and
  # instances. `for: 30m`. Series start at 0m, which is the first scrape.
  #
  # Main group, 0m-420m:
  # - identity-service: expected on two audit-service instances, counters on
  #   both instances, two topics and three outcomes, all flat (one at an old
  #   non-zero value). The gate first holds at 360m (offset 6h reaches the 0m
  #   sample), so it is pending 360m-389m and fires at exactly 390m, as one
  #   alert labelled only source_service and severity.
  # - fleet-service: old non-zero and zero counters, never declared expected.
  # - unknown: the fallback label is never declared, however large its count.
  # - organization-service: declared only from 300m (a newly configured
  #   producer, counters zero-seeded with it). Its gate needs a sample 6h
  #   earlier, so it cannot even be pending before 660m.
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'rasta_audit_expected_active_producer{job="audit-service",instance="host.docker.internal:3115",environment="local",source_service="identity-service"}'
        values: '1x420'
      - series: 'rasta_audit_expected_active_producer{job="audit-service",instance="audit-b.internal:3115",environment="local",source_service="identity-service"}'
        values: '1x420'
      - series: 'rasta_audit_expected_active_producer{job="audit-service",instance="host.docker.internal:3115",environment="local",source_service="organization-service"}'
        values: '_x299 1x120'
      - series: 'rasta_audit_records_ingested_total{job="audit-service",instance="host.docker.internal:3115",environment="local",source_service="identity-service",source_topic="rasta.identity.v1",outcome="SUCCESS"}'
        values: '0x420'
      - series: 'rasta_audit_records_ingested_total{job="audit-service",instance="host.docker.internal:3115",environment="local",source_service="identity-service",source_topic="rasta.identity.v1",outcome="FAILURE"}'
        values: '0x420'
      - series: 'rasta_audit_records_ingested_total{job="audit-service",instance="host.docker.internal:3115",environment="local",source_service="identity-service",source_topic="rasta.audit.trail.v1",outcome="SUCCESS"}'
        values: '42x420'
      - series: 'rasta_audit_records_ingested_total{job="audit-service",instance="audit-b.internal:3115",environment="local",source_service="identity-service",source_topic="rasta.identity.v1",outcome="SUCCESS"}'
        values: '0x420'
      - series: 'rasta_audit_records_ingested_total{job="audit-service",instance="audit-b.internal:3115",environment="local",source_service="identity-service",source_topic="rasta.audit.trail.v1",outcome="REFUSED"}'
        values: '0x420'
      - series: 'rasta_audit_records_ingested_total{job="audit-service",instance="host.docker.internal:3115",environment="local",source_service="fleet-service",source_topic="rasta.fleet.v1",outcome="SUCCESS"}'
        values: '3x420'
      - series: 'rasta_audit_records_ingested_total{job="audit-service",instance="host.docker.internal:3115",environment="local",source_service="fleet-service",source_topic="rasta.fleet.v1",outcome="FAILURE"}'
        values: '0x420'
      - series: 'rasta_audit_records_ingested_total{job="audit-service",instance="host.docker.internal:3115",environment="local",source_service="unknown",source_topic="rasta.asset.v1",outcome="SUCCESS"}'
        values: '5x420'
      - series: 'rasta_audit_records_ingested_total{job="audit-service",instance="host.docker.internal:3115",environment="local",source_service="organization-service",source_topic="rasta.organization.v1",outcome="SUCCESS"}'
        values: '_x299 0x120'
    alert_rule_test:
      # First scrape, and every evaluation before the gate can hold.
      - eval_time: 0m
        alertname: RastaAuditProducerSilent
        exp_alerts: []
      - eval_time: 1m
        alertname: RastaAuditProducerSilent
        exp_alerts: []
      - eval_time: 30m
        alertname: RastaAuditProducerSilent
