# Behaviour tests for rules/rasta-construction-alerts.yml.
#
#   docker run --rm -v "$PWD/infrastructure/docker/prometheus:/etc/prometheus:ro" \
#     --entrypoint promtool prom/prometheus:v3.1.0 \
#     test rules /etc/prometheus/tests/rasta-construction-alerts.test.yml
#
# Inputs carry the scrape's job/instance/environment labels so the expected alert also
# proves which labels the rule keeps (none) and which it drops.

rule_files:
  - ../rules/rasta-construction-alerts.yml

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------------
  # RastaConstructionTenderCloseRetriesHigh
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      # Climbs past 5 and stays there.
      - series: 'rasta_construction_tender_close_max_attempts{service="construction-service",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '0 1 3 5 6 7 7 7 0 0 0'
    alert_rule_test:
      # Exactly 5 is not enough.
      - eval_time: 3m
        alertname: RastaConstructionTenderCloseRetriesHigh
        exp_alerts: []
      # Above 5, but not yet for 2 minutes.
      - eval_time: 5m
        alertname: RastaConstructionTenderCloseRetriesHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: RastaConstructionTenderCloseRetriesHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'An overdue tender cannot be closed (7 failed attempts)'
              description: 'At least one PUBLISHED tender past its deadline has failed more than 5 close attempts. Bids on it are already refused, but it stays PUBLISHED, so it cannot be opened, evaluated or awarded. The sweeper keeps retrying with a growing backoff; the construction-service log names the tender and the closed error code. This alert deliberately carries neither.'
              runbook: docs/runbooks/tender-close-stuck.md
      # Closed (or cancelled): the gauge is back to 0.
      - eval_time: 9m
        alertname: RastaConstructionTenderCloseRetriesHigh
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # RastaConstructionBidOpeningIntegrityRefused
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      # Other reasons never page; integrity appears at 1 (a counter is born when first
      # incremented) and stays there.
      - series: 'rasta_construction_bid_opening_refusals_total{service="construction-service",reason="not_closed",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '3 3 3 3 3 3'
      - series: 'rasta_construction_bid_opening_refusals_total{service="construction-service",reason="integrity",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '_ _ 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: RastaConstructionBidOpeningIntegrityRefused
        exp_alerts: []
      - eval_time: 2m
        alertname: RastaConstructionBidOpeningIntegrityRefused
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 'Bids did not match the receipt evidence and were not opened (1 refusals)'
              description: 'An opening or an owner read of bids was refused with reason "integrity": a stored bid, or the receipt chain, differs from what audit-service holds. Nothing was opened or shown. Treat as possible tampering until proven otherwise; the construction-service log says the sealing failure code, and this alert deliberately carries neither tender nor tenant.'
              runbook: docs/runbooks/bid-opening-integrity.md

  # ---------------------------------------------------------------------------
  # RastaConstructionBidOpeningConflictDetected
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      # Clear checks never page; the first conflict does.
      - series: 'rasta_construction_bid_opening_conflict_checks_total{service="construction-service",outcome="clear",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '4 4 4 4'
      - series: 'rasta_construction_bid_opening_conflict_checks_total{service="construction-service",outcome="conflict",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '_ _ 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: RastaConstructionBidOpeningConflictDetected
        exp_alerts: []
      - eval_time: 2m
        alertname: RastaConstructionBidOpeningConflictDetected
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 'A bid opening may have been made by a member of a bidding organization (possible conflict, 1 detected)'
              description: 'A POSSIBLE conflict of interest: after an opening committed, identity-service said its proposer or approver held a membership of an organization that bid on the tender at some time in the window windowStart to checkedAt (windowStart is the earliest of the identity reads at the approval and the decision instant; checkedAt is the clock of identity-service as it answered, after the commit). The check is conservative: a membership that came and went inside the window, or began after the commit, is a false positive, which is an alert and nothing more. The opening was not undone. BID_OPENING_CONFLICT_DETECTED names the tender, the person and the organizations (ids only); this alert deliberately carries none of them.'
              runbook: docs/runbooks/bid-opening-conflict.md

  # ---------------------------------------------------------------------------
  # RastaConstructionBidOpeningIdentityUnavailable
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      # A refusal for another reason never fires it; identity_unavailable does, on the
      # opening or the owner read; so does a check after an opening that could not be made.
      - series: 'rasta_construction_bid_opening_refusals_total{service="construction-service",reason="not_closed",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '3 3 3 3 3 3 3 3'
      - series: 'rasta_construction_bid_opening_refusals_total{service="construction-service",reason="identity_unavailable",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '_ _ 2 2 2 2 2 2'
      - series: 'rasta_construction_bid_opening_conflict_checks_total{service="construction-service",outcome="unavailable",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '_ _ _ _ _ _ 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: RastaConstructionBidOpeningIdentityUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: RastaConstructionBidOpeningIdentityUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'identity-service could not say whom a reader of bids belongs to (2)'
              description: 'An opening or an owner read of bids was refused with reason "identity_unavailable" (identity-service unreachable, slow or answering outside its contract; nothing was shown), or the check made after an opening could not be made. Neither names a tender or a tenant here; the construction-service log says which.'
              runbook: docs/runbooks/bid-opening-identity-unavailable.md

  # ---------------------------------------------------------------------------
  # RastaConstructionAwardStandingConflictDetected
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      # Clear checks never page; the first conflict does. An unavailable check does not either.
      - series: 'rasta_construction_award_standing_checks_total{service="construction-service",outcome="clear",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '4 4 4 4'
      - series: 'rasta_construction_award_standing_checks_total{service="construction-service",outcome="unavailable",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '1 1 1 1'
      - series: 'rasta_construction_award_standing_checks_total{service="construction-service",outcome="conflict",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '_ _ 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: RastaConstructionAwardStandingConflictDetected
        exp_alerts: []
      - eval_time: 2m
        alertname: RastaConstructionAwardStandingConflictDetected
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 'A tender may have been awarded to a suspended or no longer qualified contractor (possible conflict, 1 detected)'
              description: 'A POSSIBLE award to a contractor that was not eligible: after an award committed, supplier-service said the winner had a suspension that began inside the window windowStart to checkedAt (windowStart is the instant of the standing read the award was made on; checkedAt is the clock of supplier-service as it answered, after the commit), a suspension still open, or no longer held its contracting qualification. The check is conservative: a suspension that began and ended inside the window is a hit too, which is an alert and nothing more. The award was not undone. TENDER_AWARD_STANDING_CONFLICT_DETECTED names the tender, the bid, the contractor and the suspensions (ids only); this alert deliberately carries none of them.'
              runbook: docs/runbooks/award-standing-conflict.md

  # ---------------------------------------------------------------------------
  # RastaConstructionAwardStandingCheckOverdue
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      # Pending checks inside the alert age never fire it; one past it does, after the `for`.
      - series: 'rasta_construction_award_standing_check_pending{service="construction-service",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '1 1 1 1 1 1 0'
      - series: 'rasta_construction_award_standing_check_overdue{service="construction-service",job="rasta-services",instance="host.docker.internal:3000",environment="local"}'
        values: '0 0 1 1 1 1 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: RastaConstructionAwardStandingCheckOverdue
        exp_alerts: []
      - eval_time: 3m
        alertname: RastaConstructionAwardStandingCheckOverdue
        exp_alerts: []
      - eval_time: 5m
        alertname: RastaConstructionAwardStandingCheckOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'A standing check after an award is overdue (1 pending past the alert age)'
              description: 'At least one standing check after an award has been pending longer than CONSTRUCTION_AWARD_CHECK_ALERT_AGE_SECONDS: supplier-service could not say whether the winner was suspended in the window around the award (unreachable, slow or answering outside its contract), or the sweeper is not running. The check is retried with a bounded backoff and the award stands, but nobody has yet looked at the winner since the award committed. The construction-service log names the tender, the winning bid and a closed error code for each failed attempt; this alert deliberately carries none of them.'
              runbook: docs/runbooks/award-standing-conflict.md
      - eval_time: 6m
        alertname: RastaConstructionAwardStandingCheckOverdue
        exp_alerts: []
