rule_files:
  - ../rules/rasta-marketplace-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_start_backlog_age_seconds{service="marketplace-service",instance="replica-1"}'
        values: '0 301 361 421 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: RastaMarketplaceSagaStartBacklogAging
        exp_alerts: []
      - eval_time: 3m
        alertname: RastaMarketplaceSagaStartBacklogAging
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Order saga starts are waiting
              description: A start intent has waited over five minutes. Check Temporal connectivity and namespace retention before reconciling ambiguous legacy starts.
              runbook: docs/runbooks/marketplace-saga-deploy.md
      - eval_time: 4m
        alertname: RastaMarketplaceSagaStartBacklogAging
        exp_alerts: []
  # FU-104. Unconfirmed from 2h. The replica whose worker failed exits at 4h, and no
  # rounds are counted from then on, which is what used to clear this two hours
  # later. It is confirmed at 10h, and only then does the alert clear.
  - interval: 5m
    input_series:
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '0x23 1x23 stale'
      # The other replica goes on reading it. It saw it later: the highest count decides.
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '0x25 1x94 0x24'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_read_timestamp_seconds{service="marketplace-service",instance="replica-2"}'
        values: '0+300x144'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_seen_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '_x24 7200+300x23 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '0+300x23 _x24 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_seen_timestamp_seconds{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '_x26 7800+300x94 _x25'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '0+300x25 _x95 36300+300x24'
    alert_rule_test:
      - eval_time: 115m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
      - eval_time: 2h
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: &release-firing
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A decided dispute's release is unconfirmed
              description: economic-service has not confirmed a dispute release, so the obligation stays DISPUTED and its funds held. This stays on until a read of the database finds it confirmed, with or without a worker; the runbook lists the orders.
              runbook: docs/runbooks/marketplace-saga-deploy.md
      - eval_time: 8h
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 10h
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      # The first read that finds it confirmed.
      - eval_time: 605m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
  # The only replica exits at 11m (a stale marker, as a failed scrape writes), and
  # comes back at 31m with the release still unconfirmed: confirmed at 42m.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '1x10 stale _x19 1x10 0x10'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_read_timestamp_seconds{service="marketplace-service",instance="replica-1"}'
        values: '0+60x10 stale _x19 1860+60x21'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_seen_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '0+60x10 stale _x19 1860+60x10 _x11'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '_x42 2520+60x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 12m
        alertname: RastaMarketplaceSagaUnconfirmedCallsUnread
        exp_alerts: []
      - eval_time: 13m
        alertname: RastaMarketplaceSagaUnconfirmedCallsUnread
        exp_alerts: &unread-firing
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Unconfirmed saga calls cannot be counted
              description: No marketplace-service instance has read saga_unconfirmed_call for minutes, so a release alert that is off cannot be trusted, and one that is on holds. Funds may be held unseen.
              runbook: docs/runbooks/marketplace-saga-deploy.md
      # Past where lookback or any fixed hold would have ended it.
      - eval_time: 30m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 41m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 42m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
  # Confirmed while the replica was down: the first read clears it.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '1x10 stale _x19 0x10'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_read_timestamp_seconds{service="marketplace-service",instance="replica-1"}'
        values: '0+60x10 stale _x19 1860+60x10'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_seen_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '0+60x10 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '_x31 1860+60x10'
    alert_rule_test:
      - eval_time: 30m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 31m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
  # The replica that read it exits; the other's reads have been failing with a zero
  # frozen in them. Nobody is reading, so the zero clears nothing until a read works.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '1x10 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_read_timestamp_seconds{service="marketplace-service",instance="replica-1"}'
        values: '0+60x10 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '0x30'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_read_timestamp_seconds{service="marketplace-service",instance="replica-2"}'
        values: '60x20 1260+60x10'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_seen_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '0+60x10 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '60x20 1260+60x10'
    alert_rule_test:
      - eval_time: 18m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 21m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
  # #769 r1 F1: replica-1 reads 1 at 600s and is gone at 660s. replica-2's last read,
  # a zero from before that (540s), is 120s old at 660s, so not yet stale. It is older
  # than the positive, so it clears nothing, then or once it ages; its read at 1200s does.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '0x9 1 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_read_timestamp_seconds{service="marketplace-service",instance="replica-1"}'
        values: '0+60x10 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_seen_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '_x10 600 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '0+60x9 _ stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '0x30'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_read_timestamp_seconds{service="marketplace-service",instance="replica-2"}'
        values: '0+60x9 540x9 1200+60x10'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '0+60x9 540x9 1200+60x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
      - eval_time: 10m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 11m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 15m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 19m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 20m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
  # replica-1 is gone by 5m, its last positive at 240s. replica-2 read zero at that very
  # instant, which is not after it (5m), and then after it (6m): that is the confirmation.
  # Everyone goes at 7m: it was confirmed, so it stays off when that read has aged.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '1x4 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_seen_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '0+60x4 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '0x6 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '0x3 240x1 360 stale'
    alert_rule_test:
      - eval_time: 4m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 5m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 6m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
      - eval_time: 30m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
  # Any replica's report holds it: replica-1's reads fail with its 1 frozen, and
  # replica-2 reads zero after it. Not cleared until replica-1 reports too.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '1x10 0x5'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_seen_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '60x15'
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '0x15'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-2",operation="resolveObligationDispute"}'
        values: '120+60x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 11m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
  # Monitoring was off for days and every replica is gone: nothing here relies on the
  # alert's own state, so the first evaluation with only old samples still answers.
  # Past the retention nothing is known of it, and Unread is what is on.
  - interval: 1h
    input_series:
      - series: 'rasta_marketplace_saga_unconfirmed_calls_seen_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '3600x3 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '1800x3 stale'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_read_timestamp_seconds{service="marketplace-service",instance="replica-1"}'
        values: '3600x3 stale'
    alert_rule_test:
      - eval_time: 3d
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: *release-firing
      - eval_time: 7d4h
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
      - eval_time: 7d4h
        alertname: RastaMarketplaceSagaUnconfirmedCallsUnread
        exp_alerts: *unread-firing
  # The read keeps failing in a live process: the count is frozen, the time stale.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_unconfirmed_calls{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '0x20'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_read_timestamp_seconds{service="marketplace-service",instance="replica-1"}'
        values: '0+60x10 600x10'
      - series: 'rasta_marketplace_saga_unconfirmed_calls_cleared_timestamp_seconds{service="marketplace-service",instance="replica-1",operation="resolveObligationDispute"}'
        values: '0+60x10 600x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: RastaMarketplaceSagaUnconfirmedCallsUnread
        exp_alerts: []
      - eval_time: 14m
        alertname: RastaMarketplaceSagaUnconfirmedCallsUnread
        exp_alerts: []
      - eval_time: 15m
        alertname: RastaMarketplaceSagaUnconfirmedCallsUnread
        exp_alerts: *unread-firing
      - eval_time: 15m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
  # The API stays scrapeable and the worker stops: the time stops moving.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_worker_last_poll_timestamp_seconds{service="marketplace-service",instance="replica-1"}'
        values: '0+60x10 600x20 1800+60x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: RastaMarketplaceSagaWorkerNotPolling
        exp_alerts: []
      - eval_time: 14m
        alertname: RastaMarketplaceSagaWorkerNotPolling
        exp_alerts: []
      - eval_time: 16m
        alertname: RastaMarketplaceSagaWorkerNotPolling
        exp_alerts: &worker-firing
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: No worker is polling the order saga queue
              description: Temporal has seen no worker poll the order saga task queue for minutes, or no instance can ask it. Sagas are not moving, so no money call is being made or retried.
              runbook: docs/runbooks/marketplace-saga-deploy.md
      # Polling again.
      - eval_time: 35m
        alertname: RastaMarketplaceSagaWorkerNotPolling
        exp_alerts: []
  # One replica's worker is enough for sagas to move: the freshest time decides.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_worker_last_poll_timestamp_seconds{service="marketplace-service",instance="replica-1"}'
        values: '600x20'
      - series: 'rasta_marketplace_saga_worker_last_poll_timestamp_seconds{service="marketplace-service",instance="replica-2"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: RastaMarketplaceSagaWorkerNotPolling
        exp_alerts: []
  # A deployment that states it runs no worker: no alert. Every instance has to.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_worker_expected{service="marketplace-service",instance="replica-1"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: RastaMarketplaceSagaWorkerNotPolling
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_worker_expected{service="marketplace-service",instance="replica-1"}'
        values: '0x10'
      - series: 'rasta_marketplace_saga_worker_expected{service="marketplace-service",instance="replica-2"}'
        values: '1x5 stale'
    alert_rule_test:
      - eval_time: 5m
        alertname: RastaMarketplaceSagaWorkerNotPolling
        exp_alerts: *worker-firing
      # The replica that expected one exited with it: that does not make it expected less.
      - eval_time: 8m
        alertname: RastaMarketplaceSagaWorkerNotPolling
        exp_alerts: *worker-firing
  # No proof ever, and nothing known of any release: both alerts, not the release one.
  - interval: 1m
    input_series:
      - series: 'unrelated_series'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
      - eval_time: 1m
        alertname: RastaMarketplaceSagaWorkerNotPolling
        exp_alerts: []
      - eval_time: 3m
        alertname: RastaMarketplaceSagaWorkerNotPolling
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: No worker is polling the order saga queue
              description: Temporal has seen no worker poll the order saga task queue for minutes, or no instance can ask it. Sagas are not moving, so no money call is being made or retried.
              runbook: docs/runbooks/marketplace-saga-deploy.md
      - eval_time: 3m
        alertname: RastaMarketplaceSagaUnconfirmedCallsUnread
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Unconfirmed saga calls cannot be counted
              description: No marketplace-service instance has read saga_unconfirmed_call for minutes, so a release alert that is off cannot be trusted, and one that is on holds. Funds may be held unseen.
              runbook: docs/runbooks/marketplace-saga-deploy.md
