rule_files:
  - ../rules/rasta-marketplace-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_start_backlog_age_seconds{service="marketplace-service",instance="replica-1"}'
        values: '0 301 361 421 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: RastaMarketplaceSagaStartBacklogAging
        exp_alerts: []
      - eval_time: 3m
        alertname: RastaMarketplaceSagaStartBacklogAging
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Order saga starts are waiting
              description: A start intent has waited over five minutes, or no replica can measure the backlog. Check Temporal connectivity, the economic-service release and namespace retention before reconciling ambiguous legacy starts.
              runbook: docs/runbooks/marketplace-saga-deploy.md
      - eval_time: 4m
        alertname: RastaMarketplaceSagaStartBacklogAging
        exp_alerts: []

  # The backlog stops being reported (every replica down, or its sample failing
  # and withdrawn): unknown, so it fires rather than reading as an empty backlog.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_start_backlog_age_seconds{service="marketplace-service",instance="replica-1"}'
        values: '0 0 stale'
    alert_rule_test:
      - eval_time: 1m
        alertname: RastaMarketplaceSagaStartBacklogAging
        exp_alerts: []
      - eval_time: 4m
        alertname: RastaMarketplaceSagaStartBacklogAging
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Order saga starts are waiting
              description: A start intent has waited over five minutes, or no replica can measure the backlog. Check Temporal connectivity, the economic-service release and namespace retention before reconciling ambiguous legacy starts.
              runbook: docs/runbooks/marketplace-saga-deploy.md

  # FU-104: one replica's worker fails (run() ended, or Temporal no longer
  # lists it as a poller) while another still polls. Before, this only logged.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_worker_up{service="marketplace-service",instance="replica-1"}'
        values: '1 1 1 0 0 0 0 0 1'
      - series: 'rasta_marketplace_saga_worker_up{service="marketplace-service",instance="replica-2"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 4m
        alertname: RastaMarketplaceSagaWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: RastaMarketplaceSagaWorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              service: marketplace-service
              instance: replica-1
            exp_annotations:
              summary: A marketplace replica has no polling saga worker (replica-1)
              description: This replica's order saga worker is not running, or Temporal does not list it as polling the order task queue. Restart the replica; if no replica polls, no saga moves money.
              runbook: docs/runbooks/marketplace-saga-liveness.md
      - eval_time: 5m
        alertname: RastaMarketplaceSagaNoLiveWorker
        exp_alerts: []
      - eval_time: 8m
        alertname: RastaMarketplaceSagaWorkerDown
        exp_alerts: []

  # FU-104: every worker dead. First both report 0 (failed), then both
  # processes are gone and nothing reports at all: still firing, without a
  # gap, until a worker polls again.
  - interval: 1m
    input_series:
      - series: 'rasta_marketplace_saga_worker_up{service="marketplace-service",instance="replica-1"}'
        values: '1 1 0 0 0 stale _x4 1'
      - series: 'rasta_marketplace_saga_worker_up{service="marketplace-service",instance="replica-2"}'
        values: '1 1 0 0 0 stale _x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: RastaMarketplaceSagaNoLiveWorker
        exp_alerts: []
      - eval_time: 4m
        alertname: RastaMarketplaceSagaNoLiveWorker
        exp_alerts: &no-live-worker
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: No order saga worker is polling
              description: No marketplace-service replica reports a saga worker that Temporal lists as polling. Holds, settlements, refunds and dispute releases are not progressing.
              runbook: docs/runbooks/marketplace-saga-liveness.md
      - eval_time: 6m
        alertname: RastaMarketplaceSagaNoLiveWorker
        exp_alerts: *no-live-worker
      - eval_time: 9m
        alertname: RastaMarketplaceSagaNoLiveWorker
        exp_alerts: *no-live-worker
      - eval_time: 10m
        alertname: RastaMarketplaceSagaNoLiveWorker
        exp_alerts: []

  - interval: 1h
    input_series:
      # Hourly rounds on one replica, then the release is confirmed.
      - series: 'rasta_marketplace_saga_release_unconfirmed_total{service="marketplace-service",instance="replica-1"}'
        values: '0 0 1 2 3 3 3 3 3'
      # Another replica restarts after that: a reset is not a round.
      - series: 'rasta_marketplace_saga_release_unconfirmed_total{service="marketplace-service",instance="replica-2"}'
        values: '4 4 4 4 4 4 4 0 0'
    alert_rule_test:
      - eval_time: 1h
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
      - eval_time: 4h
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: A decided dispute's release is unconfirmed
              description: economic-service has not confirmed a dispute release, so the obligation stays DISPUTED and its funds held. The saga keeps trying; the log names the order.
              runbook: docs/runbooks/marketplace-saga-deploy.md
      - eval_time: 8h
        alertname: RastaMarketplaceSagaDisputeReleaseUnconfirmed
        exp_alerts: []
  - interval: 1h
    input_series:
      # Hourly rounds, then it is confirmed.
      - series: 'rasta_marketplace_saga_economic_call_unconfirmed_total{service="marketplace-service",operation="authoriseSettlement"}'
        values: '0 0 1 2 3 3 3 3 3'
    alert_rule_test:
      - eval_time: 1h
        alertname: RastaMarketplaceSagaEconomicCallUnconfirmed
        exp_alerts: []
      - eval_time: 4h
        alertname: RastaMarketplaceSagaEconomicCallUnconfirmed
        exp_alerts:
          - exp_labels:
              severity: critical
              operation: authoriseSettlement
            exp_annotations:
              summary: A saga's authoriseSettlement call is unconfirmed
              description: economic-service has given no answer proving the call changed nothing, or refused it while the funds may still be held. The saga keeps trying and moves nothing else; the log names the order and the refusal.
              runbook: docs/runbooks/marketplace-saga-deploy.md
      - eval_time: 8h
        alertname: RastaMarketplaceSagaEconomicCallUnconfirmed
        exp_alerts: []
  - interval: 1h
    input_series:
      # A refund refused on its first attempt with the funds held (D-127): hourly rounds.
      - series: 'rasta_marketplace_saga_economic_call_unconfirmed_total{service="marketplace-service",operation="compensate"}'
        values: '0 1 2 3'
    alert_rule_test:
      - eval_time: 2h
        alertname: RastaMarketplaceSagaEconomicCallUnconfirmed
        exp_alerts:
          - exp_labels:
              severity: critical
              operation: compensate
            exp_annotations:
              summary: A saga's compensate call is unconfirmed
              description: economic-service has given no answer proving the call changed nothing, or refused it while the funds may still be held. The saga keeps trying and moves nothing else; the log names the order and the refusal.
              runbook: docs/runbooks/marketplace-saga-deploy.md
