packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'
  - 'tests/*'

# pnpm blocks dependency lifecycle scripts by default. These compile native
# binaries or generate clients at install time and genuinely need to run.
allowBuilds:
  '@swc/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  # Analytics beacon pulled in transitively. Denied deliberately:
  # this repository does not phone home at install time.
  '@scarf/scarf': false

# Transitive pins for published advisories the direct dependency cannot yet
# resolve. Each entry states which advisory it closes, so an upgrade that makes
# it unnecessary is easy to spot and remove.
overrides:
  # GHSA-ggr8-5vv4-36mx — stack exhaustion on recursive object graphs. Reached
  # only through @prisma/config, which the Prisma CLI uses at build time; the
  # newest Prisma 6 still resolves 7.x, so the fix has to be pinned here.
  deepmerge-ts: '^8.0.0'
  # GHSA-2883-xcg3-v3hh — unbounded CPU use on empty merge sources. Reached
  # through the Jest coverage chain (js-yaml 3.x) and the ESLint config loader
  # (js-yaml 4.x); both parents still ask for a vulnerable release.
  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  # GHSA-535w-7cp7-47q4, GHSA-qfvm-cv95-jqjf, GHSA-wc9g-mqfw-jrwm — multipart
  # denial of service. @nestjs/platform-express pins multer 2.2.0 exactly, so
  # the patched release has to come from here.
  # GHSA-3pph-fpjx-jg34 (moderate, 2026-10-05) — 2.4.0 closes it as well.
  'multer@<2.4.0': '2.4.0'
  # GHSA-6g55-p6wh-862q and GHSA-r28c-9q8g-f849 — arbitrary file read and path
  # traversal through an attacker-controlled `sourceMappingURL` in a CSS
  # comment. Both are reached only through `next`, which still pins an affected
  # postcss, so the patched release has to come from here. 8.5.18 is the first
  # version that closes both.
  # GHSA-fxqj-rqcc-2cmp (moderate, 2026-10-05) moves the floor to 8.5.23; 8.5.28
  # is the newest release past the seven-day minimum age.
  'postcss@<8.5.23': '8.5.28'
  # CVE-2026-84292 and CVE-2026-84394 — authority injection through an
  # unvalidated port, and host confusion through an unbalanced URI. Reached
  # through ajv 8 (Nest's schema tooling and the build chain), which still
  # resolves an affected fast-uri. 3.1.7 is the first fixed 3.x; 3.1.8 is the
  # newest one past the seven-day minimum release age.
  'fast-uri@<3.1.7': '3.1.8'
  # GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7 (high), GHSA-q2hr-2g5m-vwhr
  # (moderate) — stack exhaustion in brace expansion. Reached through minimatch
  # in eslint, typescript-eslint, rimraf/glob and the OpenTelemetry GCP
  # detector; each parent still resolves an affected release of its major.
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=2.0.0 <2.1.7': '2.1.7'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'
  # GHSA-m9gg-hp2v-232j (high) — affects @grpc/grpc-js 1.14.0 up to 1.14.4. Reached
  # only through the OpenTelemetry OTLP gRPC exporters that
  # @opentelemetry/auto-instrumentations-node pulls in (packages/observability);
  # they still resolve an affected release of their range.
  '@grpc/grpc-js@>=1.14.0 <1.14.5': '1.14.5'
  # GHSA-jqcg-44mw-7w3h (critical) — proxy-addr <2.0.8. Reached through express
  # (@nestjs/platform-express) in every service and the gateway, where it decides
  # the client address behind a proxy. Express still resolves 2.0.7.
  'proxy-addr@<2.0.8': '2.0.8'
  # GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g (moderate) — qs, reached through
  # express and body-parser.
  'qs@>=6.0.0 <6.16.0': '6.16.0'
  # GHSA-r3ph-w7gj-g6xm (moderate) — js-yaml 5.x, reached through @nestjs/swagger.
  'js-yaml@>=5.0.0 <5.4.1': '5.4.2'
  # GHSA-jggr-w7fw-pc2j (moderate) — fast-copy 4.x, reached through pino-pretty
  # (development log formatting).
  'fast-copy@>=4.0.0 <4.1.0': '4.1.1'
  # GHSA-wq5f-xc86-pv6w (high) — sharp <0.35.5, reached through next (image
  # optimisation in the portal). Next still resolves 0.35.4; 0.35.5 is past the
  # seven-day minimum release age.
  'sharp@<0.35.5': '0.35.5'

# Advisories with NO patched release yet, accepted for a fixed time only. Each
# entry names the advisory, why it cannot be fixed by an override, where it is
# reached, and the date it must be re-checked; the CI "Dependency audit" step
# fails again for it once removed. Remove the entry as soon as a patched
# release exists (then pin it in overrides above instead).
auditConfig:
  ignoreGhsas:
    # GHSA-vfj7-8cjw-p6xm (high) — braces <=3.0.3, stack exhaustion on crafted
    # brace patterns. No patched release exists (3.0.3 is the newest on the
    # registry, 2026-10-03). Reached ONLY through development tooling (Jest's
    # micromatch, @types/jest -> expect, linters); pnpm audit --prod is clean,
    # so no service image or runtime path loads it. Patterns are written by
    # this repository, not by users. RE-CHECK BY 2026-10-17: if a patched
    # braces is out, pin it under overrides and delete this entry.
    - GHSA-vfj7-8cjw-p6xm
    # GHSA-68fv-2mgg-jv7q (high) — source-map-js <1.2.2, event-loop denial of
    # service through crafted source-map section offsets. The only patched
    # release, 1.2.2, was published 2026-09-30 and is inside the seven-day
    # minimum release age until 2026-10-07 14:08 UTC; this policy does not get
    # an exception for a six-day-old release. Reached through next/postcss and
    # tailwind at BUILD time and through the Temporal worker's webpack bundling
    # (marketplace) — source maps written by this repository, not by users.
    # REMOVE BY 2026-10-08: pin 'source-map-js@<1.2.2': '1.2.2' under overrides
    # and delete this entry.
    - GHSA-68fv-2mgg-jv7q
# A transitive dependency may not arrive from a git URL or a tarball over
# http. Everything here comes from the registry, and a sub-dependency that
# suddenly does not is worth stopping on.
blockExoticSubdeps: true

# --- Supply-chain policy (D-008, docs/23) ---------------------------------
# Both settings are also what the two Semgrep registry rules in CI's
# "Static analysis" step demand (pnpm-minimum-release-age, pnpm-trust-policy).
# pnpm re-verifies every lockfile entry against them on each install, so a
# lockfile committed under a weaker local policy fails CI rather than slipping
# through (trustLockfile stays at its default, false).

# Seven days, in minutes. A malicious release is usually pulled within hours;
# a week is the window in which the community, not this project, catches it.
minimumReleaseAge: 10080
# Strict: if no version in a requested range is old enough, the install fails
# instead of quietly taking the newest one. (This is the default once
# minimumReleaseAge is set explicitly; written out so nobody has to know that.)
minimumReleaseAgeStrict: true
# Named exceptions only — a package that must track the newest release goes
# here with the advisory or reason that justifies it, pinned to a version so
# the exception dies with it. Empty today: deepmerge-ts@8.0.2, the security
# pin that once needed one, aged out of the window on its own.
minimumReleaseAgeExclude: []

# Refuse a version whose publish carried weaker trust evidence (no provenance
# attestation) than an earlier-published version of the same package — the
# shape a hijacked maintainer account produces.
trustPolicy: no-downgrade
# Four releases reviewed on 2026-09-22 and judged legitimate (docs/23 D-008,
# per-package evidence there). Each is a maintenance-line release a
# long-standing maintainer published by hand, from a commit that exists in the
# upstream repository, between CI releases that carry provenance. Pinned to the
# exact version: a *different* release of the same package with the same shape
# is flagged again and reviewed again.
trustPolicyExclude:
  - chokidar@4.0.3
  - pino@9.14.0
  - semver@6.3.1
  - undici-types@6.21.0
