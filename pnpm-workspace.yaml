packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'
  - 'tests/*'

# pnpm blocks dependency lifecycle scripts by default. These compile native
# binaries or generate clients at install time and genuinely need to run.
allowBuilds:
  '@swc/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  # Analytics beacon pulled in transitively. Denied deliberately:
  # this repository does not phone home at install time.
  '@scarf/scarf': false

# Transitive pins for published advisories the direct dependency cannot yet
# resolve. Each entry states which advisory it closes, so an upgrade that makes
# it unnecessary is easy to spot and remove.
overrides:
  # GHSA-ggr8-5vv4-36mx — stack exhaustion on recursive object graphs. Reached
  # only through @prisma/config, which the Prisma CLI uses at build time; the
  # newest Prisma 6 still resolves 7.x, so the fix has to be pinned here.
  deepmerge-ts: '^8.0.0'
  # GHSA-2883-xcg3-v3hh — unbounded CPU use on empty merge sources. Reached
  # through the Jest coverage chain (js-yaml 3.x) and the ESLint config loader
  # (js-yaml 4.x); both parents still ask for a vulnerable release.
  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  # GHSA-535w-7cp7-47q4, GHSA-qfvm-cv95-jqjf, GHSA-wc9g-mqfw-jrwm — multipart
  # denial of service. @nestjs/platform-express pins multer 2.2.0 exactly, so
  # the patched release has to come from here.
  'multer@<2.3.0': '2.3.0'
  # GHSA-6g55-p6wh-862q and GHSA-r28c-9q8g-f849 — arbitrary file read and path
  # traversal through an attacker-controlled `sourceMappingURL` in a CSS
  # comment. Both are reached only through `next`, which still pins an affected
  # postcss, so the patched release has to come from here. 8.5.18 is the first
  # version that closes both.
  'postcss@<8.5.18': '8.5.18'

# A transitive dependency may not arrive from a git URL or a tarball over
# http. Everything here comes from the registry, and a sub-dependency that
# suddenly does not is worth stopping on.
blockExoticSubdeps: true

# --- Supply-chain policy (D-008, docs/23) ---------------------------------
# Both settings are also what the two Semgrep registry rules in CI's
# "Static analysis" step demand (pnpm-minimum-release-age, pnpm-trust-policy).
# pnpm re-verifies every lockfile entry against them on each install, so a
# lockfile committed under a weaker local policy fails CI rather than slipping
# through (trustLockfile stays at its default, false).

# Seven days, in minutes. A malicious release is usually pulled within hours;
# a week is the window in which the community, not this project, catches it.
minimumReleaseAge: 10080
# Strict: if no version in a requested range is old enough, the install fails
# instead of quietly taking the newest one. (This is the default once
# minimumReleaseAge is set explicitly; written out so nobody has to know that.)
minimumReleaseAgeStrict: true
# Named exceptions only — a package that must track the newest release goes
# here with the advisory or reason that justifies it, pinned to a version so
# the exception dies with it. Empty today: deepmerge-ts@8.0.2, the security
# pin that once needed one, aged out of the window on its own.
minimumReleaseAgeExclude: []

# Refuse a version whose publish carried weaker trust evidence (no provenance
# attestation) than an earlier-published version of the same package — the
# shape a hijacked maintainer account produces.
trustPolicy: no-downgrade
# Four releases reviewed on 2026-09-22 and judged legitimate (docs/23 D-008,
# per-package evidence there). Each is a maintenance-line release a
# long-standing maintainer published by hand, from a commit that exists in the
# upstream repository, between CI releases that carry provenance. Pinned to the
# exact version: a *different* release of the same package with the same shape
# is flagged again and reviewed again.
trustPolicyExclude:
  - chokidar@4.0.3
  - pino@9.14.0
  - semver@6.3.1
  - undici-types@6.21.0
