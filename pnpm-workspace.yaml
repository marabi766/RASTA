packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'
  - 'tests/*'

# pnpm blocks dependency lifecycle scripts by default. These compile native
# binaries or generate clients at install time and genuinely need to run.
allowBuilds:
  '@swc/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  # Analytics beacon pulled in transitively. Denied deliberately:
  # this repository does not phone home at install time.
  '@scarf/scarf': false

# Transitive pins for published advisories the direct dependency cannot yet
# resolve. Each entry states which advisory it closes, so an upgrade that makes
# it unnecessary is easy to spot and remove.
overrides:
  # GHSA-ggr8-5vv4-36mx — stack exhaustion on recursive object graphs. Reached
  # only through @prisma/config, which the Prisma CLI uses at build time; the
  # newest Prisma 6 still resolves 7.x, so the fix has to be pinned here.
  deepmerge-ts: '^8.0.0'
